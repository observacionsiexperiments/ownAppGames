<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Endevina el número · AppJocs</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Colors per rol (definits a css/styles.css):
       verd = OK/encert · rosa = esborrar/error · groc = pista · blau = info/selecció/focus · préssec = acció general */
    .joc { max-width: 680px; margin: 0 auto; width: 100%; }
    .intro { color: var(--text-suau); text-align: center; margin: 8px 0 20px; }

    /* Caixa de resposta: el color diu què passa */
    .pista {
      min-height: 4.5rem; margin: 20px 0 8px; padding: 16px;
      border-radius: var(--radi); background: var(--superficie); border: 2px solid var(--vora);
      text-align: center; font-size: 1.25rem; font-weight: 700;
      display: flex; flex-direction: column; justify-content: center; gap: 6px;
      transition: background-color .2s, border-color .2s;
    }
    .pista .extra { font-size: .95rem; font-weight: 500; }
    .pista .extra:empty { display: none; }
    .pista.es-pista   { background: var(--c-pista);     border-color: var(--c-pista-vora); }
    .pista.es-error   { background: var(--c-esborrar);  border-color: var(--c-esborrar-vora); }
    .pista.es-guanyat { background: var(--c-ok);        border-color: var(--c-ok-vora); font-size: 1.5rem; }

    /* Historial: informació → blau */
    .estat { display: flex; justify-content: space-between; color: var(--text-suau); font-size: .95rem; margin: 12px 4px; }
    .historial { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .historial li {
      padding: 4px 10px; border-radius: 999px; background: var(--c-info); font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .historial li.encert { background: var(--c-ok); }
    .accions { text-align: center; margin-top: 24px; }

    @keyframes sacseig { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .sacseig { animation: sacseig .25s 2; }

    /* ======== Disposició: esquerra = escriure; dreta = caixa de pistes + caixa d'intents i missatges ======== */
    .joc {
      display: grid; gap: 14px;
      grid-template-areas: "missatges" "pista" "form";
    }
    .joc { flex: 1 0 auto; align-content: center; padding-bottom: 8px; }   /* centrat a la pantalla */
    .caixa-missatges { grid-area: missatges; } .pista { grid-area: pista; } .zona-entrada { grid-area: form; }

    .caixa {
      background: var(--superficie); border: 2px solid var(--vora); border-radius: var(--radi);
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .etiqueta-caixa {
      margin: 0; font-size: .85rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-suau);
    }

    /* Caixa de pistes: el més gran de la pantalla */
    .pista { margin: 0; min-height: 190px; text-align: center; transition: background-color .2s, border-color .2s; }
    .pista .etiqueta-caixa { text-align: left; }
    .pista .dit { font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 600; opacity: .8; }
    .pista .dit:empty { display: none; }
    #pista-text { font-size: clamp(1.7rem, 3.8vw, 2.6rem); font-weight: 800; line-height: 1.15; flex: 1; display: grid; place-items: center; }
    .pista.es-pista   { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .pista.es-guanyat { background: var(--c-ok);    border-color: var(--c-ok-vora); }
    .ja-saps { text-align: left; border-top: 2px dashed var(--c-pista-vora); padding-top: 8px; }
    .ja-saps[hidden] { display: none; }
    .ja-saps b { font-size: 1rem; }
    .ja-saps ul { margin: 6px 0 0; padding-left: 1.2em; font-size: clamp(1rem, 1.8vw, 1.2rem); font-weight: 600; }
    .ja-saps li + li { margin-top: 4px; }
    .ja-saps li:first-child { font-weight: 800; }

    /* Caixa d'intents i missatges */
    .missatge {
      padding: 10px 12px; border-radius: 14px; background: var(--fons); border: 2px solid var(--vora);
      font-size: clamp(1.15rem, 2.4vw, 1.5rem); font-weight: 700; text-align: center;
      transition: background-color .2s, border-color .2s;
    }
    .missatge small { display: block; font-size: .8em; font-weight: 600; margin-top: 4px; }
    .missatge small:empty { display: none; }
    .missatge.es-error   { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .missatge.es-guanyat { background: var(--c-ok);       border-color: var(--c-ok-vora); }
    .estat { margin: 0 2px; font-size: 1.1rem; }
    .historial li { font-size: 1.15rem; padding: 6px 14px; }
    .historial:empty { display: none; }
    .accions { margin: 0; text-align: center; }

    /* Tauleta horitzontal i PC ample */
    @media (min-width: 900px) and (orientation: landscape), (min-width: 1100px) {
      .joc {
        max-width: 1150px; column-gap: 28px; align-items: start;
        grid-template-columns: minmax(360px, 440px) 1fr;
        grid-template-areas: "form pista" "form missatges";
        grid-template-rows: auto auto;
      }
      .pista { min-height: 280px; }
    }

    /* Horitzontal baix: tot a la vista */
    @media (orientation: landscape) and (max-height: 820px) {
      .joc { gap: 10px; }
      .pista { min-height: 0 !important; padding: 10px 14px; gap: 6px; }
      #pista-text { font-size: clamp(1.4rem, 4.6vh, 2.2rem); }
      .ja-saps ul { font-size: 1rem; }
      .caixa { padding: 10px 14px; gap: 6px; }
      .missatge { font-size: 1.15rem; padding: 6px 10px; }
      .historial li { font-size: 1rem; padding: 3px 10px; }
    }

    /* Mòbil: l'entrada surt en una finestra (js/finestra-entrada.js); a la pàgina hi ha una caixa per tocar */
    .fe-lloc { grid-area: lloc; }
    .mode-finestra .joc { grid-template-columns: 1fr; grid-template-areas: "missatges" "pista" "lloc"; grid-template-rows: none; }
    .mode-finestra .pista { min-height: 150px; }
    .mode-finestra .fe-disparador { margin: 0; font-size: 1.5rem; min-height: 72px; }
    @media (orientation: landscape) {
      .mode-finestra .joc { grid-template-columns: 1fr 1fr; grid-template-areas: "pista missatges" "pista lloc"; column-gap: 12px; }
      .mode-finestra .pista { min-height: 0; }
    }
    .fe-info .pista { min-height: 0 !important; padding: 8px 12px; gap: 4px; }
    .fe-info #pista-text { font-size: 1.5rem; }
    .fe-info .pista .dit { font-size: 1rem; }
    .fe-info .ja-saps ul { font-size: .95rem; max-height: 16vh; overflow-y: auto; }
    .fe-info .missatge { font-size: 1rem; }

    /* Tauleta en vertical: escriure a la dreta, intents i pista a l'esquerra */
    @media (orientation: portrait) and (min-width: 601px) {
      .joc { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); grid-template-areas: "missatges form" "pista form"; column-gap: 16px; max-width: 900px; }
    }
  </style>
</head>
<body>
  <nav class="barra-joc">
    <a href="../../">← Inici</a>
    <h1>🔢 Endevina el número</h1>
  </nav>

  <main class="joc">
    <section class="caixa pista" id="pista" aria-live="polite">
      <h2 class="etiqueta-caixa">💡 Pista</h2>
      <span class="dit" id="pista-dit"></span>
      <span id="pista-text">Fes el primer intent 🙂</span>
      <div class="ja-saps" id="ja-saps" hidden>
        <b>Ja saps que…</b>
        <ul id="llista-saps"></ul>
      </div>
    </section>

    <div class="zona-entrada" id="entrada-num"></div>

    <section class="caixa caixa-missatges" aria-live="polite">
      <h2 class="etiqueta-caixa">🎯 Intents</h2>
      <div class="missatge" id="missatge"><span id="msg-text"></span><small id="msg-extra"></small></div>
      <div class="estat">
        <span>Intents: <b id="intents">0</b></span>
        <span>Rècord: <b id="record">–</b></span>
      </div>
      <ul class="historial" id="historial" aria-label="Números provats"></ul>
      <div class="accions"><button class="btn" id="btn-nova" type="button">Nova partida</button></div>
    </section>
  </main>

  <script src="../../js/reconeixedor-xifres.js"></script>
  <script src="../../js/entrada-numero.js"></script>
  <script src="../../js/finestra-entrada.js"></script>
  <script src="../../js/pantalla.js"></script>
  <script src="../../js/celebracio.js"></script>
  <script>
    const MIN = 1, MAX = 100;
    const CLAU_RECORD = 'appjocs.endevina-numero.record';

    const $ = id => document.getElementById(id);
    const pista = $('pista');
    let secret, intents, provats, acabat;

    // Entrada de números comuna a tots els jocs (teclat o dibuix, número sencer o xifra a xifra)
    const entradaNum = EntradaNumero.crear($('entrada-num'), {
      maxXifres: 3, mida: 'gran',
      clauMode: 'appjocs.endevina-numero.mode',
      enEnviar: provar,
    });

    function nova() {
      secret = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
      intents = 0; provats = []; acabat = false;
      $('intents').textContent = '0';
      $('historial').innerHTML = '';
      sabem = []; $('llista-saps').innerHTML = ''; $('ja-saps').hidden = true;
      mostrarPista('Fes el primer intent 🙂');
      missatge(`🤔 He pensat un número entre l'${MIN} i el ${MAX}`, "L'endevines?");
      finestra.tancar(); $('entrada-num').hidden = false;
      entradaNum.activar(true);
      entradaNum.buidar();
      entradaNum.enfocar();
    }

    // estat: '' (neutre) | 'pista' | 'error' | 'guanyat'  → decideix el color de la caixa
    // Caixa de pistes: estat '' | 'pista' | 'guanyat'. dit: "Has dit el 42"
    function mostrarPista(text, estat = '', dit = '') {
      $('pista-dit').textContent = dit;
      $('pista-text').textContent = text;
      pista.classList.remove('es-pista', 'es-guanyat');
      if (estat) pista.classList.add('es-' + estat);
    }
    // Caixa d'intents: missatges (benvinguda, errors, victòria). estat '' | 'error' | 'guanyat'
    function missatge(text, extra = '', estat = '') {
      const m = $('missatge');
      $('msg-text').textContent = text; $('msg-extra').textContent = extra;
      m.classList.remove('es-error', 'es-guanyat');
      if (estat) m.classList.add('es-' + estat);
    }
    // "Ja saps que…": les ajudes i pistes especials que s'han anat guanyant (la més nova a dalt)
    let sabem = [];
    function afegirSaber(t) {
      if (!t || sabem.includes(t)) return;
      sabem.unshift(t);
      $('llista-saps').innerHTML = '';
      sabem.forEach(x => { const li = document.createElement('li'); li.textContent = x; $('llista-saps').appendChild(li); });
      $('ja-saps').hidden = false;
    }

    // Pista principal segons la distància al número secret
    function pistaDistancia(n) {
      const d = Math.abs(secret - n);
      const dir = secret > n ? 'gran' : 'petit';
      if (d <= 2)  return `🔥 Gairebé! És una mica més ${dir}`;
      if (d <= 10) return `${dir === 'gran' ? '⬆️' : '⬇️'} Més ${dir}, però a prop`;
      if (d <= 25) return `${dir === 'gran' ? '⬆️' : '⬇️'} Més ${dir}`;
      return `${dir === 'gran' ? '⏫' : '⏬'} Molt més ${dir}!`;
    }

    // Pistes especials: relacions curioses entre el número provat i el secret
    function pistaEspecial(n) {
      for (const k of [2, 3, 4, 5]) {
        if (n * k === secret) return `✨ Si multipliques el ${n} per ${k}, ja el tens!`;
        if (n === secret * k) return `✨ Si divideixes el ${n} entre ${k}, ja el tens!`;
      }
      if (n >= 10 && secret >= 10 && n % 10 !== 0 && secret % 10 !== 0) {
        const alReves = Number(String(n).split('').reverse().join(''));
        if (alReves === secret) return `✨ Té les mateixes xifres que el ${n}, però al revés!`;
      }
      if (n + 10 === secret) return `✨ Si al ${n} li sumes 10, ja el tens!`;
      if (n - 10 === secret) return `✨ Si al ${n} li restes 10, ja el tens!`;
      return '';
    }

    // Pistes d'ajuda que surten a mesura que costa més
    function pistaAjuda() {
      if (intents === 4) return `És un número ${secret % 2 === 0 ? 'parell' : 'senar'}.`;
      if (intents === 7) {
        const desena = Math.floor(secret / 10) * 10;
        return secret === 100 ? 'És el més gran de tots!'
                              : `Està entre ${Math.max(desena, 1)} i ${desena + 9}.`;
      }
      if (intents === 10) return `Les seves xifres sumen ${String(secret).split('').reduce((a, b) => a + +b, 0)}.`;
      return '';
    }

    function afegirHistorial(n) {
      const li = document.createElement('li');
      li.textContent = n === secret ? `${n} ✅` : `${n} ${secret > n ? '↑' : '↓'}`;
      if (n === secret) li.className = 'encert';
      $('historial').appendChild(li);
    }

    function llegirRecord() {
      try { return Number(localStorage.getItem(CLAU_RECORD)) || null; } catch { return null; }
    }
    function desarRecord(v) {
      try { localStorage.setItem(CLAU_RECORD, String(v)); } catch {}
    }
    function pintarRecord() {
      const r = llegirRecord();
      $('record').textContent = r ? `${r} intents` : '–';
    }

    function sacsejar(el = pista) {
      el.classList.remove('sacseig'); void el.offsetWidth; el.classList.add('sacseig');
    }

    // Mòbil: l'entrada surt en una finestra en tocar la caixa
    const finestra = FinestraEntrada.crear({
      entrada: $('entrada-num'), info: [$('pista'), $('missatge')],
      avis: '✏️ Toca aquí per escriure un número', disparador: true, ampla: true,
      enObrir: () => entradaNum.ajustar(),
    });

    function provar(n) {
      if (acabat) return;
      entradaNum.buidar();
      entradaNum.enfocar();
      if (!Number.isInteger(n) || n < MIN || n > MAX) {
        missatge(`Escriu un número de l'${MIN} al ${MAX}`, '', 'error'); sacsejar($('missatge')); return;
      }
      if (provats.includes(n)) {
        missatge(`Ja has provat el ${n} 😉`, 'Prova un altre número.', 'error'); sacsejar($('missatge')); return;
      }

      intents++; provats.push(n);
      $('intents').textContent = intents;
      afegirHistorial(n);

      if (n === secret) {
        acabat = true;
        const r = llegirRecord();
        let extra = `Ho has aconseguit en ${intents} ${intents === 1 ? 'intent' : 'intents'}.`;
        if (!r || intents < r) { desarRecord(intents); extra += ' 🏅 Nou rècord!'; }
        missatge(`🎉 Sí! Era el ${secret}!`, extra, 'guanyat');
        mostrarPista(`🎉 ${secret}`, 'guanyat', `Has dit el ${n}`);
        pintarRecord();
        entradaNum.activar(false); finestra.tancar();
        if (finestra.activa()) $('entrada-num').hidden = true;   // en mòbil, fora la caixa per tocar
        // Premi: menys intents, més estrelles (amb 7 intents sempre es pot trobar)
        const estrelles = intents <= 5 ? 3 : intents <= 8 ? 2 : 1;
        Celebracio.gran({
          titol: `Era el ${secret}!`, estrelles,
          subtitol: extra,
          boto: 'Continuar', enTancar: () => $('btn-nova').focus(),
        });
        return;
      }

      mostrarPista(pistaDistancia(n), 'pista', `Has dit el ${n}`);
      afegirSaber(pistaEspecial(n)); afegirSaber(pistaAjuda());
      missatge(`Intent ${intents}`, 'Mira la pista i torna-ho a provar.');
      sacsejar();
    }

    $('btn-nova').addEventListener('click', nova);

    pintarRecord();
    nova();

    // Avís suau si el dispositiu està en l'orientació que pitjor li va a aquest joc
    Pantalla.avisOrientacio('endevina-numero', { abans: document.querySelector('main') });
  </script>
</body>
</html>
