<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Rima que rima · Juguem?</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <script>try{var t=JSON.parse(localStorage.getItem("appjocs.preferencies")||"{}").aparenca;if(t==="fosc"||t==="clar")document.documentElement.dataset.tema=t}catch(e){}</script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Colors per rol (css/styles.css): verd = encert · rosa = error · groc = pista · blau = informació · préssec = respostes */
    [hidden] { display: none !important; }
    h2.titol { font-size: 1.15rem; margin: 16px 0 8px; }

    /* ---------- Inici: una sola pregunta ---------- */
    .inici { max-width: 760px; margin: 0 auto; }
    .opcions { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opcions button { font: inherit; cursor: pointer; color: var(--text); touch-action: manipulation; min-height: 64px; font-weight: 700; font-size: 1.15rem; padding: 6px;
      background: var(--superficie); border: 2px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra); }
    .opcions button b { display: block; font-size: 1.25em; }
    .opcions button small { display: block; font-weight: 500; font-size: .85rem; color: var(--text-suau); }
    .opcions button[aria-pressed="true"] { background: var(--c-info); border-color: var(--c-info-vora); color: var(--tinta); }
    .opcions button[aria-pressed="true"] small { color: var(--tinta); }
    @media (hover: hover) { .opcions button:hover { border-color: var(--c-info-vora); } }
    .comencar { text-align: center; margin: 24px 0 8px; }
    .comencar .btn { font-size: 1.3rem; padding: 14px 40px; }
    .inici .explica { text-align: center; color: var(--text-suau); }

    /* ---------- Joc ---------- */
    .cap-joc { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 12px; }
    .dades { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dada { background: var(--superficie); border: 1px solid var(--vora); border-radius: 999px; padding: 4px 12px; font-size: .95rem; white-space: nowrap; }
    .dada b { font-variant-numeric: tabular-nums; }
    .progres { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
    .progres i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--vora); background: var(--superficie); }
    .progres i.be { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .progres i.ajuda { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .progres i.malament { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .progres i.fet { background: var(--vora); }
    .progres i.apuntada { background: color-mix(in srgb, var(--c-info) 55%, var(--superficie)); border-style: dashed; border-color: var(--c-info-vora); }
    .progres i.ara { background: var(--c-info); border-color: var(--c-info-vora); }

    .tauler { background: var(--superficie); border: 2px solid var(--vora); border-radius: var(--radi); padding: 16px 20px;
      display: flex; flex-direction: column; gap: 12px; --op: clamp(1.15rem, 2.6vw, 1.7rem); }
    .enunciat { margin: 0; text-align: center; font-weight: 700; font-size: clamp(1.05rem, 2.2vw, 1.3rem); }
    #zona { display: flex; flex-direction: column; gap: 14px; }
    /* La paraula de dalt */
    .objectiu { display: flex; align-items: center; justify-content: center; gap: .4em; padding: 10px 14px; margin: 0 auto; min-width: min(100%, 320px); }
    .objectiu .emoji { font-size: calc(var(--op) * 2.2); line-height: 1; }
    .objectiu .mot { font: 900 calc(var(--op) * 1.7) "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; letter-spacing: .02em; }
    .rima-part { color: var(--c-info-vora); text-decoration: underline; text-decoration-thickness: .1em; text-underline-offset: .12em; }
    .op .rima-part, .op.be .rima-part, .op.dita .rima-part { color: inherit; }
    .ensenya .rima-part { background: var(--c-pista); color: var(--tinta); border-radius: 6px; text-decoration: none; padding: 0 .05em; }

    /* Targetes */
    .opcions-joc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: min(100%, 760px); margin: 0 auto; }
    .opcions-joc.quatre { grid-template-columns: repeat(2, minmax(0, 1fr)); width: min(100%, 640px); }
    .op { font: inherit; cursor: pointer; color: var(--text); touch-action: manipulation; position: relative;
      background: var(--superficie); border: 3px solid var(--vora); border-radius: 16px; box-shadow: var(--ombra);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 8px; min-height: 4em; }
    .op .emoji { font-size: calc(var(--op) * 1.9); line-height: 1.1; }
    .op .nom { font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 800; font-size: var(--op); white-space: nowrap; letter-spacing: .02em; }
    .op:disabled { cursor: default; }
    .op.mal { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .op.be { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .op.dita { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .op.apagada { opacity: .45; }
    @media (hover: hover) { .op:not(:disabled):hover { border-color: var(--c-info-vora); } }
    /* Difícil: la targeta d'escriptura lliure */
    .op.lliure { border-style: dashed; border-color: var(--c-info-vora); background: color-mix(in srgb, var(--c-info) 35%, var(--superficie)); }
    .op.lliure .nom { font-size: calc(var(--op) * .85); }
    .op.lliure.oberta { cursor: default; padding: 8px; }
    .lliure-form { display: flex; gap: 6px; width: 100%; align-items: stretch; }
    .lliure-form input { flex: 1 1 auto; min-width: 0; font: 800 var(--op) "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; color: var(--text);
      background: var(--superficie); border: 2px solid var(--c-info-vora); border-radius: 12px; padding: .2em .4em; text-align: center; outline: none; }
    .lliure-form input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-info) 60%, transparent); }
    .lliure-form button { flex: none; font: inherit; font-weight: 800; cursor: pointer; border-radius: 12px; padding: 0 .8em;
      background: var(--c-ok); border: 2px solid var(--c-ok-vora); color: var(--tinta); }
    .op.lliure.apuntada { border-style: solid; background: color-mix(in srgb, var(--c-info) 55%, var(--superficie)); }
    .op.lliure.apuntada input { opacity: 1; color: var(--tinta); background: transparent; border-color: transparent; }
    .op.lliure.apuntada button { display: none; }
    .op.lliure.apuntada .lliure-form::before { content: '📝'; align-self: center; font-size: var(--op); }

    .missatge { min-height: 3.2rem; padding: 8px 12px; border-radius: var(--radi); text-align: center; background: var(--superficie);
      border: 2px solid var(--vora); font-weight: 700; font-size: 1.1rem; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .missatge small { font-weight: 500; font-size: .98rem; }
    .missatge small:empty { display: none; }
    .missatge.es-pista { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .missatge.es-error { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .missatge.es-guanyat { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .missatge.es-info { background: var(--c-info); border-color: var(--c-info-vora); color: var(--tinta); }
    .peu { display: flex; flex-direction: column; gap: 10px; }
    .botons-peu { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn-pista { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    @keyframes sacseig { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .sacseig { animation: sacseig .25s 2; }

    /* Tauleta i portàtil (criteri «ple») */
    @media (min-width: 601px) and (min-height: 501px) {
      .tauler { --op: clamp(1.3rem, min(3.2vw, 4.2vh), 2.4rem); padding: 16px 24px; gap: clamp(10px, 2vh, 20px); }
      .enunciat { font-size: clamp(1.1rem, 2.8vh, 1.6rem); }
      #zona { flex: 1 1 auto; min-height: 0; justify-content: center; gap: clamp(12px, 3vh, 34px); }
      .opcions-joc { width: min(100%, 1000px); gap: clamp(12px, 1.8vw, 24px); }
      .opcions-joc.quatre { width: min(100%, 900px); }
      .op { min-height: 0; padding: clamp(10px, 2.4vh, 26px) 10px; }
    }
    @media (orientation: portrait) and (min-width: 601px) and (min-height: 501px) {
      .tauler { --op: clamp(1.3rem, min(4.6vw, 3.6vh), 2.4rem); }
      .opcions-joc, .opcions-joc.quatre { width: 100%; }
    }
    /* Mòbil */
    @media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 500px) {
      .barra-joc { padding: 6px 0; }
      .barra-joc h1 { font-size: 1.1rem; }
      .cap-joc { margin: 0 0 6px; gap: 6px; }
      .dada { font-size: .8rem; padding: 2px 8px; }
      .progres i { width: 8px; height: 8px; }
      .cap-joc .btn { padding: 5px 10px; font-size: .85rem; white-space: nowrap; }
      .tauler { padding: 10px; gap: 8px; --op: 1.05rem; }
      .enunciat { font-size: .95rem; }
      .opcions-joc { gap: 8px; }
      .op { padding: 6px; min-height: 3.4em; border-width: 2px; }
      .missatge { min-height: 0; padding: 5px 8px; font-size: .95rem; }
      .missatge small { font-size: .85rem; }
      .botons-peu .btn { padding: 6px 14px; font-size: .95rem; }
      .inici .explica { font-size: .9rem; }
    }
    @media (orientation: portrait) and (max-width: 600px) {
      .progres { display: none; }
      .tauler { --op: clamp(1.05rem, min(5.4vw, 3vh), 1.6rem); }
      #zona { flex: 1 1 auto; min-height: 0; justify-content: center; gap: clamp(10px, 2.6vh, 24px); }
      .opcions-joc { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .opcions-joc.tres .op:last-child { grid-column: 1 / -1; }
      .op { padding: clamp(8px, 2.6vh, 26px) 6px; }
      main.joc.ple > #pantalla-inici { justify-content: center; }
      main.joc.ple .inici > .grup { flex: none; max-height: none; }
      #op-nivell button { min-height: clamp(90px, 16vh, 150px); }
    }
    /* Mòbil apaïsat: la paraula i les targetes a l'esquerra; el missatge i la pista a la dreta */
    @media (orientation: landscape) and (max-height: 500px) {
      .tauler { display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, 250px); grid-template-areas: "enun peu" "zona peu"; column-gap: 16px; row-gap: 6px; padding: 8px 14px; --op: 1.1rem; }
      .tauler .enunciat { grid-area: enun; }
      .tauler #zona { grid-area: zona; gap: 8px; }
      .tauler .peu { grid-area: peu; align-self: center; }
      .objectiu { padding: 4px 10px; }
      .objectiu .emoji { font-size: calc(var(--op) * 1.8); }
      .objectiu .mot { font-size: calc(var(--op) * 1.5); }
      .opcions-joc { gap: 6px; }
      .opcions-joc:not(.quatre) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .opcions-joc.quatre { grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
      .op { min-height: 0; padding: 8px 4px; }
      .op .emoji { font-size: calc(var(--op) * 1.6); }
      .inici .explica { display: none; }
      .comencar { margin: 12px 0 4px; }
      #op-nivell button { min-height: 70px; }
    }
    @media (min-width: 601px) and (min-height: 501px) {
      main.joc.ple > #pantalla-inici { justify-content: center; }
      main.joc.ple .inici > .grup { flex: none; max-height: none; }
      #op-nivell button { min-height: clamp(90px, 20vh, 200px); font-size: clamp(1.2rem, 3.4vh, 1.9rem); }
    }
  </style>
</head>
<body>
  <nav class="barra-joc">
    <a href="../../">← Inici</a>
    <h1>🎵 Rima que rima</h1>
  </nav>

  <main class="joc ple">
    <!-- ================= INICI ================= -->
    <section class="inici" id="pantalla-inici">
      <div class="grup">
        <h2 class="titol">Dificultat</h2>
        <div class="opcions" id="op-nivell">
          <button type="button" data-v="facil" aria-pressed="true"><b>🌱 Fàcil</b><small>amb dibuixos · 3 targetes</small></button>
          <button type="button" data-v="mitja" aria-pressed="false"><b>Mitjà</b><small>amb dibuixos · 4 targetes</small></button>
          <button type="button" data-v="dificil" aria-pressed="false"><b>Difícil</b><small>sense dibuixos · i n'escrius una</small></button>
        </div>
      </div>
      <p class="explica">Busca la paraula que rima: la que acaba igual, com «gat» i «plat».</p>
      <div class="comencar"><button class="btn" id="btn-comencar" type="button">Comença! 🎵</button></div>
    </section>

    <!-- ================= JOC ================= -->
    <section id="pantalla-joc" hidden>
      <div class="cap-joc">
        <div class="dades" id="dades"></div>
        <button class="btn" id="btn-nova" type="button">↺ Nova partida</button>
      </div>
      <div class="tauler" id="tauler">
        <p class="enunciat" id="enunciat">Quina rima amb aquesta?</p>
        <div id="zona"></div>
        <div class="peu franja">
          <div class="missatge" id="missatge" aria-live="polite"><span id="msg-text"></span><small id="msg-extra"></small></div>
          <div class="botons-peu">
            <button class="btn btn-pista" id="btn-pista" type="button">💡 <span class="txt-llarg">Vull una pista</span><span class="txt-curt">Pista</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/pantalla.js"></script>
  <script src="../../js/preferencies.js"></script>
  <script src="../../js/celebracio.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const RONDES = 10;
    const CLAU_NIVELL = 'appjocs.rima.nivell';
    const config = { nivell: 'facil' };
    let D = null, P = null, resultats = [], idx = -1, errors = 0, ambAjuda = false, esperant = false, seguentT = null, usats = [], escrites = [];

    const triar = a => a[Math.floor(Math.random() * a.length)];
    const barrejar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const net = t => t.normalize('NFD').replace(/[̀-̇̉-ͯ]/g, '').normalize('NFC').toLowerCase();   // treu accents (no la dièresi)
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    const dibuixos = () => config.nivell !== 'dificil';

    // ---------------- Inici ----------------
    try { const v = localStorage.getItem(CLAU_NIVELL); if (['facil', 'mitja', 'dificil'].includes(v)) config.nivell = v; } catch {}
    const botonsNivell = $('op-nivell').querySelectorAll('button');
    const marcarNivell = () => botonsNivell.forEach(b => b.setAttribute('aria-pressed', b.dataset.v === config.nivell));
    botonsNivell.forEach(b => b.addEventListener('click', () => { config.nivell = b.dataset.v; marcarNivell(); try { localStorage.setItem(CLAU_NIVELL, config.nivell); } catch {} }));
    marcarNivell();

    $('btn-comencar').addEventListener('click', comencar);
    $('btn-nova').addEventListener('click', () => { clearTimeout(seguentT); Celebracio.tancar(); $('pantalla-joc').hidden = true; $('pantalla-inici').hidden = false; });
    $('btn-pista').addEventListener('click', () => { if (esperant) { ambAjuda = true; donarPista(); $('btn-pista').disabled = true; pintarDades(); } });

    async function comencar() {
      try { if (!D) D = await fetch('rimes.json').then(r => r.json()); }
      catch (e) { console.error(e); alert("No s'han pogut carregar les paraules. Torna-ho a provar."); return; }
      idx = -1; resultats = []; usats = []; escrites = [];
      $('pantalla-inici').hidden = true; $('pantalla-joc').hidden = false;
      window.scrollTo({ top: 0 });
      seguent();
    }

    // ---------------- Rimes ----------------
    // Paraules d'un grup que poden sortir: al Fàcil i al Mitjà només les que tenen dibuix
    const paraulesDe = g => dibuixos() ? g.dibuix : [...g.dibuix, ...g.escrites.map(p => ({ p }))];
    const totes = g => [...g.dibuix.map(x => x.p), ...g.escrites];
    // Rima una paraula amb el grup? Ha d'acabar igual des de la vocal forta.
    // Si abans de la terminació hi ha una vocal amb accent, la força és allà i no rima («pèsol» no rima amb «sol»).
    // Als grups acabats en vocal forta (-ó, -à) cal l'accent, tret dels monosíl·labs («pa», «ja»).
    function rimaAmb(paraula, g) {
      const w = paraula.toLowerCase(), r = g.rima;
      if (!w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').endsWith(r)) return false;
      const abans = w.slice(0, w.length - r.length), fi = w.slice(-r.length);
      if (/[àèéíòóú]/.test(abans)) return false;
      if (['o', 'a'].includes(r)) return /[àèéíòóú]/.test(fi) || !/[aeiouàèéíòóúïü]/.test(abans.replace(/(qu|gu)/g, ''));
      return true;
    }
    // La paraula amb la part que rima marcada
    function ambRima(p, g) {
      const n = net(p).length - g.rima.length;
      const s = el('span');
      s.append(document.createTextNode(p.slice(0, n)), el('span', 'rima-part', p.slice(n)));
      return s;
    }

    function crearRonda() {
      const ok = D.grups.filter(g => paraulesDe(g).length >= 2 && !usats.includes(g.rima));
      const g = triar(ok.length ? ok : D.grups.filter(g => paraulesDe(g).length >= 2));
      usats.push(g.rima); if (usats.length > 8) usats.shift();
      const [obj, bona] = barrejar(paraulesDe(g)).slice(0, 2);
      const nFals = config.nivell === 'mitja' ? 3 : 2;
      // Les que no rimen: d'altres grups, millor si comencen igual que la de dalt (cal escoltar el final, no el principi)
      const altres = D.grups.filter(x => x !== g).flatMap(x => paraulesDe(x).map(w => ({ ...w, g: x }))).filter(w => !rimaAmb(w.p, g));
      const inicial = net(obj.p)[0];
      const iguals = barrejar(altres.filter(w => net(w.p)[0] === inicial));
      const falses = [];
      for (const w of [...iguals.slice(0, 1), ...barrejar(altres)]) {
        if (falses.length >= nFals) break;
        if (!falses.some(f => f.p === w.p || f.g === w.g) && w.p !== obj.p) falses.push(w);
      }
      const ops = barrejar([{ ...bona, bona: true }, ...falses]);
      return { g, obj, bona, ops };
    }

    // ---------------- Ronda ----------------
    function seguent() {
      clearTimeout(seguentT);
      idx++;
      if (idx >= RONDES) return final();
      errors = 0; ambAjuda = false; esperant = true;
      P = crearRonda();
      const z = $('zona'); z.innerHTML = '';
      // La paraula de dalt
      const o = el('div', 'objectiu safata-pregunta'); o.id = 'objectiu';
      if (dibuixos() && P.obj.e) o.appendChild(el('span', 'emoji', P.obj.e));
      const mot = el('span', 'mot', P.obj.p); mot.id = 'mot-obj';
      o.appendChild(mot); z.appendChild(o);
      // Les targetes
      const n = P.ops.length + (dibuixos() ? 0 : 1);
      const g = el('div', 'opcions-joc ' + (n === 4 ? 'quatre' : 'tres'));
      P.botons = P.ops.map((w, i) => {
        const b = el('button', 'op opcio-resposta'); b.type = 'button';
        if (dibuixos() && w.e) b.appendChild(el('span', 'emoji', w.e));
        b.appendChild(el('span', 'nom', w.p));
        b.addEventListener('click', () => triarOp(i));
        g.appendChild(b); return b;
      });
      if (!dibuixos()) g.appendChild(crearLliure());
      z.appendChild(g);
      $('btn-pista').disabled = false;
      mostrar('Quina rima amb «' + P.obj.p + '»?', dibuixos() ? 'Toca la targeta que acaba igual.' : 'Toca la targeta que acaba igual, o escriu-ne una tu.');
      pintarDades();
    }

    // ---------------- Difícil: «✏️ N'escric una» ----------------
    function crearLliure() {
      const b = el('div', 'op lliure'); b.tabIndex = 0; b.setAttribute('role', 'button');
      b.appendChild(el('span', 'nom', '✏️ N\'escric una'));
      const obrir = () => {
        if (!esperant || b.classList.contains('oberta')) return;
        b.classList.add('oberta'); b.removeAttribute('role'); b.tabIndex = -1; b.innerHTML = '';
        const f = el('form', 'lliure-form'); f.autocomplete = 'off';
        const inp = el('input'); inp.type = 'text'; inp.maxLength = 20; inp.setAttribute('aria-label', 'Escriu una paraula que rimi'); inp.placeholder = '…' + P.g.rima;
        inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('spellcheck', 'false'); inp.enterKeyHint = 'done';
        const ok = el('button', '', 'OK'); ok.type = 'submit';
        f.append(inp, ok); b.appendChild(f);
        f.addEventListener('submit', e => { e.preventDefault(); apuntarLliure(inp.value, inp); });
        setTimeout(() => inp.focus(), 30);
      };
      b.addEventListener('click', obrir);
      b.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !b.classList.contains('oberta')) { e.preventDefault(); obrir(); } });
      P.lliure = b;
      return b;
    }
    // L'app no corregeix la paraula escrita (en coneix massa poques): l'apunta perquè la miri un adult al final
    // i l'infant continua triant la targeta que rima. No compta per als punts.
    function apuntarLliure(text, inp) {
      if (!esperant) return;
      const w = text.trim().replace(/\s+/g, ' ');
      if (!w) return;
      if (net(w) === net(P.obj.p)) { mostrar('Aquesta ja és la de dalt', 'Escriu-ne una altra que acabi igual.', 'info'); inp.select(); return; }
      escrites.push({ obj: P.obj.p, w });
      // La ronda s'acaba aquí: la paraula escrita no es corregeix ni compta per als punts (ni a favor ni en contra)
      esperant = false; resultats.push('apuntada');
      P.lliure.classList.add('apuntada');
      inp.value = w; inp.blur(); inp.disabled = true; P.lliure.querySelector('button').disabled = true;
      bloquejar(P.lliure);
      // S'ensenya també una de les targetes que rimen, perquè la vegin
      const i = P.ops.findIndex(x => x.bona);
      P.botons[i].classList.remove('apagada'); P.botons[i].classList.add('dita');
      marcarRima(P.botons[i], P.bona.p);
      $('btn-pista').disabled = true;
      mostrar('📝 Apuntada!', `Al final la mirareu amb un adult. Una altra que rima: «${P.bona.p}».`, 'info');
      pintarDades();
      seguentT = Pantalla.despres(seguent, 0, true);
    }

    // ---------------- Respondre ----------------
    function triarOp(i) {
      if (!esperant) return;
      const b = P.botons[i], w = P.ops[i];
      if (w.bona) return encert(b, w.p);
      fallar(b, w.p);
    }
    function encert(b, p, titol) {
      esperant = false;
      resultats.push(errors === 0 && !ambAjuda ? 'be' : 'ajuda');
      b.classList.add('be');
      bloquejar(b);
      marcarRima(b, p);
      Celebracio.petita(b);
      mostrar(titol || Preferencies.felicitacio('✓ Molt bé!'), `«${P.obj.p}» i «${p}» acaben igual: -${P.g.rima}.`, 'guanyat');
      $('btn-pista').disabled = true;
      pintarDades();
      seguentT = Pantalla.despres(seguent, 1600);
    }
    function fallar(b, p) {
      errors++;
      if (b) { b.classList.add('mal'); b.disabled = true; sacsejar(b); }
      if (errors === 1) mostrar(`«${p}» no rima amb «${P.obj.p}»`, 'Torna-ho a provar.', 'error');
      else if (errors === 2) { ambAjuda = true; donarPista(); $('btn-pista').disabled = true; $('msg-text').textContent = `«${p}» tampoc rima`; }
      else {
        esperant = false; resultats.push('malament');
        const i = P.ops.findIndex(w => w.bona);
        P.botons[i].classList.add('dita');
        bloquejar(P.botons[i]);
        marcarRima(P.botons[i], P.bona.p);
        mostrar(`La que rima és «${P.bona.p}»`, `«${P.obj.p}» i «${P.bona.p}» acaben igual: -${P.g.rima}.`, 'pista');
        $('btn-pista').disabled = true;
        seguentT = Pantalla.despres(seguent, 3000, true);
      }
      pintarDades();
    }
    function bloquejar(ok) {
      P.botons.forEach(x => { x.disabled = true; if (x !== ok && !x.classList.contains('mal') && !x.classList.contains('dita')) x.classList.add('apagada'); });
      if (P.lliure && P.lliure !== ok) { P.lliure.classList.add('apagada'); P.lliure.querySelectorAll('input, button').forEach(x => x.disabled = true); P.lliure.tabIndex = -1; }
    }
    // Marca la part que rima a la paraula de dalt i a la bona
    function marcarRima(b, p) {
      const m = $('mot-obj'); m.textContent = ''; m.appendChild(ambRima(P.obj.p, P.g));
      const nom = b.querySelector('.nom'); if (nom) { nom.textContent = ''; nom.appendChild(ambRima(p, P.g)); }
    }
    function donarPista() {
      const m = $('mot-obj'); m.textContent = ''; m.appendChild(ambRima(P.obj.p, P.g));
      $('objectiu').classList.add('ensenya');
      mostrar('💡 Pista', `Escolta com acaba: «${P.obj.p}» acaba en -${P.g.rima}. Busca'n una que acabi igual.`, 'pista');
    }

    // ---------------- Final ----------------
    function final() {
      P = null; esperant = false;
      const nets = resultats.filter(r => r === 'be').length;
      const mal = resultats.filter(r => r === 'malament').length;
      // Les rondes amb paraula escrita (📝) no compten ni a favor ni en contra
      const triades = RONDES - escrites.length;
      let titol = triades > 0 && nets === triades ? 'Tot a la primera!' : 'Partida acabada!';
      let subtitol = `${nets} de ${triades} a la primera`;
      const estrelles = nets >= triades - 1 ? 3 : mal <= 2 ? 2 : 1;
      if (Preferencies.errors()) {
        const clau = `appjocs.rima.record.${config.nivell}`;
        let record = null; try { const v = localStorage.getItem(clau); record = v === null ? null : Number(v); } catch {}
        const nou = record === null || nets > record;
        if (nou) { try { localStorage.setItem(clau, String(nets)); } catch {} }
        subtitol += nou ? (record !== null ? ' · 🏅 Nou rècord!' : '') : ` · Rècord: ${record}`;
      } else { titol = 'Partida acabada!'; subtitol = `Has fet ${RONDES} rimes.`; }
      if (escrites.length) subtitol += ` · 📝 Per mirar amb un adult: ${escrites.map(x => `${x.obj} → ${x.w}`).join(', ')}`;
      mostrar('🎉 ' + titol, subtitol, 'guanyat');
      Celebracio.gran({ titol, subtitol, emoji: triades > 0 && nets === triades ? '🏆' : '🎵', estrelles });
    }

    // ---------------- Dades i missatges ----------------
    function pintarDades() {
      const comptar = Preferencies.errors();
      const punts = Array.from({ length: RONDES }, (_, i) =>
        `<i class="${i < resultats.length ? (comptar ? resultats[i] : 'fet') : i === resultats.length ? 'ara' : ''}"></i>`).join('');
      let html = `<span class="dada">Paraula <b>${Math.min(idx + 1, RONDES)}</b>/${RONDES} <span class="progres">${punts}</span></span>`;
      if (comptar) html += `<span class="dada">A la primera: <b>${resultats.filter(r => r === 'be').length}</b></span>`;
      $('dades').innerHTML = html;
    }
    function sacsejar(x) { x.classList.remove('sacseig'); void x.offsetWidth; x.classList.add('sacseig'); }
    function mostrar(t, extra = '', estat = '') {
      const m = $('missatge');
      $('msg-text').textContent = t; $('msg-extra').textContent = extra;
      m.classList.remove('es-pista', 'es-error', 'es-guanyat', 'es-info');
      if (estat) m.classList.add('es-' + estat);
    }

    Pantalla.avisOrientacio('rima', { dins: document.getElementById('pantalla-inici') });
  </script>
</body>
