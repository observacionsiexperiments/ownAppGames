<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Suma ràpida · AppJocs</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Colors per rol (css/styles.css): verd = encert/OK · rosa = error/esborrar · groc = pista ·
       blau = fitxa seleccionada · préssec = acció general */
    .joc { width: 100%; max-width: 1200px; margin: 0 auto; }
    [hidden] { display: none !important; }
    h2.titol { font-size: 1.15rem; margin: 16px 0 8px; }

    /* ---------- Pantalla d'inici ---------- */
    .inici { max-width: 760px; margin: 0 auto; }
    .opcions { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .opcions button {
      font: inherit; cursor: pointer; color: var(--text); touch-action: manipulation;
      background: var(--superficie); border: 2px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra);
      min-height: 64px; padding: 8px; font-weight: 700; font-size: 1.15rem;
    }
    .opcions button small { display: block; font-weight: 500; font-size: .85rem; color: var(--text-suau); margin-top: 2px; }
    .opcions button[aria-pressed="true"] { background: var(--c-info); border-color: var(--c-info-vora); }
    .opcions button[aria-pressed="true"] small { color: var(--text); }
    .opcions button:disabled { opacity: .35; cursor: default; }
    @media (hover: hover) { .opcions button:hover { border-color: var(--c-info-vora); } }
    .explica { color: var(--text-suau); text-align: center; margin: 14px 0 0; }
    .comencar { text-align: center; margin: 22px 0 8px; }
    .comencar .btn { font-size: 1.3rem; padding: 14px 40px; }

    /* ---------- Pantalla de joc ---------- */
    .cap-joc { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 10px; }
    .dades { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dada { background: var(--superficie); border: 1px solid var(--vora); border-radius: 999px; padding: 4px 12px; font-size: .95rem; }
    .dada b { font-variant-numeric: tabular-nums; }
    .progres { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
    .progres i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--vora); background: var(--superficie); }
    .progres i.fet { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .progres i.ara { background: var(--c-info); border-color: var(--c-info-vora); }

    .disposicio { display: grid; gap: 14px; grid-template-areas: "objectiu" "fitxes" "panell"; }
    .zona-fitxes { grid-area: fitxes; } .zona-objectiu { grid-area: objectiu; } .panell { grid-area: panell; }
    @media (orientation: landscape) and (min-width: 900px), (min-width: 1100px) {
      .disposicio { grid-template-columns: 1fr 340px; grid-template-areas: "fitxes objectiu" "fitxes panell"; align-items: start; }
    }

    /* Fitxes amb números */
    .zona-fitxes {
      background: var(--superficie); border: 2px solid var(--vora); border-radius: var(--radi); padding: 14px;
    }
    .fitxes { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
    .fitxa {
      font: inherit; font-weight: 800; font-size: clamp(1.7rem, 4.5vw, 2.6rem); font-variant-numeric: tabular-nums;
      min-height: clamp(64px, 11vw, 100px); border-radius: 18px; cursor: pointer; color: var(--text);
      background: var(--fons); border: 3px solid var(--vora); box-shadow: var(--ombra); touch-action: manipulation;
      transition: transform .1s, background-color .15s, border-color .15s;
    }
    .fitxa:active { transform: scale(.96); }
    @media (hover: hover) { .fitxa:not(:disabled):hover { border-color: var(--c-info-vora); } }
    .fitxa.triada { background: var(--c-info); border-color: var(--c-info-vora); transform: translateY(-3px); }
    .fitxa.correcta { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .fitxa:disabled { cursor: default; }
    .fitxa:disabled:not(.correcta) { opacity: .45; }

    /* Número objectiu */
    .zona-objectiu {
      text-align: center; padding: 12px; background: var(--superficie); border: 2px solid var(--vora); border-radius: var(--radi);
    }
    .zona-objectiu .rotul { font-size: .85rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-suau); }
    .objectiu {
      font-weight: 900; font-size: clamp(4rem, 12vw, 6.5rem); line-height: 1.05; font-variant-numeric: tabular-nums;
      margin: 4px auto; width: fit-content; min-width: 1.8em; padding: 4px 18px; border-radius: 22px;
      background: var(--fons); border: 3px solid var(--text-suau);
    }
    .zona-objectiu .quants { font-weight: 700; color: var(--text); }

    .panell { display: flex; flex-direction: column; gap: 10px; }
    .operacio {
      min-height: 3.2rem; padding: 8px 12px; border-radius: 14px; text-align: center;
      background: var(--superficie); border: 2px dashed var(--vora);
      font-size: clamp(1.2rem, 2.6vw, 1.6rem); font-weight: 800; font-variant-numeric: tabular-nums;
      display: grid; place-items: center; word-break: break-word;
    }
    .operacio .buit { color: var(--text-suau); font-weight: 600; font-size: 1rem; }
    .botons { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
    .boto {
      font: inherit; font-weight: 800; font-size: 1.25rem; cursor: pointer; min-height: 58px; border-radius: 16px;
      color: var(--text); border: 3px solid var(--vora); box-shadow: var(--ombra); touch-action: manipulation;
    }
    .boto:active { transform: translateY(2px); box-shadow: none; }
    .boto:disabled { opacity: .4; cursor: default; }
    .boto.esborrar { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .boto.ok { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .missatge {
      min-height: 3rem; padding: 8px 12px; border-radius: var(--radi); text-align: center;
      background: var(--superficie); border: 2px solid var(--vora); font-weight: 700;
      display: flex; flex-direction: column; justify-content: center; gap: 2px;
    }
    .missatge small { font-weight: 500; font-size: .95rem; }
    .missatge small:empty { display: none; }
    .missatge.es-pista   { background: var(--c-pista);    border-color: var(--c-pista-vora); }
    .missatge.es-error   { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .missatge.es-guanyat { background: var(--c-ok);       border-color: var(--c-ok-vora); }
    @keyframes sacseig { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .sacseig { animation: sacseig .25s 2; }

    /* Horitzontal baix: tot a la vista */
    @media (orientation: landscape) and (max-height: 820px) {
      .cap-joc { margin: 0 0 6px; }
      .cap-joc .btn { padding: 6px 14px; }
      .disposicio { gap: 10px; }
      .zona-fitxes { padding: 10px; }
      .fitxes { gap: 10px; }
      .fitxa { min-height: clamp(52px, 14vh, 96px); font-size: clamp(1.5rem, 6vh, 2.4rem); }
      .zona-objectiu { padding: 8px; }
      .objectiu { font-size: clamp(3rem, 15vh, 6rem); }
      .panell { gap: 8px; }
      .operacio { min-height: 2.6rem; padding: 6px 10px; }
      .boto { min-height: 50px; }
      .missatge { min-height: 0; padding: 6px 10px; }
      h2.titol { margin: 10px 0 6px; }
      .opcions button { min-height: 52px; }
      .comencar { margin: 14px 0 4px; }
    }

    /* Mòbil (vertical, o apaisat amb poca alçada): tot compacte perquè hi càpiga sense desplaçar */
    @media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 500px) {
      .barra-joc { padding: 6px 0; }
      .barra-joc h1 { font-size: 1.1rem; }
      .cap-joc { margin: 0 0 8px; gap: 6px; flex-wrap: nowrap; align-items: center; }
      .dades { gap: 4px; flex-wrap: wrap; }
      .dada { font-size: .8rem; padding: 2px 8px; }
      .progres i { width: 9px; height: 9px; }
      .cap-joc .btn { padding: 5px 10px; font-size: .85rem; white-space: nowrap; }
      .disposicio { gap: 8px; }
      /* Objectiu en una sola fila: «Arriba a [55] amb 2 o 3 números» */
      .zona-objectiu {
        padding: 6px 10px; display: grid; grid-template-columns: auto 1fr; grid-template-areas: "rotul objectiu" "quants objectiu";
        align-items: center; column-gap: 12px; text-align: left;
      }
      .zona-objectiu .rotul { grid-area: rotul; align-self: end; }
      .zona-objectiu .objectiu { grid-area: objectiu; justify-self: end; margin: 0; font-size: 3rem; padding: 0 14px; border-radius: 16px; }
      .zona-objectiu .quants { grid-area: quants; align-self: start; font-size: .92rem; }
      .zona-fitxes { padding: 8px; }
      .fitxes { gap: 8px; }
      .fitxa { min-height: clamp(52px, 8.5vh, 72px); font-size: 1.6rem; border-radius: 14px; }
      .panell { gap: 8px; }
      .operacio { min-height: 2.4rem; padding: 4px 10px; font-size: 1.1rem; }
      .boto { min-height: 48px; font-size: 1.1rem; }
      .missatge { min-height: 0; padding: 5px 10px; font-size: .95rem; }
      .missatge small { font-size: .85rem; }
    }
    /* Mòbil apaisat: fitxes a l'esquerra, objectiu i botons a la dreta */
    @media (orientation: landscape) and (max-height: 500px) {
      .barra-joc { padding: 4px 0; }
      .barra-joc h1 { font-size: 1rem; }
      .disposicio { grid-template-columns: minmax(0, 1fr) min(300px, 40vw); grid-template-areas: "fitxes objectiu" "fitxes panell"; align-items: start; }
      .fitxa { min-height: clamp(40px, 12vh, 56px); font-size: 1.4rem; }
      .zona-objectiu .objectiu { font-size: 2.4rem; }
      .boto { min-height: 42px; }
    }
    /* Mòbil: 5 grups d'opcions → fins a 4 botons per fila i menys text perquè tot hi càpiga */
    @media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 500px) {
      main .inici .opcions { grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 6px; }
      main .inici .opcions button { min-height: 44px; padding: 4px; font-size: .95rem; line-height: 1.15; }
      main .inici .opcions button small { font-size: .68rem; }
      main .inici .grup + .grup { margin-top: 10px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      main .inici .explica { display: none; }
      main .inici .grup + .grup { margin-top: 0; }
      main .inici h2.titol { font-size: .92rem; margin-bottom: 4px; }
      main .inici .opcions button { min-height: 38px; }
    }
  </style>
</head>
<body>
  <nav class="barra-joc">
    <a href="../../">← Inici</a>
    <h1>⚡ Suma ràpida</h1>
  </nav>

  <main class="joc">
    <!-- ================= INICI ================= -->
    <section class="inici" id="pantalla-inici">
      <div class="grup">
        <h2 class="titol">1. Nivell: fins a quin número?</h2>
        <div class="opcions" id="op-nivell">
          <button type="button" data-v="moltfacil" aria-pressed="true">🌱 Molt fàcil<small>fins a 20</small></button>
          <button type="button" data-v="facil" aria-pressed="false">Fàcil<small>fins a 50</small></button>
          <button type="button" data-v="mitja" aria-pressed="false">Mitjà<small>fins a 100</small></button>
          <button type="button" data-v="dificil" aria-pressed="false">Difícil<small>100 i trampes</small></button>
        </div>
      </div>

      <div class="grup">
        <h2 class="titol">2. Amb quants números sumes?</h2>
        <div class="opcions" id="op-sumands">
          <button type="button" data-v="2" aria-pressed="true">2</button>
          <button type="button" data-v="3" aria-pressed="false">3</button>
          <button type="button" data-v="4-5" aria-pressed="false">4 o 5</button>
          <button type="button" data-v="6-7" aria-pressed="false">6 o 7</button>
        </div>
      </div>

      <div class="grup">
        <h2 class="titol">3. Quantes fitxes surten?</h2>
        <div class="opcions" id="op-fitxes">
          <button type="button" data-v="4" aria-pressed="false">4</button>
          <button type="button" data-v="6" aria-pressed="true">6</button>
          <button type="button" data-v="8" aria-pressed="false">8</button>
          <button type="button" data-v="10" aria-pressed="false">10</button>
        </div>
      </div>

      <div class="grup">
        <h2 class="titol">4. Quantes cadenes?</h2>
        <div class="opcions" id="op-cadenes">
          <button type="button" data-v="3" aria-pressed="false">3</button>
          <button type="button" data-v="5" aria-pressed="true">5</button>
          <button type="button" data-v="10" aria-pressed="false">10</button>
        </div>
      </div>

      <div class="grup">
        <h2 class="titol">5. Números rodons</h2>
        <div class="opcions" id="op-rodons">
          <button type="button" data-v="no" aria-pressed="true">No<small>com surtin</small></button>
          <button type="button" data-v="alguns" aria-pressed="false">Alguns<small id="rodons-alguns">i un de petit</small></button>
          <button type="button" data-v="tots" aria-pressed="false">Tots<small id="rodons-tots">10 o 20, de 5 en 5</small></button>
        </div>
      </div>

      <p class="explica">Tria les fitxes que, sumades, donen el número gran. Amb números rodons (acabats en 0 o 5) és més fàcil.</p>
      <div class="comencar"><button class="btn" id="btn-comencar" type="button">Comença! ⚡</button></div>
    </section>

    <!-- ================= JOC ================= -->
    <section id="pantalla-joc" hidden>
      <div class="cap-joc">
        <div class="dades" id="dades"></div>
        <button class="btn" id="btn-nova" type="button">Nova ronda</button>
      </div>

      <div class="disposicio">
        <div class="zona-fitxes">
          <div class="fitxes" id="fitxes" role="group" aria-label="Fitxes amb números"></div>
        </div>

        <div class="zona-objectiu">
          <div class="rotul">Arriba a</div>
          <div class="objectiu" id="objectiu" aria-live="polite"></div>
          <div class="quants" id="quants"></div>
        </div>

        <div class="panell">
          <div class="operacio" id="operacio" aria-live="polite"></div>
          <div class="botons">
            <button type="button" class="boto esborrar" id="btn-esborrar" aria-label="Treure totes les fitxes triades">⌫</button>
            <button type="button" class="boto ok" id="btn-ok">OK ✓</button>
          </div>
          <div class="missatge" id="missatge" aria-live="polite"><span id="msg-text"></span><small id="msg-extra"></small></div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/pantalla.js"></script>
  <script src="../../js/preferencies.js"></script>
  <script src="../../js/celebracio.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    // Nivell = fins a quin número pot arribar l'objectiu. `unitat`: amb números rodons, els de Molt fàcil
    // acaben en 0 (desenes) i els altres en 0 o 5. Difícil: les fitxes que sobren s'assemblen a les bones.
    const NIVELLS = {
      moltfacil: { max: 20, baix: 5,  unitat: 10 },
      facil:     { max: 50, baix: 12, unitat: 5 },
      mitja:     { max: 99, baix: 25, unitat: 5 },
      dificil:   { max: 99, baix: 30, unitat: 5, trampes: true },
    };
    // Amb quants números es fa la suma
    const SUMANDS = {
      '2':   { min: 2, max: 2, text: '2 números' },
      '3':   { min: 3, max: 3, text: '3 números' },
      '4-5': { min: 4, max: 5, text: '4 o 5 números' },
      '6-7': { min: 6, max: 7, text: '6 o 7 números' },
    };
    const config = { nivell: 'moltfacil', sumands: '2', fitxes: 6, cadenes: 5, rodons: 'no' };
    let cadena, errorsRonda, errorsCadena, objectiu, fitxes, triades, bloquejat, inici, rellotge;

    // ---------------- Inici ----------------
    function grupOpcions(id, clau) {
      $(id).addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
        config[clau] = isNaN(b.dataset.v) ? b.dataset.v : Number(b.dataset.v);
      });
    }
    grupOpcions('op-nivell', 'nivell'); grupOpcions('op-cadenes', 'cadenes'); grupOpcions('op-rodons', 'rodons');
    grupOpcions('op-sumands', 'sumands'); grupOpcions('op-fitxes', 'fitxes');
    // Hi ha d'haver com a mínim 2 fitxes que sobrin: amb més sumands, no es poden triar poques fitxes
    function revisarOpcions() {
      config.sumands = String(config.sumands);
      const minim = SUMANDS[config.sumands].max + 2;
      const botons = [...$('op-fitxes').querySelectorAll('button')];
      botons.forEach(b => { b.disabled = Number(b.dataset.v) < minim; });
      if (config.fitxes < minim) {
        const b = botons.find(x => !x.disabled);
        botons.forEach(x => x.setAttribute('aria-pressed', x === b));
        config.fitxes = Number(b.dataset.v);
      }
      const mf = config.nivell === 'moltfacil';   // a Molt fàcil, "rodons" vol dir que la suma acaba en 0
      $('rodons-alguns').textContent = mf ? 'la suma fa 10 o 20' : 'i un de petit';
      $('rodons-tots').textContent = mf ? '10 o 20, de 5 en 5' : '10, 15, 20…';
    }
    ['op-sumands', 'op-nivell'].forEach(id => $(id).addEventListener('click', revisarOpcions));
    revisarOpcions();

    $('btn-comencar').addEventListener('click', () => {
      cadena = 1; errorsRonda = 0;
      $('pantalla-inici').hidden = true; $('pantalla-joc').hidden = false;
      inici = performance.now();
      clearInterval(rellotge); rellotge = setInterval(pintarDades, 1000);
      novaCadena();
      window.scrollTo({ top: 0 });
    });
    $('btn-nova').addEventListener('click', () => {
      clearInterval(rellotge); Celebracio.tancar();
      $('pantalla-joc').hidden = true; $('pantalla-inici').hidden = false;
    });

    // ---------------- Generar una cadena ----------------
    const aleatori = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const barrejar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

    // Parteix T en k números (cadascun ≥ 2), a l'atzar: cada part té 2 i la resta es reparteix a l'atzar
    function partir(T, k) {
      const extra = T - 2 * k;
      const talls = Array.from({ length: k - 1 }, () => aleatori(0, extra)).sort((a, b) => a - b);
      const t = [0, ...talls, extra];
      return t.slice(1).map((v, i) => 2 + v - t[i]);
    }

    // Parteix n unitats en k parts (cadascuna ≥ 1), a l'atzar
    function compondre(n, k) {
      const talls = new Set();
      while (talls.size < k - 1) talls.add(aleatori(1, n - 1));
      const t = [0, ...[...talls].sort((a, b) => a - b), n];
      return t.slice(1).map((v, i) => v - t[i]);
    }
    const PETITS = [2, 3, 4, 6, 7, 8, 9];   // números petits que no acaben en 0 ni en 5

    // Genera una cadena: objectiu (≤ màxim del nivell), les k parts bones i les fitxes que sobren.
    // Números rodons:  tots   → objectiu i fitxes múltiples de la unitat (Molt fàcil: 10; si no: 5)
    //                  alguns → les bones són rodones menys una de petita que completa (47 = 20 + 25 + 2)
    // Si amb aquests sumands no hi caben números rodons (p. ej. 3 desenes > 20), es prova amb 5 i si no, normal.
    function generar(k, nSobren) {
      const N = NIVELLS[config.nivell], max = N.max;
      // Molt fàcil amb números rodons: la suma sempre acaba en 0 (10 o 20: completar la desena).
      //   tots → a més, les fitxes són de 5 en 5 si hi caben (20 = 15 + 5); alguns → fitxes qualssevol (20 = 13 + 7)
      if (config.nivell === 'moltfacil' && config.rodons !== 'no') {
        const obj = config.rodons === 'tots' || 2 * k > 10 || Math.random() < .5 ? 20 : 10;
        const de5 = config.rodons === 'tots' && 5 * k <= obj;
        const parts = de5 ? compondre(obj / 5, k).map(x => x * 5) : partir(obj, k);
        const sobren = Array.from({ length: nSobren }, () => de5 ? 5 * aleatori(1, obj / 5 - 1) : aleatori(2, obj - 1));
        return { objectiu: obj, parts, sobren };
      }
      const unitats = [N.unitat, 5].filter((u, i, a) => a.indexOf(u) === i);
      if (config.rodons === 'tots') {
        const u = unitats.find(x => k * x <= max);
        if (u) {
          const uMax = Math.floor(max / u), uMin = Math.min(uMax, Math.max(k, Math.ceil(N.baix / u)));
          const U = aleatori(uMin, uMax);
          const parts = compondre(U, k).map(x => x * u);
          const maxPart = Math.max(...parts);
          const sobren = Array.from({ length: nSobren }, () => u * aleatori(1, Math.max(1, Math.min(U - 1, maxPart / u + 2))));
          return { objectiu: U * u, parts, sobren };
        }
      }
      if (config.rodons === 'alguns') {
        const r = PETITS[aleatori(0, PETITS.length - 1)];
        const u = unitats.find(x => (k - 1) * x + r <= max);
        if (u) {
          const uMax = Math.floor((max - r) / u), uMin = Math.min(uMax, Math.max(k - 1, Math.ceil((N.baix - r) / u)));
          const U = aleatori(uMin, uMax);
          const parts = [...compondre(U, k - 1).map(x => x * u), r];
          const maxPart = Math.max(...parts);
          const altres = PETITS.filter(x => x !== r && x < U * u + r);
          const sobren = Array.from({ length: nSobren }, (_, i) => i % 2 === 0
            ? u * aleatori(1, Math.max(1, Math.min(U, maxPart / u + 2)))
            : altres[aleatori(0, altres.length - 1)]);
          return { objectiu: U * u + r, parts, sobren };
        }
      }
      const obj = aleatori(Math.min(max, Math.max(2 * k, N.baix)), max);
      const parts = partir(obj, k);
      const maxPart = Math.max(...parts);
      // Fitxes que sobren: semblants a les bones (a Difícil, molt semblants: una bona ± 1, 2 o 3), menors que l'objectiu
      const sobren = Array.from({ length: nSobren }, () => {
        if (N.trampes) {
          const base = parts[aleatori(0, parts.length - 1)];
          const v = base + (Math.random() < .5 ? -1 : 1) * aleatori(1, 3);
          return Math.min(obj - 1, Math.max(2, v));
        }
        return aleatori(2, Math.max(2, Math.min(obj - 1, maxPart + 6)));
      });
      return { objectiu: obj, parts, sobren };
    }

    function novaCadena() {
      const sm = SUMANDS[config.sumands];
      const k = aleatori(sm.min, sm.max);
      const g = generar(k, Math.max(config.fitxes, k + 2) - k);
      objectiu = g.objectiu;
      const parts = g.parts, sobren = g.sobren;
      fitxes = barrejar([...parts, ...sobren]).map((v, i) => ({ id: i, v }));
      triades = [];
      errorsCadena = 0; bloquejat = false;
      $('objectiu').textContent = objectiu;
      $('quants').textContent = `amb ${sm.text}`;
      pintarFitxes(); pintarOperacio(); pintarDades();
      mostrar(`Cadena ${cadena} de ${config.cadenes}`, 'Toca les fitxes que sumades donen el número gran.');
    }

    // ---------------- Dibuix ----------------
    function pintarFitxes() {
      const cont = $('fitxes'); cont.innerHTML = '';
      cont.style.gridTemplateColumns = `repeat(${fitxes.length <= 4 ? fitxes.length : fitxes.length <= 6 ? 3 : 4}, 1fr)`;
      fitxes.forEach(f => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'fitxa' + (triades.includes(f) ? ' triada' : '');
        b.textContent = f.v; b.dataset.id = f.id;
        b.setAttribute('aria-pressed', triades.includes(f));
        b.addEventListener('click', () => tocarFitxa(f));
        cont.appendChild(b);
      });
    }
    // Operació sense resultat: "12 + 8 + 20 = ?" (s'ha de calcular de cap)
    function pintarOperacio() {
      $('operacio').innerHTML = triades.length
        ? triades.map(f => f.v).join(' + ') + ' = ?'
        : '<span class="buit">Encara no has triat cap fitxa</span>';
      $('btn-ok').disabled = bloquejat || triades.length === 0;
      $('btn-esborrar').disabled = bloquejat || triades.length === 0;
    }
    const format = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    function pintarDades() {
      if ($('pantalla-joc').hidden) return;
      const punts = Array.from({ length: config.cadenes }, (_, i) =>
        `<i class="${i + 1 < cadena ? 'fet' : i + 1 === cadena ? 'ara' : ''}"></i>`).join('');
      $('dades').innerHTML =
        `<span class="dada">Cadena <b>${Math.min(cadena, config.cadenes)}</b>/${config.cadenes} <span class="progres">${punts}</span></span>`
        + (Preferencies.temps() ? `<span class="dada">⏱️ <b>${format(performance.now() - inici)}</b></span>` : '')
        + (Preferencies.errors() ? `<span class="dada">Errors: <b>${errorsRonda}</b></span>` : '');
    }

    // ---------------- Jugar ----------------
    function tocarFitxa(f) {
      if (bloquejat) return;
      const i = triades.indexOf(f);
      if (i >= 0) triades.splice(i, 1); else triades.push(f);
      pintarFitxes(); pintarOperacio();
    }
    $('btn-esborrar').addEventListener('click', () => { if (bloquejat) return; triades = []; pintarFitxes(); pintarOperacio(); });

    $('btn-ok').addEventListener('click', () => {
      if (bloquejat || !triades.length) return;
      const niv = SUMANDS[config.sumands];
      const suma = triades.reduce((s, f) => s + f.v, 0);
      const n = triades.length;
      if (suma === objectiu && n >= niv.min && n <= niv.max) return encert();
      if (suma === objectiu) {
        // Suma bé, però no amb els números que demana el nivell
        mostrar('Suma bé, però… 🤔', `Fes-ho amb ${niv.text} (n'has fet servir ${n}).`, 'pista');
        sacsejar($('operacio'));
        return;
      }
      errorsRonda++; errorsCadena++;
      sacsejar($('objectiu'));
      if (errorsCadena >= 2) {
        const dif = objectiu - suma;
        mostrar(`No dona ${objectiu}`, dif > 0 ? `Pista: et falten ${dif}.` : `Pista: t'has passat de ${-dif}.`, 'pista');
      } else {
        mostrar(`No dona ${objectiu}`, 'Torna a sumar-ho a poc a poc.', 'error');
      }
      pintarDades();
    });

    function encert() {
      bloquejat = true;
      const cont = $('fitxes');
      triades.forEach(f => { const b = cont.querySelector(`.fitxa[data-id="${f.id}"]`); if (b) b.classList.add('correcta'); });
      cont.querySelectorAll('.fitxa').forEach(b => b.disabled = true);
      $('operacio').textContent = triades.map(f => f.v).join(' + ') + ' = ' + objectiu;
      $('btn-ok').disabled = true; $('btn-esborrar').disabled = true;
      mostrar(Preferencies.felicitacio('✓ Molt bé!'), '', 'guanyat');
      Celebracio.petita($('objectiu'));
      setTimeout(() => {
        cadena++;
        if (cadena <= config.cadenes) novaCadena(); else final();
      }, 1300);
    }

    function final() {
      clearInterval(rellotge);
      const temps = performance.now() - inici;
      pintarDades();
      // Opcions: sense temporitzador no hi ha cronòmetre ni rècord de temps; sense errors, no hi ha estrelles
      const ambTemps = Preferencies.temps(), ambErrors = Preferencies.errors();
      if (!ambTemps) {
        const e = ambErrors && errorsRonda ? ` · ${errorsRonda} ${errorsRonda === 1 ? 'error' : 'errors'}` : '';
        mostrar('🏆 Ronda acabada!', `${config.cadenes} cadenes fetes${e}`, 'guanyat');
        Celebracio.gran({
          titol: ambErrors && errorsRonda === 0 ? 'Suma perfecta!' : 'Ronda acabada!', emoji: '⚡',
          estrelles: errorsRonda === 0 ? 3 : errorsRonda <= 2 ? 2 : 1,
          subtitol: `${config.cadenes} cadenes fetes${e}`, boto: 'Continuar',
        });
        return;
      }
      const clau = `appjocs.suma-rapida.record.${config.nivell}.${config.sumands}.${config.fitxes}.${config.cadenes}.${config.rodons}`;
      let record = null; try { record = Number(localStorage.getItem(clau)) || null; } catch {}
      const nouRecord = !record || temps < record;
      if (nouRecord) { try { localStorage.setItem(clau, String(Math.round(temps))); } catch {} }
      const estrelles = errorsRonda === 0 ? 3 : errorsRonda <= 2 ? 2 : 1;
      mostrar('🏆 Ronda acabada!', `Temps: ${format(temps)}${nouRecord ? ' · Nou rècord!' : ''}`, 'guanyat');
      Celebracio.gran({
        titol: ambErrors && errorsRonda === 0 ? 'Suma perfecta!' : 'Ronda acabada!', emoji: '⚡', estrelles,
        subtitol: `${config.cadenes} cadenes en ${format(temps)}`
          + (nouRecord ? ' · 🏅 Nou rècord!' : ` · Rècord: ${format(record)}`)
          + (ambErrors && errorsRonda ? ` · ${errorsRonda} ${errorsRonda === 1 ? 'error' : 'errors'}` : ''),
        boto: 'Continuar',
      });
    }

    function sacsejar(el) { el.classList.remove('sacseig'); void el.offsetWidth; el.classList.add('sacseig'); }
    function mostrar(text, extra = '', estat = '') {
      const m = $('missatge');
      $('msg-text').textContent = text; $('msg-extra').textContent = extra;
      m.classList.remove('es-pista', 'es-error', 'es-guanyat');
      if (estat) m.classList.add('es-' + estat);
    }

    // Avís suau si el dispositiu està en l'orientació que pitjor li va a aquest joc
    Pantalla.avisOrientacio('suma-rapida', { dins: document.getElementById('pantalla-inici') });
  </script>
</body>
