<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Busca l'intrús · Juguem?</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Colors per rol (css/styles.css): verd = encert · rosa = error · groc = pista / temps que s'acaba ·
       blau = triat / informació · préssec = acció. */
    .joc { width: 100%; max-width: 1000px; margin: 0 auto; }
    [hidden] { display: none !important; }
    h2.titol { font-size: 1.15rem; margin: 16px 0 8px; }

    /* ---------- Inici ---------- */
    .inici { max-width: 860px; margin: 0 auto; }
    .opcions { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .opcions button {
      font: inherit; cursor: pointer; color: var(--text); touch-action: manipulation;
      background: var(--superficie); border: 2px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra);
      min-height: 56px; padding: 8px; font-weight: 700; font-size: 1.05rem;
    }
    .opcions button small { display: block; font-weight: 500; font-size: .82rem; color: var(--text-suau); margin-top: 2px; }
    .opcions button[aria-pressed="true"] { background: var(--c-info); border-color: var(--c-info-vora); }
    .opcions button[aria-pressed="true"] small { color: var(--text); }
    @media (hover: hover) { .opcions button:hover { border-color: var(--c-info-vora); } }
    .comencar { text-align: center; margin: 20px 0 8px; }
    .comencar .btn { font-size: 1.3rem; padding: 14px 40px; }

    /* ---------- Joc ---------- */
    .cap-joc { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
    .dades { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dada { background: var(--superficie); border: 1px solid var(--vora); border-radius: 999px; padding: 4px 12px; font-size: .95rem; }
    .dada b { font-variant-numeric: tabular-nums; }
    .progres { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
    .progres i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--vora); background: var(--superficie); }
    .progres i.be { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .progres i.ajuda { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .progres i.malament { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .progres i.fet { background: var(--vora); }
    .progres i.ara { background: var(--c-info); border-color: var(--c-info-vora); }

    .tauler { background: var(--superficie); border: 2px solid var(--vora); border-radius: var(--radi); padding: 18px 22px;
      display: flex; flex-direction: column; gap: 12px; --op: clamp(1.15rem, 2.6vw, 1.7rem); }
    .enunciat { display: flex; align-items: center; justify-content: center; gap: 12px; text-align: center; margin: 0;
      font-size: clamp(1.05rem, 2.2vw, 1.3rem); font-weight: 700; flex-wrap: wrap; }
    /* Targeta amb la lletra o la síl·laba (Fàcil) */
    .retol { font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 900;
      font-size: 2em; line-height: 1; min-width: 1.6em; padding: .12em .35em; border-radius: 14px;
      background: var(--c-info); border: 3px solid var(--c-info-vora); }
    .temps { height: 12px; border-radius: 999px; background: var(--fons); border: 1px solid var(--vora); overflow: hidden; }
    .temps i { display: block; height: 100%; width: 100%; background: color-mix(in srgb, var(--text-suau) 45%, white); border-radius: 999px; transform-origin: left; }
    .temps.poc i { background: var(--c-pista-vora); }

    /* Les 4 opcions, sempre 2 × 2 */
    .opcions-joc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: min(100%, 620px); margin: 0 auto; }
    .op { font: inherit; cursor: pointer; color: var(--text); touch-action: manipulation; position: relative;
      background: var(--superficie); border: 3px solid var(--vora); border-radius: 16px; box-shadow: var(--ombra);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 8px; min-height: 4.2em; }
    .op .emoji { font-size: calc(var(--op) * 1.9); line-height: 1.1; }
    .op .nom { font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 800;
      font-size: var(--op); letter-spacing: .02em; white-space: nowrap; text-align: center; max-width: 100%; }
    .op .nom.llarga { font-size: calc(var(--op) * .82); }
    .op .nom.molt-llarga { font-size: calc(var(--op) * .68); }
    .amb-dibuix .op .nom { font-size: calc(var(--op) * .8); }
    .op:disabled { cursor: default; }
    .op.mal { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .op.be { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .op.dita { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .op.apagada { opacity: .45; }
    .op:focus-visible, .motiu:focus-visible { outline: 4px solid color-mix(in srgb, var(--c-info) 70%, white); outline-offset: 2px; }
    @media (hover: hover) { .op:not(:disabled):hover, .motiu:not(:disabled):hover { border-color: var(--c-info-vora); } }

    /* Difícil: el motiu */
    .motius { display: flex; flex-direction: column; gap: 12px; width: min(100%, 620px); margin: 8px auto 0; }
    .motius > p { margin: 0 0 2px; text-align: center; font-weight: 700; font-size: 1.1rem; }
    .motiu { font: inherit; cursor: pointer; color: var(--text); text-align: left; display: flex; align-items: center; gap: .6em;
      background: var(--superficie); border: 3px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra); padding: .7em 1em; font-weight: 600; font-size: 1.05rem; }
    .motiu:disabled { cursor: default; }
    .motiu.be { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .motiu.mal { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .motiu.dita { background: var(--c-pista); border-color: var(--c-pista-vora); }
    /* Mentre es tria el motiu, les opcions es fan petites */
    .pas-motiu .opcions-joc { gap: 10px; }
    .pas-motiu .op { min-height: 0; padding: 8px 10px; border-width: 2px; }
    .pas-motiu .op .nom { font-size: calc(var(--op) * .78); }

    .peu { display: flex; flex-direction: column; gap: 12px; }
    .missatge { min-height: 3.2rem; padding: 8px 12px; border-radius: var(--radi); text-align: center; background: var(--superficie);
      border: 2px solid var(--vora); font-weight: 700; font-size: 1.1rem; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .missatge small { font-weight: 500; font-size: .98rem; }
    .missatge small:empty { display: none; }
    .missatge.es-pista { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .missatge.es-error { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .missatge.es-guanyat { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .botons-peu { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn-pista { background: var(--c-pista); border-color: var(--c-pista-vora); }
    @keyframes sacseig { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .sacseig { animation: sacseig .25s 2; }
    .maj .nom { text-transform: uppercase; }

    /* Mòbil apaïsat: el missatge i els botons a la dreta (a sota no hi cabrien) */
    @media (orientation: landscape) and (max-height: 500px) {
      .tauler { display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, 250px); column-gap: 18px; row-gap: 10px;
        grid-template-areas: "enun peu" "temps peu" "zona peu"; align-items: start; padding: 12px 20px; }
      .tauler .enunciat { grid-area: enun; }
      .tauler .temps { grid-area: temps; }
      .tauler #zona { grid-area: zona; min-width: 0; }
      .tauler .peu { grid-area: peu; align-self: center; }
      .tauler .botons-peu { flex-direction: column; align-items: stretch; }
      .cap-joc { margin: 0 0 8px; }
      .cap-joc .btn { padding: 6px 14px; }
      .missatge { min-height: 0; padding: 6px 10px; font-size: 1rem; }
      h2.titol { margin: 8px 0 6px; }
      .opcions button { min-height: 46px; padding: 6px; }
      .comencar { margin: 12px 0 4px; }
    }
    #zona { display: flex; flex-direction: column; gap: 16px; }
    #zona > .contingut { display: flex; flex-direction: column; gap: 16px; }
    @media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 500px) {
      .barra-joc { padding: 6px 0; }
      .barra-joc h1 { font-size: 1.1rem; }
      .cap-joc { margin: 0 0 6px; gap: 6px; flex-wrap: nowrap; }
      .dada { font-size: .8rem; padding: 2px 8px; }
      .progres i { width: 8px; height: 8px; }
      .cap-joc .btn { padding: 5px 10px; font-size: .85rem; white-space: nowrap; }
      .tauler { padding: 10px; gap: 8px; --op: 1.05rem; }
      .enunciat { font-size: .95rem; gap: 8px; }
      .opcions-joc { gap: 8px; }
      .op { padding: 6px; min-height: 3.4em; border-width: 2px; }
        .missatge { min-height: 0; padding: 5px 8px; font-size: .95rem; }
      .missatge small { font-size: .85rem; }
      .botons-peu .btn { padding: 6px 14px; font-size: .95rem; }
      .motiu { padding: .45em .7em; font-size: .92rem; border-width: 2px; }
      #zona, #zona > .contingut { gap: 10px; }
      .motius { gap: 8px; margin-top: 2px; }
      .motius > p { font-size: .95rem; }
      .pas-motiu .op { padding: 5px 8px; }
    }
    @media (orientation: portrait) and (max-width: 600px) {
      .progres { display: none; }
      main.joc .inici h2.titol { font-size: .92rem; margin: 5px 0 3px; }
      main.joc .inici .grup + .grup { margin-top: 6px; }
      main.joc .inici .opcions { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      main.joc .inici #op-nivell, main.joc .inici #op-temps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      main.joc .inici #op-nivell { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      main.joc .inici .opcions button { min-height: 38px; padding: 3px; font-size: .88rem; }
      main.joc .inici .opcions button small { display: none; }
      main.joc .inici .comencar { margin: 8px 0 2px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      main.joc .inici h2.titol { font-size: .88rem; margin: 2px 0 2px; }
      main.joc .inici .grup + .grup { margin-top: 4px; }
      main.joc .inici .opcions button { min-height: 38px; font-size: .92rem; }
      main.joc .inici .opcions button small { display: none; }
      main.joc .inici .comencar { margin: 6px 0 2px; }
      .tauler { padding: 6px 10px; row-gap: 4px; --op: .95rem; }
      #zona, #zona > .contingut { gap: 6px; }
      .pas-motiu .opcions-joc { gap: 6px; }
      .pas-motiu .op { padding: 3px 6px; }
      .opcions-joc { gap: 6px; }
      .op { min-height: 2.6em; padding: 3px 6px; }
      .op .emoji { font-size: calc(var(--op) * 1.6); }
      .motius { gap: 5px; margin-top: 0; }
      .motius > p { font-size: .9rem; }
      .motiu { padding: .2em .5em; font-size: .85rem; }
      .retol { font-size: 1.6em; }
    }
    /* Tauleta i portàtil (criteri comú «ple», css/styles.css): el joc omple la pantalla i tot creix amb l'espai */
    @media (min-width: 601px) and (min-height: 501px) {
      .tauler { --op: clamp(1.3rem, min(3.4vw, 4.4vh), 2.5rem); padding: 16px 22px; gap: 14px; }
      .enunciat { font-size: clamp(1.1rem, 2.8vh, 1.6rem); }
      #zona { flex: 1 1 auto; min-height: 0; }
      #zona > .contingut { flex: 1 1 auto; justify-content: center; gap: clamp(12px, 2.4vh, 26px); }
      .opcions-joc { width: min(100%, 1000px); gap: clamp(12px, 1.6vw, 22px); }
      .op { min-height: 0; padding: clamp(10px, 2.6vh, 28px) 10px; }
      .motius { width: min(100%, 900px); gap: clamp(8px, 1.4vh, 14px); }
      .motius > p { font-size: clamp(1.05rem, 2.5vh, 1.35rem); }
      .motiu { font-size: clamp(1.05rem, 2.4vh, 1.3rem); }
      .pas-motiu .op { padding: 6px 10px; }
    }
    /* Tauleta en vertical: la lletra i les peces es calculen també per l'alçada (n'hi ha molta) */
    @media (orientation: portrait) and (min-width: 601px) and (min-height: 501px) {
      .tauler { --op: clamp(1.3rem, min(5vw, 3.8vh), 2.6rem); }
      .opcions-joc { width: 100%; }
    }
    /* Mòbil vertical (criteri «ple»): la zona de joc omple l'alçada i les peces creixen amb la pantalla */
    @media (orientation: portrait) and (max-width: 600px) {
      .tauler { --op: clamp(1.1rem, min(6vw, 3.2vh), 1.8rem); }
      #zona { flex: 1 1 auto; min-height: 0; }
      #zona > .contingut { flex: 1 1 auto; justify-content: center; gap: clamp(10px, 2.4vh, 24px); }
      .op { padding: clamp(10px, 3vh, 30px) 8px; }
    }
  </style>
</head>
<body>
  <nav class="barra-joc">
    <a href="../../">← Inici</a>
    <h1>🕵️ Busca l'intrús</h1>
  </nav>

  <main class="joc ple">
    <!-- ================= INICI ================= -->
    <section class="inici" id="pantalla-inici">
      <div class="grup">
        <h2 class="titol">1. Dificultat</h2>
        <div class="opcions" id="op-nivell">
          <button type="button" data-v="facil" aria-pressed="true">🌱 Fàcil<small>dibuixos</small></button>
          <button type="button" data-v="mitja" aria-pressed="false">Mitjà<small>paraules</small></button>
          <button type="button" data-v="dificil" aria-pressed="false">Difícil<small>troba-la i digues per què</small></button>
        </div>
      </div>
      <div class="grup" id="grup-temps">
        <h2 class="titol">2. Temps per fitxa</h2>
        <div class="opcions" id="op-temps">
          <button type="button" data-v="0" aria-pressed="false">Sense temps</button>
          <button type="button" data-v="10" aria-pressed="false">10 s</button>
          <button type="button" data-v="15" aria-pressed="true">15 s</button>
          <button type="button" data-v="20" aria-pressed="false">20 s</button>
        </div>
      </div>
      <div class="grup">
        <h2 class="titol">3. Quina lletra?</h2>
        <div class="opcions" id="op-lletra">
          <button type="button" data-v="maj" aria-pressed="true">MAJÚSCULA</button>
          <button type="button" data-v="min" aria-pressed="false">minúscula</button>
        </div>
      </div>
      <div class="comencar"><button class="btn" id="btn-comencar" type="button">Comença! 🕵️</button></div>
    </section>

    <!-- ================= JOC ================= -->
    <section id="pantalla-joc" hidden>
      <div class="cap-joc">
        <div class="dades" id="dades"></div>
        <button class="btn" id="btn-nova" type="button">Nova partida</button>
      </div>
      <div class="tauler" id="tauler">
        <p class="enunciat" id="enunciat"></p>
        <div class="temps" id="temps" aria-hidden="true" hidden><i id="temps-barra"></i></div>
        <div id="zona"></div>
        <div class="peu franja">
          <div class="missatge" id="missatge" aria-live="polite"><span id="msg-text"></span><small id="msg-extra"></small></div>
          <div class="botons-peu">
            <button class="btn btn-pista" id="btn-pista" type="button">💡 <span class="txt-llarg">Vull una pista</span><span class="txt-curt">Pista</span></button>
            <button class="btn" id="btn-seguent" type="button" hidden>Següent ▶</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/pantalla.js"></script>
  <script src="../../js/preferencies.js"></script>
  <script src="../../js/celebracio.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const RONDES = 10;
    const config = { nivell: 'facil', temps: 15, lletra: 'maj' };
    // Criteris de cada nivell (se sumen d'un nivell a l'altre; el nombre de síl·labes només al Difícil)
    const CRITERIS = {
      facil: ['lletra', 'grup', 'sil1'],
      mitja: ['lletra', 'grup', 'sil1', 'rima', 'nombre', 'sinon', 'part', 'compost'],
      dificil: ['lletra', 'grup', 'sil1', 'rima', 'nombre', 'sinon', 'part', 'compost', 'nsil', 'gram', 'intens', 'dim'],
    };
    // Sons que es confonen: al Fàcil l'intrús mai comença per un d'aquests si la resta comença per l'altre
    const CONFON = [['b', 'v'], ['a', 'e'], ['o', 'u'], ['s', 'z']];
    const PISTES = {
      lletra: 'Digues cada paraula a poc a poc: per quina lletra comença?',
      grup: 'Pensa de quin grup és cada cosa.',
      sil1: 'Digues-les a poc a poc: com comença cada una?',
      rima: 'Fixa\'t en com acaben.',
      nombre: 'N\'hi ha una o n\'hi ha moltes?',
      sinon: 'Pensa què vol dir cada paraula.',
      part: 'Totes són parts d\'una cosa… menys una.',
      compost: 'Prova de partir cada paraula en dues paraules.',
      nsil: 'Pica de mans a cada tros de cada paraula.',
      gram: 'Quines són accions, quines són coses i quines diuen com és una cosa?',
      intens: 'Pensa si totes són del mateix costat.',
      dim: 'Busca les coses petites (-et, -eta, -ol, -ola).',
    };

    let D = null, P = null;            // dades i ronda actual
    let MOTS = new Map();              // perfil de cada paraula
    let resultats, idx, errors, ambAjuda, bloquejat, animacio, limit, seguentT, ultimCriteri, usades;

    const barrejar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const triar = a => a[Math.floor(Math.random() * a.length)];
    const format = t => config.lletra === 'maj' ? t.toLocaleUpperCase('ca') : t;
    const net = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    const lletraDe = p => { const n = net(p); return n.startsWith('ll') ? 'll' : n[0]; };
    const llista = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' i ' + a[a.length - 1];
    const cometes = p => `«${format(p)}»`;

    // ---------------- Inici ----------------
    function grupOpcions(id, clau, num) {
      $(id).addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
        config[clau] = num ? Number(b.dataset.v) : b.dataset.v;
      });
    }
    grupOpcions('op-nivell', 'nivell'); grupOpcions('op-temps', 'temps', true); grupOpcions('op-lletra', 'lletra');
    if (!Preferencies.temps()) { $('grup-temps').hidden = true; config.temps = 0; }

    $('btn-comencar').addEventListener('click', comencar);
    $('btn-nova').addEventListener('click', () => { aturar(); clearTimeout(seguentT); Celebracio.tancar(); $('pantalla-joc').hidden = true; $('pantalla-inici').hidden = false; });
    $('btn-pista').addEventListener('click', () => { if (!bloquejat && P && P.fase === 'triar') { ambAjuda = true; donarPista(); pintarDades(); $('btn-pista').disabled = true; } });
    $('btn-seguent').addEventListener('click', seguent);
    document.addEventListener('keydown', ev => {
      if ($('pantalla-joc').hidden || !P || ev.ctrlKey || ev.altKey || ev.metaKey) return;
      if ((ev.key === 'Enter' || ev.key === ' ') && !$('btn-seguent').hidden && document.activeElement?.tagName !== 'BUTTON') {
        ev.preventDefault(); seguent();
      }
    });

    async function carregar() {
      const [d, sin, comp, pg] = await Promise.all(['paraules.json', '../sinonims/paraules.json', '../compostes/paraules.json', '../petit-gros/paraules.json']
        .map(u => fetch(u).then(r => r.json())));
      D = d;
      D.compostes = comp.paraules.map(x => x.paraula);
      D.composta = new Map(comp.paraules.map(x => [x.paraula, x.parts]));
      D.dims = pg.paraules.filter(x => x.dim).map(x => ({ p: x.p, dim: x.dim }));
      // Perfil de cada paraula: el que se'n sap (si una dada no se sap, val null i no es fa servir)
      const perfil = (p, extra) => {
        if (!MOTS.has(p)) MOTS.set(p, { p, compost: D.compostes.includes(p), dim: D.dims.some(x => x.dim === p) });
        Object.assign(MOTS.get(p), extra); return MOTS.get(p);
      };
      D.elements.forEach(e => perfil(e.p, { base: true, s: e.s, e: e.e, g: e.g || null, d: e.d || null, x: !!e.x,
        nombre: e.pl ? 'plural' : 'singular', gram: (e.g && !['colors', 'nombres'].includes(e.g)) || (!e.g && !e.e) ? 'nom' : null }));
      D.plurals.forEach(([s, pl]) => { perfil(s, { nombre: 'singular' }); perfil(pl, { nombre: 'plural' }); });
      Object.entries(D.gram).forEach(([tipus, ps]) => ps.forEach(p => perfil(p, { gram: tipus, base: true })));
      D.compostes.forEach(p => perfil(p, {}));
      D.dims.forEach(x => { perfil(x.dim, {}); perfil(x.p, {}); });
      D.sinonims.forEach(x => [...x.iguals, ...x.contraris].forEach(p => perfil(p, {})));
      D.partTot.forEach(x => [...x.parts, ...x.fora].forEach(p => perfil(p, {})));
      D.intensitat.forEach(x => [...x.a, ...x.b].forEach(p => perfil(p, {})));
    }

    async function comencar() {
      try { if (!D) await carregar(); }
      catch (e) { console.error(e); alert("No s'han pogut carregar les paraules. Torna-ho a provar."); return; }
      if (!Preferencies.temps()) config.temps = 0;
      idx = -1; resultats = []; ultimCriteri = null; usades = new Set();
      $('temps').hidden = !config.temps;
      $('tauler').classList.toggle('maj', config.lletra === 'maj');
      $('pantalla-inici').hidden = true; $('pantalla-joc').hidden = false;
      window.scrollTo({ top: 0 });
      seguent();
    }

    // ---------------- Propietats i comprovacions ----------------
    // Valor d'una paraula per a cada criteri (null = no se sap)
    function prop(k, p) {
      const m = MOTS.get(p) || { p };
      switch (k) {
        case 'lletra': return lletraDe(p);
        case 'sil1': { if (!m.s) return null; const s = net(m.s.split('-')[0]); return s; }
        case 'nsil': return m.s ? m.s.split('-').length : null;
        case 'grup': return m.g && !m.d ? m.g : null;
        case 'rima': { const n = net(p); const r = D.rimes.find(x => n.endsWith(net(x)) && (x !== 'ó' || p.endsWith('ó'))); return r || 'r:' + n.slice(-3); }
        case 'nombre': return m.nombre || null;
        case 'gram': return m.gram || null;
        case 'compost': return !!m.compost;
        case 'dim': return !!m.dim;
        default: return null;
      }
    }
    // És la paraula i l'única diferent en el criteri k? true / false / null (no se sap)
    function unica(k, mots, i) {
      const v = mots.map(p => prop(k, p));
      if (v.some(x => x === null)) return null;
      const altres = v.filter((_, j) => j !== i);
      return altres.every(x => x === altres[0]) && v[i] !== altres[0];
    }
    // Una ronda és bona si cap altra paraula pot ser l'intrús per un altre criteri del nivell
    function senseAmbiguitat(mots, t) {
      const ks = CRITERIS[config.nivell].filter(k => ['lletra', 'sil1', 'nsil', 'grup', 'rima', 'nombre', 'gram', 'compost', 'dim'].includes(k));
      for (let j = 0; j < 4; j++) if (j !== t) for (const k of ks) if (unica(k, mots, j) === true) return false;
      // Paraules amb dos sentits: mai al costat d'una paraula de l'altre grup
      for (const p of mots) {
        const m = MOTS.get(p); if (!m || !m.d) continue;
        if (mots.some(q => q !== p && (prop('grup', q) === m.d || prop('grup', q) === m.g))) return false;
      }
      return new Set(mots).size === 4;
    }

    // ---------------- Generadors de rondes ----------------
    const facil = () => config.nivell === 'facil';
    const pool = () => [...MOTS.values()].filter(m => m.base && (facil() ? m.e : true));
    const agrupa = (ms, f) => { const g = new Map(); ms.forEach(m => { const k = f(m); if (k == null) return; if (!g.has(k)) g.set(k, []); g.get(k).push(m); }); return g; };
    const confon = (a, b) => CONFON.some(([x, y]) => (a === x && b === y) || (a === y && b === x));

    const GEN = {
      lletra() {
        const ms = pool().filter(m => !(facil() && m.x) && !m.d);
        const g = [...agrupa(ms, m => lletraDe(m.p)).entries()].filter(([, v]) => v.length >= 3);
        const [L, v] = triar(g);
        const tres = barrejar(v).slice(0, 3).map(m => m.p);
        const fora = triar(ms.filter(m => lletraDe(m.p) !== L && !(facil() && confon(lletraDe(m.p), L)))).p;
        return { tres, fora, retol: format(L), exp: x => `${cometes(x.fora)} no comença per ${x.retol}; ${llista(x.tres.map(format))} sí.` };
      },
      grup() {
        const ms = pool().filter(m => m.g && !m.d);
        const g = [...agrupa(ms, m => m.g).entries()].filter(([, v]) => v.length >= 3);
        const [G, v] = triar(g);
        const fam = D.grups[G].f;
        let altres = ms.filter(m => m.g !== G);
        if (facil()) altres = altres.filter(m => D.grups[m.g].f !== fam);
        else if (Math.random() < .5) { const prop = altres.filter(m => D.grups[m.g].f === fam); if (prop.length) altres = prop; }
        const fora = triar(altres);
        return { tres: barrejar(v).slice(0, 3).map(m => m.p), fora: fora.p,
          exp: x => `${cometes(x.fora)} és ${D.grups[fora.g].u}; ${llista(x.tres.map(format))} són ${D.grups[G].pl}.` };
      },
      sil1() {
        const ms = pool().filter(m => m.s && !m.d);
        const g = [...agrupa(ms, m => { const s = net(m.s.split('-')[0]); return s.length >= 2 ? s : null; }).entries()].filter(([, v]) => v.length >= 3);
        const [S, v] = triar(g);
        let fora = ms.filter(m => net(m.s.split('-')[0]) !== S);
        if (facil()) fora = fora.filter(m => lletraDe(m.p) !== S[0] && !confon(lletraDe(m.p), S[0]));
        const tres = barrejar(v).slice(0, 3);
        return { tres: tres.map(m => m.p), fora: triar(fora).p, retol: format(S),
          exp: x => `${cometes(x.fora)} no comença per ${x.retol}; ${llista(tres.map(m => format(m.s)))} sí.` };
      },
      rima() {
        const ms = pool().filter(m => !m.d);
        const g = [...agrupa(ms, m => { const r = prop('rima', m.p); return r.startsWith('r:') ? null : r; }).entries()].filter(([, v]) => v.length >= 3);
        const [R, v] = triar(g);
        const fora = triar(ms.filter(m => prop('rima', m.p) !== R));
        return { tres: barrejar(v).slice(0, 3).map(m => m.p), fora: fora.p, exp: x => `${cometes(x.fora)} no acaba en -${format(R)}, com ${llista(x.tres.map(format))}.` };
      },
      nombre() {
        const parells = barrejar(D.plurals).slice(0, 4);
        const enPlural = Math.random() < .5;
        const tres = parells.slice(0, 3).map(x => enPlural ? x[1] : x[0]);
        const fora = enPlural ? parells[3][0] : parells[3][1];
        return { tres, fora, exp: x => `${cometes(x.fora)} està en ${enPlural ? 'singular' : 'plural'}; ${llista(x.tres.map(format))} estan en ${enPlural ? 'plural' : 'singular'}.` };
      },
      sinon() {
        const s = triar(D.sinonims);
        return { tres: barrejar(s.iguals).slice(0, 3), fora: triar(s.contraris), exp: x => `${cometes(x.fora)} vol dir el contrari; ${llista(x.tres.map(format))} volen dir el mateix.` };
      },
      part() {
        const t = triar(D.partTot);
        return { tres: barrejar(t.parts).slice(0, 3), fora: triar(t.fora), exp: x => `${cometes(x.fora)} no és una part ${t.tot}; ${llista(x.tres.map(format))} sí.` };
      },
      compost() {
        const tres = barrejar(D.compostes).slice(0, 3);
        const fora = triar([...MOTS.values()].filter(m => m.gram === 'nom' && !m.compost && m.s && m.s.split('-').length >= 2)).p;
        const ex = tres[0], pa = D.composta.get(ex);
        return { tres, fora, exp: x => `${cometes(x.fora)} no és una paraula composta; les altres s'han fet ajuntant dues paraules (${format(ex)}: ${format(pa[0])} + ${format(pa[1])}).` };
      },
      nsil() {
        const ms = pool().filter(m => m.s && !m.d);
        const g = [...agrupa(ms, m => m.s.split('-').length).entries()].filter(([, v]) => v.length >= 3);
        const [N, v] = triar(g);
        const fora = triar(ms.filter(m => m.s.split('-').length !== N));
        const n = fora.s.split('-').length, sl = k => k === 1 ? '1 síl·laba' : `${k} síl·labes`;
        return { tres: barrejar(v).slice(0, 3).map(m => m.p), fora: fora.p, exp: x => `${cometes(x.fora)} té ${sl(n)} (${format(fora.s)}); les altres en tenen ${N}.` };
      },
      gram() {
        const tipus = triar(['verb', 'adjectiu', 'nom']);
        const de = t => t === 'nom' ? [...MOTS.values()].filter(m => m.gram === 'nom' && m.s).map(m => m.p) : D.gram[t];
        const altre = triar(['verb', 'adjectiu', 'nom'].filter(t => t !== tipus));
        const NOM = { nom: ['un nom', 'noms', 'diuen coses, animals o persones'], verb: ['un verb', 'verbs', 'diuen accions'], adjectiu: ['un adjectiu', 'adjectius', 'diuen com és una cosa'] };
        return { tres: barrejar(de(tipus)).slice(0, 3), fora: triar(de(altre)),
          exp: x => `${cometes(x.fora)} és ${NOM[altre][0]}; ${llista(x.tres.map(format))} són ${NOM[tipus][1]} (${NOM[tipus][2]}).` };
      },
      intens() {
        const e = triar(D.intensitat);
        const [costat, desc, altre] = e.a.length >= 3 && (e.b.length < 3 || Math.random() < .5) ? [e.a, e.da, e.b] : [e.b, e.db, e.a];
        return { tres: barrejar(costat).slice(0, 3), fora: triar(altre), exp: x => `${cometes(x.fora)} és a l'altre extrem; ${llista(x.tres.map(format))} són ${desc}.` };
      },
      dim() {
        const ds = barrejar(D.dims);
        const tres = ds.slice(0, 3).map(x => x.dim);
        const fora = triar(ds.slice(3).filter(x => !/(et|eta|ol|ola)$/.test(x.p))).p;
        return { tres, fora, exp: x => `${cometes(x.fora)} no és un diminutiu; ${llista(x.tres.map(format))} són coses petites.` };
      },
    };

    // Textos dels motius (Difícil). v = valor de l'intrús
    const MOTIU = {
      lletra: () => 'És l\'única que no comença per la mateixa lletra',
      sil1: () => 'És l\'única que no comença amb la mateixa síl·laba',
      nsil: v => `És l'única que té ${v === 1 ? '1 síl·laba' : v + ' síl·labes'}`,
      grup: () => 'És l\'única que no és del mateix grup',
      rima: () => 'És l\'única que no rima amb les altres',
      nombre: v => `És l'única en ${v}`,
      gram: v => `És l'única que és ${v === 'nom' ? 'un nom' : v === 'verb' ? 'un verb' : 'un adjectiu'}`,
      compost: v => v ? 'És l\'única paraula composta' : 'És l\'única que no és composta',
      dim: v => v ? 'És l\'única que és un diminutiu' : 'És l\'única que no és un diminutiu',
      sinon: () => 'És l\'única que vol dir el contrari',
      part: () => 'És l\'única que no és una part de la mateixa cosa',
      intens: () => 'És l\'única de l\'altre extrem',
    };

    function crearRonda() {
      const ks = CRITERIS[config.nivell];
      for (let intent = 0; intent < 400; intent++) {
        // Criteri: variat, mai el mateix dues rondes seguides
        const k = triar(ks.filter(x => x !== ultimCriteri));
        let r; try { r = GEN[k](); } catch { continue; }
        if (!r || !r.fora || r.tres.length < 3) continue;
        const t = Math.floor(Math.random() * 4);
        const mots = r.tres.slice(); mots.splice(t, 0, r.fora);
        if (mots.some(p => usades.has(p)) && intent < 200) continue;
        if (!senseAmbiguitat(mots, t)) continue;
        let motius = null;
        if (config.nivell === 'dificil') {
          // Un motiu fals ha de ser fals tal com es llegeix: «És l'única que té 2 síl·labes» només si n'hi ha una altra amb 2
          const DE_VALOR = ['nsil', 'nombre', 'gram', 'compost', 'dim'];
          const fals = m => DE_VALOR.includes(m)
            ? prop(m, mots[t]) !== null && mots.some((q, j) => j !== t && prop(m, q) === prop(m, mots[t])) && mots.every(q => prop(m, q) !== null)
            : unica(m, mots, t) === false;
          const falsos = barrejar(Object.keys(MOTIU).filter(m => m !== k && ['lletra', 'sil1', 'nsil', 'grup', 'rima', 'nombre', 'gram', 'compost', 'dim'].includes(m) && fals(m)));
          // Primer els motius que sonen possibles (les paraules no són totes iguals en aquell criteri)
          const varia = m => new Set(mots.map(q => String(prop(m, q)))).size > 1;
          falsos.sort((x, y) => varia(y) - varia(x));
          if (falsos.length < 2) continue;
          const txt = m => MOTIU[m](prop(m, mots[t]));
          const bo = ['lletra', 'sil1', 'nsil', 'grup', 'rima', 'nombre', 'gram', 'compost', 'dim'].includes(k) ? txt(k) : MOTIU[k]();
          motius = barrejar([{ t: bo, bo: true }, { t: txt(falsos[0]) }, { t: txt(falsos[1]) }]);
          if (new Set(motius.map(m => m.t)).size < 3) continue;
        }
        ultimCriteri = k; mots.forEach(p => usades.add(p));
        return { k, mots, t, retol: (k === 'lletra' || k === 'sil1') && facil() ? r.retol : null, exp: r.exp(r), motius };
      }
      return null;
    }

    // ---------------- Ronda ----------------
    function seguent() {
      clearTimeout(seguentT);
      $('btn-seguent').hidden = true;
      idx++;
      if (idx >= RONDES) return final();
      errors = 0; ambAjuda = false; bloquejat = false;
      const r = crearRonda();
      if (!r) { console.error('No s\'ha pogut fer una ronda'); return final(); }
      P = { ...r, fase: 'triar', botons: [], btnMotius: [] };
      $('zona').innerHTML = ''; $('zona').classList.remove('pas-motiu');
      $('btn-pista').disabled = false; $('btn-pista').hidden = false;
      // Enunciat
      const en = $('enunciat'); en.innerHTML = '';
      if (P.retol) { en.append(el('span', '', `Quin${facil() ? '' : 'a'} NO comença per`), el('span', 'retol', P.retol), el('span', '', '?')); }
      else en.textContent = facil() ? 'Quin dibuix no hi encaixa?' : 'Quina paraula no hi encaixa?';
      // Opcions
      const z = el('div', 'contingut'); $('zona').appendChild(z);
      const g = el('div', 'opcions-joc' + (facil() ? ' amb-dibuix' : ''));
      P.botons = P.mots.map((p, i) => {
        const b = el('button', 'op opcio-resposta'); b.type = 'button';
        if (facil()) b.appendChild(el('span', 'emoji', MOTS.get(p).e));
        const nom = el('span', 'nom', format(p));
        if (p.length >= 15) nom.classList.add('molt-llarga'); else if (p.length >= 11) nom.classList.add('llarga');   // paraules llargues: lletra més petita, sense partir-les
        b.appendChild(nom);
        b.addEventListener('click', () => triarOp(i));
        g.appendChild(b); return b;
      });
      z.appendChild(g);
      ajustarNoms();
      mostrar(facil() ? 'Tria el dibuix que no va amb els altres' : 'Tria la paraula que no va amb les altres', 'Fes clic a la targeta que no hi encaixa.');
      pintarDades();
      iniciarTemps();
    }

    // Cada nom en una sola línia: si no hi cap, la lletra es fa més petita
    function ajustarNoms() {
      document.querySelectorAll('.op .nom').forEach(n => {
        n.style.fontSize = '';
        let mida = parseFloat(getComputedStyle(n).fontSize);
        const ample = n.parentElement.clientWidth - 12;
        while (n.scrollWidth > ample && mida > 10) { mida -= 1; n.style.fontSize = mida + 'px'; }
      });
    }
    let esperaAjust;
    addEventListener('resize', () => { clearTimeout(esperaAjust); esperaAjust = setTimeout(ajustarNoms, 80); });

    function donarPista() { mostrar('💡 Pista', PISTES[P.k], 'pista'); }

    function triarOp(i) {
      if (bloquejat || P.fase !== 'triar') return;
      const b = P.botons[i];
      if (i === P.t) {
        b.classList.add('be');
        P.botons.forEach((x, j) => { x.disabled = true; if (j !== i) x.classList.add('apagada'); });
        if (P.motius) return demanarMotiu();
        bloquejat = true; aturar();
        return acabar(errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio('✓ Molt bé!'), P.exp);
      }
      errors++;
      b.classList.add('mal'); b.disabled = true; sacsejar(b);
      if (config.temps || errors >= 3) return mostrarResp(config.temps ? `${cometes(P.mots[i])} no és l'intrús` : null);
      if (errors === 1) mostrar(`${cometes(P.mots[i])} no és l'intrús`, 'Torna-ho a provar.', 'error');
      else { ambAjuda = true; mostrar(`${cometes(P.mots[i])} tampoc`, 'Pista: ' + PISTES[P.k], 'pista'); $('btn-pista').disabled = true; }
      pintarDades();
    }

    // Difícil: després de trobar l'intrús, per què?
    function demanarMotiu() {
      P.fase = 'motiu';
      $('btn-pista').hidden = true;
      $('zona').classList.add('pas-motiu');
      ajustarNoms();
      const box = el('div', 'motius');
      box.appendChild(el('p', '', `Per què ${cometes(P.mots[P.t])} no hi encaixa?`));
      P.btnMotius = P.motius.map((m, i) => {
        const b = el('button', 'motiu opcio-resposta'); b.type = 'button';
        b.append(el('span', 'motiu-text', m.t));
        b.addEventListener('click', () => triarMotiu(i));
        box.appendChild(b); return b;
      });
      $('zona').querySelector('.contingut').appendChild(box);
      mostrar('Has trobat l\'intrús!', 'Ara tria per què no hi encaixa.', 'guanyat');
    }
    function triarMotiu(i) {
      if (bloquejat || P.fase !== 'motiu') return;
      bloquejat = true; aturar();
      const bo = P.motius.findIndex(m => m.bo);
      P.btnMotius.forEach(b => b.disabled = true);
      if (i === bo) {
        P.btnMotius[i].classList.add('be');
        return acabar(errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio('✓ Molt bé!'), P.exp);
      }
      P.btnMotius[i].classList.add('mal'); P.btnMotius[bo].classList.add('dita'); sacsejar(P.btnMotius[i]);
      acabar('malament', 'El motiu era un altre', P.exp);
    }

    function mostrarResp(titol) {
      bloquejat = true; aturar();
      if (P.fase !== 'motiu') P.botons.forEach((x, j) => { x.disabled = true; if (j === P.t) x.classList.add('dita'); else if (!x.classList.contains('mal')) x.classList.add('apagada'); });
      if (P.fase === 'motiu') { const bo = P.motius.findIndex(m => m.bo); P.btnMotius.forEach(b => b.disabled = true); P.btnMotius[bo].classList.add('dita'); }
      acabar('malament', titol || (config.temps && !errors ? "S'ha acabat el temps ⏱" : `L'intrús era ${cometes(P.mots[P.t])}`), P.exp);
    }

    function acabar(r, titol, extra, origen) {
      resultats.push(r);
      P.fase = 'fet';
      $('btn-pista').disabled = true; $('btn-pista').hidden = true;
      mostrar(titol, extra, r === 'malament' ? 'pista' : 'guanyat');
      if (r !== 'malament') Celebracio.petita(origen || $('missatge'));
      pintarDades();
      const s = $('btn-seguent'); s.hidden = false; s.textContent = idx + 1 >= RONDES ? 'Acaba 🏁' : 'Següent ▶';
      setTimeout(() => { if (!s.hidden) s.focus({ preventScroll: true }); }, 50);
    }

    // ---------------- Temps (per fitxa: compta des que surt) ----------------
    function iniciarTemps() {
      aturar();
      if (!config.temps) return;
      const totalMs = config.temps * 1000;
      limit = performance.now() + totalMs;
      const barra = $('temps-barra');
      const pas = () => {
        const queda = limit - performance.now();
        barra.style.transform = `scaleX(${Math.max(0, queda / totalMs)})`;
        $('temps').classList.toggle('poc', queda <= 3000);
        if (queda <= 0) { if (!bloquejat) mostrarResp("S'ha acabat el temps ⏱"); return; }
        animacio = requestAnimationFrame(pas);
      };
      pas();
    }
    function aturar() { cancelAnimationFrame(animacio); animacio = null; }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || $('pantalla-joc').hidden || bloquejat || !config.temps || !P || P.fase === 'fet') return;
      iniciarTemps();
    });

    // ---------------- Final ----------------
    function final() {
      aturar();
      P = null;
      $('btn-seguent').hidden = true;
      const nets = resultats.filter(r => r === 'be').length;
      const mal = resultats.filter(r => r === 'malament').length;
      const comptar = Preferencies.errors();
      let titol = nets === RONDES ? 'Tot a la primera!' : 'Partida acabada!';
      let subtitol = `${nets} de ${RONDES} a la primera`;
      const estrelles = nets >= 9 ? 3 : mal <= 2 ? 2 : 1;
      if (comptar) {
        const clau = `appjocs.intrus.record.${config.nivell}.${config.temps}`;
        let record = null; try { const v = localStorage.getItem(clau); record = v === null ? null : Number(v); } catch {}
        const nou = record === null || nets > record;
        if (nou) { try { localStorage.setItem(clau, String(nets)); } catch {} }
        subtitol += nou ? (record !== null ? ' · 🏅 Nou rècord!' : '') : ` · Rècord: ${record}`;
      } else { titol = 'Partida acabada!'; subtitol = `Has fet ${RONDES} fitxes.`; }
      mostrar('🎉 ' + titol, subtitol, 'guanyat');
      Celebracio.gran({ titol, subtitol, emoji: nets === RONDES ? '🏆' : '🕵️', estrelles });
    }

    // ---------------- Dades i missatges ----------------
    function pintarDades() {
      const comptar = Preferencies.errors();
      const punts = Array.from({ length: RONDES }, (_, i) =>
        `<i class="${i < resultats.length ? (comptar ? resultats[i] : 'fet') : i === resultats.length ? 'ara' : ''}"></i>`).join('');
      let html = `<span class="dada">Fitxa <b>${Math.min(idx + 1, RONDES)}</b>/${RONDES} <span class="progres">${punts}</span></span>`;
      if (comptar) html += `<span class="dada">A la primera: <b>${resultats.filter(r => r === 'be').length}</b></span>`;
      $('dades').innerHTML = html;
    }
    function sacsejar(x) { x.classList.remove('sacseig'); void x.offsetWidth; x.classList.add('sacseig'); }
    function mostrar(t, extra = '', estat = '') {
      const m = $('missatge');
      $('msg-text').textContent = t; $('msg-extra').textContent = extra;
      m.classList.remove('es-pista', 'es-error', 'es-guanyat');
      if (estat) m.classList.add('es-' + estat);
    }

    Pantalla.avisOrientacio('intrus', { dins: document.getElementById('pantalla-inici') });
  </script>
</body>
</html>
