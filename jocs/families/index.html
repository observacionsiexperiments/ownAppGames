<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Paraules en família · Juguem?</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <script>try{var t=JSON.parse(localStorage.getItem("appjocs.preferencies")||"{}").aparenca;if(t==="fosc"||t==="clar")document.documentElement.dataset.tema=t}catch(e){}</script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Colors per rol (css/styles.css): verd = encert · rosa = error · groc = pista / temps que s'acaba ·
       blau = triat / per omplir · préssec = acció. */
    .joc { width: 100%; max-width: 1040px; margin: 0 auto; }
    [hidden] { display: none !important; }
    h2.titol { font-size: 1.15rem; margin: 16px 0 8px; }

    /* ---------- Inici ---------- */
    .inici { max-width: 860px; margin: 0 auto; }
    .opcions { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .opcions button {
      font: inherit; cursor: pointer; color: var(--text); touch-action: manipulation;
      background: var(--superficie); border: 2px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra);
      min-height: 56px; padding: 8px; font-weight: 700; font-size: 1.05rem;
    }
    .opcions button small { display: block; font-weight: 500; font-size: .82rem; color: var(--text-suau); margin-top: 2px; }
    .opcions button[aria-pressed="true"] { background: var(--c-info); border-color: var(--c-info-vora); color: var(--tinta); }
    .opcions button[aria-pressed="true"] small { color: var(--tinta); }
    @media (hover: hover) { .opcions button:hover { border-color: var(--c-info-vora); } }
    .comencar { text-align: center; margin: 20px 0 8px; }
    .comencar .btn { font-size: 1.3rem; padding: 14px 40px; }

    /* ---------- Joc ---------- */
    .cap-joc { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
    .dades { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dada { background: var(--superficie); border: 1px solid var(--vora); border-radius: 999px; padding: 4px 12px; font-size: .95rem; }
    .dada b { font-variant-numeric: tabular-nums; }
    .progres { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
    .progres i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--vora); background: var(--superficie); }
    .progres i.be { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .progres i.ajuda { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .progres i.malament { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .progres i.fet { background: var(--vora); }
    .progres i.ara { background: var(--c-info); border-color: var(--c-info-vora); color: var(--tinta); }

    .tauler { background: var(--superficie); border: 2px solid var(--vora); border-radius: var(--radi); padding: 16px 20px;
      display: flex; flex-direction: column; gap: 12px; --pz: clamp(1rem, 1.9vw, 1.25rem); }
    .enunciat { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; text-align: center; margin: 0;
      font-size: clamp(1.05rem, 2.1vw, 1.25rem); font-weight: 700; }
    .retol { font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 900; font-size: 1.5em;
      padding: .05em .45em; border-radius: 12px; background: var(--c-info); border: 3px solid var(--c-info-vora); color: var(--tinta); }
    .temps { height: 12px; border-radius: 999px; background: var(--fons); border: 1px solid var(--vora); overflow: hidden; }
    .temps i { display: block; height: 100%; width: 100%; background: color-mix(in srgb, var(--text-suau) 45%, var(--superficie)); border-radius: 999px; transform-origin: left; }
    .temps.poc i { background: var(--c-pista-vora); }
    #zona { display: flex; flex-direction: column; gap: 12px; }
    #zona > .contingut { display: flex; flex-direction: column; gap: 12px; }

    /* Fitxes de paraula */
    .fitxa { font: inherit; font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 800;
      font-size: var(--pz); color: var(--text); letter-spacing: .02em; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
      display: inline-flex; align-items: center; gap: .35em; padding: .3em .7em; border-radius: 12px;
      background: var(--superficie); border: 3px solid color-mix(in srgb, var(--text-suau) 45%, var(--superficie)); box-shadow: 0 3px 0 rgba(59, 51, 85, .1); }
    .fitxa .em { font-size: 1.35em; line-height: 1; }
    .fitxa.triada { background: var(--c-info); border-color: var(--c-info-vora); color: var(--tinta); }
    .fitxa.fantasma { position: fixed; z-index: 100; pointer-events: none; opacity: .92; transform: rotate(-3deg); margin: 0; }
    .fitxa.arrossegant { opacity: .3; }
    .fitxa.mal { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .fitxa:disabled { cursor: default; }
    .fitxa.estatica { cursor: default; }
    @media (hover: hover) { .fitxa:not(:disabled):not(.estatica):hover { border-color: var(--c-info-vora); } }
    .maj .fitxa .txt, .maj .capsa h3, .maj .op-tema { text-transform: uppercase; }

    .safata { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; min-height: 2.6em; padding: 8px;
      border-radius: 16px; background: var(--fons); border: 2px dashed var(--vora); }
    .safata:empty::after { content: '✓'; color: var(--text-suau); font-weight: 800; align-self: center; }

    /* Capses (camps lèxics) */
    .capses { display: grid; gap: 10px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
    .capsa { border: 3px dashed var(--c-info-vora); border-radius: 16px; background: color-mix(in srgb, var(--c-info) 18%, var(--superficie));
      padding: 6px; min-height: 5.2em; display: flex; flex-direction: column; gap: 6px; cursor: pointer; color: var(--text); }
    .capsa h3 { margin: 0; text-align: center; font-size: calc(var(--pz) * .82); letter-spacing: .03em; overflow-wrap: normal; word-break: keep-all; }
    .capsa .dins { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
    .capsa .dins .fitxa { pointer-events: none; font-size: calc(var(--pz) * .72); padding: .15em .45em; border-width: 2px; box-shadow: none; cursor: default;
      background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .capsa .dins .fitxa.dita { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .capsa.sobre { background: var(--c-info); color: var(--tinta); }
    .capsa.pista { border-style: solid; border-color: var(--c-pista-vora); background: var(--c-pista); color: var(--tinta); }
    .capsa.fora { border-color: color-mix(in srgb, var(--text-suau) 50%, white); background: var(--fons); }

    /* Endevina el tema */
    .mostra { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; }
    .temes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(100%, 720px); margin: 0 auto; }
    .op-tema { font: inherit; cursor: pointer; color: var(--text); font-weight: 800; font-size: calc(var(--pz) * .95);
      background: var(--superficie); border: 3px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra); padding: .6em .5em; letter-spacing: .02em; }
    .op-tema:disabled { cursor: default; }
    .op-tema.be { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .op-tema.mal { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .op-tema.dita { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    @media (hover: hover) { .op-tema:not(:disabled):hover { border-color: var(--c-info-vora); } }

    /* Famílies: núvol de paraules */
    .nuvol { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 12px; padding: 4px; }
    .nuvol .fitxa { cursor: pointer; }
    .nuvol .fitxa.be { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .nuvol .fitxa.dita { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .nuvol .fitxa.indicada { border-color: var(--c-pista-vora); border-style: dashed; }
    .nuvol .fitxa.apagada { opacity: .45; }

    .peu { display: flex; flex-direction: column; gap: 12px; }
    .missatge { min-height: 3.2rem; padding: 8px 12px; border-radius: var(--radi); text-align: center; background: var(--superficie);
      border: 2px solid var(--vora); font-weight: 700; font-size: 1.08rem; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .missatge small { font-weight: 500; font-size: .95rem; }
    .missatge small:empty { display: none; }
    .missatge.es-pista { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .missatge.es-error { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .missatge.es-guanyat { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .botons-peu { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn-pista { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .btn-ok { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    @keyframes sacseig { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .sacseig { animation: sacseig .25s 2; }

    /* Tauleta i portàtil (criteri comú «ple», css/styles.css): el tauler omple la pantalla i tot creix amb l'espai */
    @media (min-width: 601px) and (min-height: 501px) {
      .tauler { --pz: clamp(1.05rem, min(3vw, 4.1vh), 2.1rem); padding: 16px 22px; gap: 14px; }
      /* Endevina el tema i núvol de famílies: hi ha poques peces, es poden fer més grans */
      .mostra .fitxa, .nuvol .fitxa { font-size: calc(var(--pz) * 1.15); }
      .op-tema { font-size: calc(var(--pz) * 1.05); }
      .enunciat { font-size: calc(var(--pz) * .95); }
      #zona { flex: 1 1 auto; min-height: 0; }
      #zona > .contingut { flex: 1 1 auto; justify-content: center; gap: clamp(12px, 3vh, 32px); }
      #zona > .contingut:has(.capses) { justify-content: flex-start; gap: clamp(10px, 2vh, 20px); }
      .mostra, .nuvol { gap: clamp(8px, 1.6vh, 16px) clamp(10px, 1.4vw, 18px); }
      .temes { width: min(100%, 1100px); gap: clamp(10px, 1.4vw, 18px); }
      .op-tema { padding: .8em .5em; }
      .capses { flex: 1 1 auto; gap: clamp(10px, 1.2vw, 16px); }
      .capsa { padding: 8px; }
      .capsa .dins { gap: 6px; }
      .safata { min-height: 2.4em; padding: 10px; }
    }
    /* Tauleta en vertical: 4 capses en 2 + 2 i 5 capses en 3 + 2 (més amples per als títols i les paraules) */
    @media (orientation: portrait) and (min-width: 601px) {
      .capses[data-n="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .capses[data-n="5"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    /* Mòbil apaïsat: el missatge i els botons a la dreta (a sota no hi cabrien) */
    @media (orientation: landscape) and (max-height: 500px) {
      .tauler { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 240px); column-gap: 16px; row-gap: 8px;
        grid-template-areas: "enun peu" "temps peu" "zona peu"; align-items: start; padding: 12px 18px; }
      .tauler .enunciat { grid-area: enun; }
      .tauler .temps { grid-area: temps; }
      .tauler #zona { grid-area: zona; min-width: 0; }
      .tauler .peu { grid-area: peu; align-self: center; }
      .tauler .botons-peu { flex-direction: column; align-items: stretch; }
      .cap-joc { margin: 0 0 8px; }
      .cap-joc .btn { padding: 6px 14px; }
      .missatge { min-height: 0; padding: 6px 10px; font-size: 1rem; }
      h2.titol { margin: 8px 0 6px; }
      .opcions button { min-height: 46px; padding: 6px; }
      .comencar { margin: 12px 0 4px; }
    }
    @media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 500px) {
      .barra-joc { padding: 6px 0; }
      .barra-joc h1 { font-size: 1.1rem; }
      .cap-joc { margin: 0 0 6px; gap: 6px; flex-wrap: nowrap; }
      .dada { font-size: .8rem; padding: 2px 8px; }
      .progres i { width: 8px; height: 8px; }
      .cap-joc .btn { padding: 5px 10px; font-size: .85rem; white-space: nowrap; }
      .tauler { padding: 8px; gap: 8px; --pz: .9rem; }
      .enunciat { font-size: .92rem; gap: 6px; }
      #zona, #zona > .contingut { gap: 8px; }
      .fitxa { border-width: 2px; padding: .22em .5em; }
      .safata { gap: 5px 6px; padding: 5px; }
      .capses { gap: 6px; }
      .capsa { min-height: 3.6em; padding: 4px; border-width: 2px; gap: 3px; }
      .temes { gap: 6px; }
      .op-tema { padding: .45em .3em; border-width: 2px; }
      .nuvol { gap: 6px 8px; }
      .missatge { min-height: 0; padding: 5px 8px; font-size: .92rem; }
      .missatge small { font-size: .82rem; }
      .botons-peu .btn { padding: 6px 14px; font-size: .95rem; }
    }
    @media (orientation: portrait) and (max-width: 600px) {
      .progres { display: none; }
      .capses { grid-template-columns: repeat(min(var(--n, 3), 2), minmax(0, 1fr)); }
      .capses[data-n="3"] .capsa:last-child { grid-column: 1 / -1; }
      .capses[data-n="5"] .capsa.fora { grid-column: 1 / -1; min-height: 2.6em; }
      .temes { grid-template-columns: 1fr; }
      main.joc .inici h2.titol { font-size: .92rem; margin: 5px 0 3px; }
      main.joc .inici .grup + .grup { margin-top: 6px; }
      main.joc .inici .opcions { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      main.joc .inici #op-mode, main.joc .inici #op-nivell { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      main.joc .inici #op-temps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      main.joc .inici .opcions button { min-height: 38px; padding: 3px; font-size: .88rem; }
      main.joc .inici .opcions button small { display: none; }
      main.joc .inici .comencar { margin: 8px 0 2px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      main.joc .inici h2.titol { font-size: .88rem; margin: 2px 0 2px; }
      main.joc .inici .grup + .grup { margin-top: 4px; }
      main.joc .inici .opcions button { min-height: 36px; font-size: .9rem; }
      main.joc .inici .opcions button small { display: none; }
      main.joc .inici .comencar { margin: 6px 0 2px; }
      .tauler { padding: 6px 10px; row-gap: 4px; --pz: .85rem; }
      #zona, #zona > .contingut { gap: 5px; }
      .capsa { min-height: 2.8em; }
      .retol { font-size: 1.25em; }
    }
    /* Tauleta en vertical: la lletra i les peces es calculen també per l'alçada (n'hi ha molta) */
    @media (orientation: portrait) and (min-width: 601px) and (min-height: 501px) {
      .tauler { --pz: clamp(1.1rem, min(4.4vw, 3.3vh), 2.1rem); }
      .op-tema { font-size: calc(var(--pz) * .8); padding: .8em .3em; }
    }
    /* Mòbil vertical (criteri «ple»): la zona de joc omple l'alçada i les peces creixen amb la pantalla */
    @media (orientation: portrait) and (max-width: 600px) {
      .tauler { --pz: clamp(.95rem, min(4.6vw, 2.6vh), 1.4rem); }
      #zona { flex: 1 1 auto; min-height: 0; }
      #zona > .contingut { flex: 1 1 auto; justify-content: center; gap: clamp(10px, 2.6vh, 26px); }
      #zona > .contingut:has(.capses) { justify-content: flex-start; }
      .capses { flex: 1 1 auto; }
      .op-tema { padding: .9em .4em; }
      .mostra .fitxa, .nuvol .fitxa { font-size: calc(var(--pz) * 1.1); }
    }
  </style>
</head>
<body>
  <nav class="barra-joc">
    <a href="../../">← Inici</a>
    <h1>🗂️ Paraules en família</h1>
  </nav>

  <main class="joc ple">
    <!-- ================= INICI ================= -->
    <section class="inici" id="pantalla-inici">
      <div class="grup">
        <h2 class="titol">1. Què vols fer?</h2>
        <div class="opcions" id="op-mode">
          <button type="button" data-v="camps" aria-pressed="true">🗂️ Camps<small>endevina el tema i classifica</small></button>
          <button type="button" data-v="families" aria-pressed="false">🌳 Famílies<small>troba les de la mateixa arrel</small></button>
          <button type="button" data-v="barrejat" aria-pressed="false">🔀 Barrejat<small>una cosa i l'altra</small></button>
        </div>
      </div>
      <div class="grup">
        <h2 class="titol">2. Dificultat</h2>
        <div class="opcions" id="op-nivell">
          <button type="button" data-v="facil" aria-pressed="true">🌱 Fàcil<small>reconèixer</small></button>
          <button type="button" data-v="mitja" aria-pressed="false">Mitjà<small>classificar</small></button>
          <button type="button" data-v="dificil" aria-pressed="false">Difícil<small>raonar</small></button>
        </div>
      </div>
      <div class="grup" id="grup-temps">
        <h2 class="titol">3. Temps per tauler</h2>
        <div class="opcions" id="op-temps">
          <button type="button" data-v="0" aria-pressed="true">Sense temps</button>
          <button type="button" data-v="60" aria-pressed="false">1 min</button>
          <button type="button" data-v="120" aria-pressed="false">2 min</button>
          <button type="button" data-v="180" aria-pressed="false">3 min</button>
        </div>
      </div>
      <div class="grup">
        <h2 class="titol">4. Quina lletra?</h2>
        <div class="opcions" id="op-lletra">
          <button type="button" data-v="maj" aria-pressed="true">MAJÚSCULA</button>
          <button type="button" data-v="min" aria-pressed="false">minúscula</button>
        </div>
      </div>
      <div class="comencar"><button class="btn" id="btn-comencar" type="button">Comença! 🗂️</button></div>
    </section>

    <!-- ================= JOC ================= -->
    <section id="pantalla-joc" hidden>
      <div class="cap-joc">
        <div class="dades" id="dades"></div>
        <button class="btn" id="btn-nova" type="button">↺ Nova partida</button>
      </div>
      <div class="tauler" id="tauler">
        <p class="enunciat" id="enunciat"></p>
        <div class="temps" id="temps" aria-hidden="true" hidden><i id="temps-barra"></i></div>
        <div id="zona"></div>
        <div class="peu franja">
          <div class="missatge" id="missatge" aria-live="polite"><span id="msg-text"></span><small id="msg-extra"></small></div>
          <div class="botons-peu">
            <button class="btn btn-ok" id="btn-comprova" type="button" hidden>Comprova ✓</button>
            <button class="btn btn-pista" id="btn-pista" type="button">💡 <span class="txt-llarg">Vull una pista</span><span class="txt-curt">Pista</span></button>
            <button class="btn" id="btn-seguent" type="button" hidden>Següent ▶</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/pantalla.js"></script>
  <script src="../../js/preferencies.js"></script>
  <script src="../../js/celebracio.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const TAULERS = 5;
    const config = { mode: 'camps', nivell: 'facil', temps: 0, lletra: 'maj' };
    // Capses i paraules per nivell (mode Camps) i paraules del núvol (mode Famílies)
    const NIVELL = {
      facil: { capses: 2, perCapsa: 3, trampes: 0, mostra: 4, familia: 4, nuvol: 8 },
      mitja: { capses: 3, perCapsa: 3, trampes: 0, mostra: 5, familia: 5, nuvol: 10 },
      dificil: { capses: 4, perCapsa: 2, trampes: 2, mostra: 5, familia: 5, nuvol: 12 },
    };
    let D = null, P = null, ON = new Map();     // ON: paraula → temes on surt (no pot fer de trampa en cap d'ells)
    let resultats, idx, errors, ambAjuda, bloquejat, animacio, limit, plaUsat, temesUsats, familiesUsades, tradicioFeta;

    const barrejar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const triar = a => a[Math.floor(Math.random() * a.length)];
    const format = t => config.lletra === 'maj' ? t.toLocaleUpperCase('ca') : t;
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    const net = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const cometes = p => `«${format(p)}»`;
    const facil = () => config.nivell === 'facil';
    const ambEmoji = c => c.paraules.filter(p => p.e);

    // ---------------- Inici ----------------
    function grupOpcions(id, clau, num) {
      $(id).addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
        config[clau] = num ? Number(b.dataset.v) : b.dataset.v;
      });
    }
    grupOpcions('op-mode', 'mode'); grupOpcions('op-nivell', 'nivell'); grupOpcions('op-temps', 'temps', true); grupOpcions('op-lletra', 'lletra');
    if (!Preferencies.temps()) { $('grup-temps').hidden = true; config.temps = 0; }

    $('btn-comencar').addEventListener('click', comencar);
    $('btn-nova').addEventListener('click', () => { aturar(); Celebracio.tancar(); $('pantalla-joc').hidden = true; $('pantalla-inici').hidden = false; });
    $('btn-pista').addEventListener('click', () => { if (!bloquejat && P && P.pista) { ambAjuda = true; P.pista(true); pintarDades(); } });
    $('btn-comprova').addEventListener('click', () => { if (!bloquejat && P && P.comprova) P.comprova(); });
    $('btn-seguent').addEventListener('click', seguent);
    document.addEventListener('keydown', ev => {
      if ($('pantalla-joc').hidden || $('btn-seguent').hidden) return;
      if ((ev.key === 'Enter' || ev.key === ' ') && document.activeElement?.tagName !== 'BUTTON') { ev.preventDefault(); seguent(); }
    });

    async function comencar() {
      try {
        if (!D) {
          D = await (await fetch('paraules.json')).json();
          D.temes.forEach(t => t.camps.forEach(c => c.paraules.forEach(p => { const k = net(p.p); if (!ON.has(k)) ON.set(k, new Set()); ON.get(k).add(t.id); })));
        }
      } catch { alert("No s'han pogut carregar les paraules. Torna-ho a provar."); return; }
      if (!Preferencies.temps()) config.temps = 0;
      idx = -1; resultats = []; temesUsats = new Set(); familiesUsades = new Set();
      // Les tradicions surten poc: com a molt un tauler de tradicions per partida, i no sempre
      tradicioFeta = Math.random() < .6;
      plaUsat = config.mode === 'barrejat' ? (Math.random() < .5 ? 0 : 1) : 0;
      $('temps').hidden = !config.temps;
      $('tauler').classList.toggle('maj', config.lletra === 'maj');
      $('pantalla-inici').hidden = true; $('pantalla-joc').hidden = false;
      window.scrollTo({ top: 0 });
      seguent();
    }

    function seguent() {
      $('btn-seguent').hidden = true;
      idx++;
      if (idx >= TAULERS) return final();
      errors = 0; ambAjuda = false; bloquejat = false;
      $('zona').innerHTML = '';
      $('btn-pista').hidden = false; $('btn-pista').disabled = false; $('btn-comprova').hidden = true;
      const mode = config.mode === 'barrejat' ? ((idx + plaUsat) % 2 ? 'families' : 'camps') : config.mode;
      P = mode === 'camps' ? camps() : families();
      P.iniciar();
      pintarDades();
      iniciarTemps();
    }

    // ================= MODE CAMPS =================
    // Temes que es poden fer en aquest nivell
    function temesPossibles() {
      const n = NIVELL[config.nivell];
      return D.temes.filter(t => {
        if (facil()) return t.camps.filter(c => ambEmoji(c).length >= n.perCapsa).length >= n.capses;
        return t.camps.filter(c => c.paraules.length >= n.perCapsa).length >= n.capses;
      });
    }
    function triarTema() {
      let ts = temesPossibles().filter(t => !temesUsats.has(t.id));
      if (!ts.length) { temesUsats.clear(); ts = temesPossibles(); }
      const trad = ts.filter(t => t.bloc === 'tradicions'), altres = ts.filter(t => t.bloc !== 'tradicions');
      // Un tauler de tradicions com a molt, i només de tant en tant (tauler 3 o 4)
      let t;
      if (!tradicioFeta && trad.length && idx >= 2 && Math.random() < .5) { t = triar(trad); tradicioFeta = true; }
      else t = triar(altres.length ? altres : ts);
      temesUsats.add(t.id); return t;
    }

    function camps() {
      const n = NIVELL[config.nivell];
      const tema = triarTema();
      // Capses: camps amb prou paraules (al Fàcil, amb dibuix)
      const bons = tema.camps.filter(c => (facil() ? ambEmoji(c) : c.paraules).length >= n.perCapsa);
      const capses = barrejar(bons).slice(0, n.capses).map(c => ({ nom: c.nom, paraules: barrejar(facil() ? ambEmoji(c) : c.paraules).slice(0, n.perCapsa) }));
      // Paraules del tauler (sense repetir)
      const vistes = new Set();
      let fitxes = [];
      capses.forEach((c, i) => c.paraules.forEach(p => { if (!vistes.has(net(p.p))) { vistes.add(net(p.p)); fitxes.push({ ...p, capsa: i }); } }));
      // Trampes (Difícil): d'un tema d'un altre bloc, i mai una paraula que també surt en aquest tema
      if (n.trampes) {
        const cand = barrejar(D.temes.filter(t => t.bloc !== tema.bloc && t.bloc !== 'tradicions').flatMap(t => t.camps.flatMap(c => c.paraules.map(p => ({ ...p, tema: t })))))
          .filter(p => !ON.get(net(p.p)).has(tema.id) && !vistes.has(net(p.p)));
        const tr = [];
        for (const p of cand) { if (tr.length >= n.trampes) break; if (tr.some(x => x.tema.id === p.tema.id)) continue; tr.push(p); }
        tr.forEach(p => { vistes.add(net(p.p)); fitxes.push({ p: p.p, e: p.e, capsa: capses.length, d: p.tema.de }); });
      }
      fitxes = barrejar(fitxes);
      const totes = n.trampes ? [...capses, { nom: 'No hi pertany', fora: true }] : capses;
      // Endevina el tema: 3 opcions de blocs diferents
      const blocs = barrejar(['quotidiana', 'natura', 'persones', 'tradicions'].filter(b => b !== tema.bloc)).slice(0, 2);
      const opcions = barrejar([tema, ...blocs.map(b => triar(D.temes.filter(t => t.bloc === b)))]);
      const mostra = barrejar(tema.camps.flatMap(c => facil() ? ambEmoji(c) : c.paraules)).slice(0, n.mostra);

      let fase = 'tema', errT = 0, triada = null, errP = new Map(), dites = 0, posades = 0;
      const pr = {
        iniciar() {
          $('enunciat').textContent = facil() ? 'De quin tema són aquests dibuixos?' : 'De quin tema són aquestes paraules?';
          const z = el('div', 'contingut'); $('zona').appendChild(z);
          const m = el('div', 'mostra safata-pregunta'); mostra.forEach(p => m.appendChild(fitxa(p, true))); z.appendChild(m);
          const g = el('div', 'temes');
          opcions.forEach(t => { const b = el('button', 'op-tema opcio-resposta', t.nom); b.type = 'button'; b.addEventListener('click', () => triarTema_(b, t)); g.appendChild(b); });
          z.appendChild(g);
          mostrar('Mira les paraules i pensa què tenen en comú', 'Tria el tema.');
        },
        pista(manual) {
          if (fase === 'tema') {
            const dolenta = [...$('zona').querySelectorAll('.op-tema')].find(b => !b.disabled && b.textContent !== tema.nom);
            if (dolenta) { dolenta.disabled = true; dolenta.style.opacity = .4; }
            mostrar('💡 Pista', 'He tret un tema que no és.', 'pista');
          } else {
            const f = triada || $('safata').querySelector('.fitxa');
            if (f) { seleccionar(f); indicar(Number(f.dataset.capsa)); mostrar('💡 Pista', `${cometes(f.dataset.p)} va a la capsa que s'il·lumina.`, 'pista'); }
          }
          if (manual) $('btn-pista').disabled = true;
        },
      };
      function triarTema_(b, t) {
        if (bloquejat || fase !== 'tema') return;
        if (t === tema) { b.classList.add('be'); return passarAClassificar(`✓ Sí! Són paraules ${tema.de}.`); }
        errors++; errT++;
        b.classList.add('mal'); b.disabled = true; sacsejar(b);
        if (errT >= 2) {
          dites++;
          $('zona').querySelectorAll('.op-tema').forEach(x => { if (x.textContent === tema.nom) x.classList.add('dita'); });
          return passarAClassificar(`Eren paraules ${tema.de}`, 'pista');
        }
        mostrar(`No són paraules ${t.de}`, 'Torna-ho a provar.', 'error'); pintarDades();
      }
      function passarAClassificar(titol, estat = 'guanyat') {
        fase = 'pausa';
        $('zona').querySelectorAll('.op-tema').forEach(x => x.disabled = true);
        mostrar(titol, 'Ara classifica les paraules.', estat);
        $('btn-pista').disabled = false;
        setTimeout(() => { if (P === pr && !bloquejat) classificar(); }, 1100);
        pintarDades();
      }
      function classificar() {
        fase = 'classificar';
        $('enunciat').innerHTML = '';
        $('enunciat').append(el('span', 'retol', format(tema.nom)));
        $('zona').innerHTML = '';
        const z = el('div', 'contingut'); $('zona').appendChild(z);
        const s = el('div', 'safata'); s.id = 'safata';
        fitxes.forEach(f => s.appendChild(fitxa(f)));
        z.appendChild(s);
        const cs = el('div', 'capses'); cs.id = 'capses'; cs.style.setProperty('--n', totes.length); cs.dataset.n = totes.length;
        totes.forEach((c, i) => {
          const b = el('div', 'capsa' + (c.fora ? ' fora' : '')); b.dataset.capsa = i; b.tabIndex = 0; b.setAttribute('role', 'button');
          b.append(el('h3', '', c.nom), el('div', 'dins'));
          cs.appendChild(b);
        });
        z.appendChild(cs);
        ajustarTitols();
        z.addEventListener('pointerdown', baixa);
        z.addEventListener('click', clic);
        z.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList.contains('capsa')) { ev.preventDefault(); if (triada) deixar(triada, ev.target); } });
        mostrar('Posa cada paraula a la seva capsa', n.trampes ? 'Arrossega-les, o clic a la paraula i clic a la capsa. Compte: n\'hi ha que no són d\'aquest tema!' : 'Arrossega-les, o clic a la paraula i clic a la capsa.');
      }
      function fitxa(p, estatica) {
        const b = el('button', 'fitxa' + (estatica ? ' estatica' : '')); b.type = 'button';
        if (estatica) b.tabIndex = -1;
        if (facil() && p.e) b.appendChild(el('span', 'em', p.e));
        b.appendChild(el('span', 'txt', format(p.p)));
        b.dataset.p = p.p; if (p.capsa !== undefined) b.dataset.capsa = p.capsa; if (p.d) b.dataset.d = p.d;
        return b;
      }
      // --- Arrossegar o clic-clic ---
      let ar = null, evitaClic = false;
      function baixa(ev) {
        const f = ev.target.closest('.safata .fitxa'); if (!f || bloquejat || fase !== 'classificar') return;
        ar = { f, x0: ev.clientX, y0: ev.clientY, mou: false };
        const mou = e2 => {
          if (!ar) return;
          if (!ar.mou) {
            if (Math.hypot(e2.clientX - ar.x0, e2.clientY - ar.y0) < 8) return;
            ar.mou = true; const r = ar.f.getBoundingClientRect(); ar.dx = e2.clientX - r.left; ar.dy = e2.clientY - r.top;
            ar.g = ar.f.cloneNode(true); ar.g.classList.add('fantasma'); ar.g.classList.remove('triada');
            ar.g.style.width = r.width + 'px'; ar.g.style.fontSize = getComputedStyle(ar.f).fontSize;
            document.body.appendChild(ar.g); ar.f.classList.add('arrossegant');
          }
          ar.g.style.left = (e2.clientX - ar.dx) + 'px'; ar.g.style.top = (e2.clientY - ar.dy) + 'px';
          document.querySelectorAll('.capsa.sobre').forEach(c => c.classList.remove('sobre'));
          const c = capsaSota(e2); if (c) c.classList.add('sobre');
        };
        const puja = e2 => {
          removeEventListener('pointermove', mou); removeEventListener('pointerup', puja); removeEventListener('pointercancel', puja);
          const a = ar; ar = null;
          document.querySelectorAll('.capsa.sobre').forEach(c => c.classList.remove('sobre'));
          if (!a || !a.mou) return;
          a.g.remove(); a.f.classList.remove('arrossegant');
          evitaClic = true; setTimeout(() => { evitaClic = false; }, 0);
          const c = capsaSota(e2); if (c) deixar(a.f, c);
        };
        addEventListener('pointermove', mou); addEventListener('pointerup', puja); addEventListener('pointercancel', puja);
      }
      function capsaSota(e) { const x = document.elementFromPoint(e.clientX, e.clientY); return x && x.closest('.capsa'); }
      function clic(ev) {
        if (evitaClic || bloquejat || fase !== 'classificar') return;
        const f = ev.target.closest('.safata .fitxa');
        if (f) { seleccionar(triada === f ? null : f); return; }
        const c = ev.target.closest('.capsa');
        if (c && triada) deixar(triada, c);
      }
      function seleccionar(f) { document.querySelectorAll('.fitxa.triada').forEach(x => x.classList.remove('triada')); triada = f; if (f) f.classList.add('triada'); }
      function indicar(i) {
        document.querySelectorAll('.capsa.pista').forEach(c => c.classList.remove('pista'));
        const c = $('capses').querySelector(`.capsa[data-capsa="${i}"]`); if (c) c.classList.add('pista');
      }
      function deixar(f, c) {
        if (bloquejat) return;
        const bona = Number(f.dataset.capsa), aqui = Number(c.dataset.capsa);
        seleccionar(null);
        if (bona === aqui) return colocar(f, false);
        errors++;
        const k = f.dataset.p; const e = (errP.get(k) || 0) + 1; errP.set(k, e);
        f.classList.add('mal'); sacsejar(f); setTimeout(() => f.classList.remove('mal'), 700);
        if (config.temps && e >= 2 || e >= 3) { dites++; return colocar(f, true); }
        if (e === 2) { ambAjuda = true; indicar(bona); mostrar(`${cometes(k)} no va a «${format(totes[aqui].nom)}»`, 'Pista: mira la capsa que s\'il·lumina.', 'pista'); }
        else mostrar(`${cometes(k)} no va a «${format(totes[aqui].nom)}»`, 'Torna-ho a provar.', 'error');
        pintarDades();
      }
      function colocar(f, dita) {
        const i = Number(f.dataset.capsa);
        const c = $('capses').querySelector(`.capsa[data-capsa="${i}"]`);
        document.querySelectorAll('.capsa.pista').forEach(x => x.classList.remove('pista'));
        f.disabled = true; f.classList.remove('triada'); if (dita) f.classList.add('dita');
        c.querySelector('.dins').appendChild(f);
        posades++;
        const fora = totes[i].fora;
        const txt = fora ? `${cometes(f.dataset.p)} no és ${tema.de}: és ${f.dataset.d}.` : `${cometes(f.dataset.p)} → ${format(totes[i].nom)}`;
        if (posades === fitxes.length) {
          bloquejat = true; aturar();
          return acabar(dites ? 'malament' : errors === 0 && !ambAjuda ? 'be' : 'ajuda',
            dites ? 'Tauler acabat' : Preferencies.felicitacio('✓ Molt bé!'), `Has classificat totes les paraules ${tema.de}.`);
        }
        mostrar(dita ? `Va aquí: ${txt}` : `✓ ${txt}`, dita ? 'Continua amb les altres.' : '', dita ? 'pista' : 'guanyat');
      }
      pr.temps0 = () => {
        if (bloquejat) return;
        bloquejat = true; aturar();
        if (fase !== 'classificar') return acabar('malament', "S'ha acabat el temps ⏱", `Eren paraules ${tema.de}.`);
        [...$('safata').querySelectorAll('.fitxa')].forEach(f => {
          f.disabled = true; f.classList.remove('triada'); f.classList.add('dita');
          $('capses').querySelector(`.capsa[data-capsa="${f.dataset.capsa}"] .dins`).appendChild(f);
        });
        acabar('malament', "S'ha acabat el temps ⏱", 'Mira on anava cada paraula.');
      };
      return pr;
    }

    // ================= MODE FAMÍLIES =================
    function families() {
      const n = NIVELL[config.nivell];
      let fs = D.families.filter(f => !(facil() && f.canvia) && !familiesUsades.has(f.arrel));
      if (!fs.length) { familiesUsades.clear(); fs = D.families.filter(f => !(facil() && f.canvia)); }
      const fam = triar(fs); familiesUsades.add(fam.arrel);
      const base = fam.paraules[0];
      const bones = barrejar(fam.paraules.slice(1)).slice(0, n.familia);
      const arrel = net(fam.arrel).slice(0, 3);
      // Intruses: al Fàcil, de famílies que comencen ben diferent; al Mitjà, n'hi pot haver una de trampa; al Difícil, les trampes
      let trampes = [];
      if (config.nivell === 'dificil') trampes = barrejar(fam.trampes).slice(0, 3);
      else if (config.nivell === 'mitja') trampes = barrejar(fam.trampes).slice(0, 1);
      const resta = n.nuvol - bones.length - trampes.length;
      const altres = barrejar(D.families.filter(f => f !== fam).flatMap(f => f.paraules.slice(1).map(p => ({ p, f }))))
        .filter(x => net(x.p).slice(0, 2) !== arrel.slice(0, 2) && !fam.paraules.includes(x.p));
      const intruses = [];
      for (const x of altres) { if (intruses.length >= resta) break; if (intruses.some(y => y.f === x.f)) continue; intruses.push(x); }
      const paraules = barrejar([
        ...bones.map(p => ({ p, bona: true })),
        ...trampes.map(t => ({ p: t.p, per: t.per })),
        ...intruses.map(x => ({ p: x.p, de: x.f.paraules[0] })),
      ]);
      let botons = [];
      const pr = {
        iniciar() {
          const en = $('enunciat'); en.innerHTML = '';
          en.append(el('span', '', 'Família de'), el('span', 'retol', format(base)));
          const z = el('div', 'contingut'); $('zona').appendChild(z);
          const nv = el('div', 'nuvol');
          botons = paraules.map(w => {
            const b = el('button', 'fitxa'); b.type = 'button'; b.appendChild(el('span', 'txt', format(w.p)));
            b.addEventListener('click', () => { if (bloquejat || b.disabled) return; b.classList.toggle('triada'); });
            nv.appendChild(b); return b;
          });
          z.appendChild(nv);
          $('btn-comprova').hidden = false;
          mostrar(`Troba les ${bones.length} paraules de la família de ${cometes(base)}`, 'Clica-les i prem «Comprova».');
        },
        pista(manual) {
          const i = paraules.findIndex((w, j) => w.bona && !botons[j].classList.contains('triada') && !botons[j].classList.contains('be'));
          if (i >= 0) botons[i].classList.add('indicada');
          mostrar('💡 Pista', `Busca paraules que tinguin a veure amb ${cometes(base)}. La de la vora groga n'és una.`, 'pista');
          if (manual) $('btn-pista').disabled = true;
        },
        comprova() {
          const triades = botons.map((b, i) => b.classList.contains('triada') ? i : -1).filter(i => i >= 0);
          if (!triades.length) { mostrar('Encara no has triat cap paraula', 'Clica les de la família.', 'error'); return; }
          const mal = triades.filter(i => !paraules[i].bona);
          triades.filter(i => paraules[i].bona).forEach(i => { botons[i].classList.remove('triada', 'indicada'); botons[i].classList.add('be'); botons[i].disabled = true; });
          const falten = paraules.filter((w, i) => w.bona && !botons[i].classList.contains('be')).length;
          if (!mal.length && !falten) {
            bloquejat = true; aturar();
            botons.forEach((b, i) => { if (!paraules[i].bona) b.classList.add('apagada'); b.disabled = true; });
            return acabar(errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio('✓ Molt bé!'), `Totes vénen de ${cometes(base)}: ${paraules.filter(w => w.bona).map(w => format(w.p)).join(', ')}.`);
          }
          if (!mal.length) { mostrar(`✓ Totes les que has triat són bones`, `Te'n ${falten === 1 ? 'falta 1' : `falten ${falten}`}.`, 'guanyat'); return; }
          errors++;
          mal.forEach(i => { botons[i].classList.remove('triada'); botons[i].classList.add('mal'); sacsejar(botons[i]); });
          setTimeout(() => mal.forEach(i => botons[i].classList.remove('mal')), 900);
          const w = paraules[mal[0]];
          const per = w.per ? `${cometes(w.p)} comença com ${cometes(base)}, però ${w.per}: no és de la família.` : `${cometes(w.p)} no és de la família de ${cometes(base)}.`;
          if (config.temps || errors >= 3) return mostrarResp(per);
          if (errors === 2) { ambAjuda = true; pr.pista(false); mostrar(per, `Pista: la de la vora groga sí que és de la família. Te'n falten ${falten}.`, 'pista'); }
          else mostrar(per, falten ? `Te'n ${falten === 1 ? 'falta 1' : `falten ${falten}`}.` : '', 'error');
          pintarDades();
        },
      };
      function mostrarResp(per) {
        bloquejat = true; aturar();
        botons.forEach((b, i) => { b.disabled = true; b.classList.remove('triada', 'indicada'); if (paraules[i].bona && !b.classList.contains('be')) b.classList.add('dita'); else if (!paraules[i].bona) b.classList.add('apagada'); });
        acabar('malament', per || "S'ha acabat el temps ⏱", `Les de la família eren: ${paraules.filter(w => w.bona).map(w => format(w.p)).join(', ')}.`);
      }
      pr.temps0 = () => { if (!bloquejat) mostrarResp(null); };
      return pr;
    }

    // Títols de les capses: cap paraula partida; si no hi cap, la lletra es fa més petita
    function ajustarTitols() {
      document.querySelectorAll('.capsa h3').forEach(h => {
        h.style.fontSize = '';
        let mida = parseFloat(getComputedStyle(h).fontSize);
        const ample = h.clientWidth;
        h.style.overflowWrap = '';
        while (h.scrollWidth > ample + 1 && mida > 8) { mida -= .5; h.style.fontSize = mida + 'px'; }
        if (h.scrollWidth > ample + 1) h.style.overflowWrap = 'anywhere';   // últim recurs en pantalles molt estretes
      });
    }
    let esperaAjust;
    addEventListener('resize', () => { clearTimeout(esperaAjust); esperaAjust = setTimeout(ajustarTitols, 80); });

    // ---------------- Comú ----------------
    function acabar(r, titol, extra) {
      resultats.push(r);
      $('btn-pista').hidden = true; $('btn-comprova').hidden = true;
      mostrar(titol, extra, r === 'malament' ? 'pista' : 'guanyat');
      if (r !== 'malament') Celebracio.petita($('missatge'));
      pintarDades();
      const s = $('btn-seguent'); s.hidden = false; s.textContent = idx + 1 >= TAULERS ? 'Acaba 🏁' : 'Següent ▶';
      setTimeout(() => { if (!s.hidden) s.focus({ preventScroll: true }); }, 50);
    }

    function iniciarTemps() {
      aturar();
      if (!config.temps) return;
      const totalMs = config.temps * 1000;
      limit = performance.now() + totalMs;
      const barra = $('temps-barra');
      const pas = () => {
        const queda = limit - performance.now();
        barra.style.transform = `scaleX(${Math.max(0, queda / totalMs)})`;
        $('temps').classList.toggle('poc', queda <= 10000);
        if (queda <= 0) { if (P && P.temps0) P.temps0(); return; }
        animacio = requestAnimationFrame(pas);
      };
      pas();
    }
    function aturar() { cancelAnimationFrame(animacio); animacio = null; }

    function final() {
      aturar(); P = null;
      const nets = resultats.filter(r => r === 'be').length;
      const mal = resultats.filter(r => r === 'malament').length;
      const comptar = Preferencies.errors();
      let titol = nets === TAULERS ? 'Tot a la primera!' : 'Partida acabada!';
      let subtitol = `${nets} de ${TAULERS} taulers a la primera`;
      const estrelles = nets === TAULERS ? 3 : mal <= 1 ? 2 : 1;
      if (comptar) {
        const clau = `appjocs.families.record.${config.mode}.${config.nivell}.${config.temps}`;
        let record = null; try { const v = localStorage.getItem(clau); record = v === null ? null : Number(v); } catch {}
        const nou = record === null || nets > record;
        if (nou) { try { localStorage.setItem(clau, String(nets)); } catch {} }
        subtitol += nou ? (record !== null ? ' · 🏅 Nou rècord!' : '') : ` · Rècord: ${record}`;
      } else { titol = 'Partida acabada!'; subtitol = `Has fet ${TAULERS} taulers.`; }
      mostrar('🎉 ' + titol, subtitol, 'guanyat');
      Celebracio.gran({ titol, subtitol, emoji: nets === TAULERS ? '🏆' : '🗂️', estrelles });
    }

    function pintarDades() {
      const comptar = Preferencies.errors();
      const punts = Array.from({ length: TAULERS }, (_, i) =>
        `<i class="${i < resultats.length ? (comptar ? resultats[i] : 'fet') : i === resultats.length ? 'ara' : ''}"></i>`).join('');
      let html = `<span class="dada">Tauler <b>${Math.min(idx + 1, TAULERS)}</b>/${TAULERS} <span class="progres">${punts}</span></span>`;
      if (comptar) html += `<span class="dada">A la primera: <b>${resultats.filter(r => r === 'be').length}</b></span>`;
      $('dades').innerHTML = html;
    }
    function sacsejar(x) { x.classList.remove('sacseig'); void x.offsetWidth; x.classList.add('sacseig'); }
    function mostrar(t, extra = '', estat = '') {
      const m = $('missatge');
      $('msg-text').textContent = t; $('msg-extra').textContent = extra;
      m.classList.remove('es-pista', 'es-error', 'es-guanyat');
      if (estat) m.classList.add('es-' + estat);
    }

    Pantalla.avisOrientacio('families', { dins: document.getElementById('pantalla-inici') });
  </script>
</body>
</html>
