<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Paraules compostes · Juguem?</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Colors per rol (css/styles.css): verd = encert · rosa = error · groc = pista / temps que s'acaba ·
       blau = triat / per omplir · préssec = acció. */
    .joc { width: 100%; max-width: 1000px; margin: 0 auto; }
    [hidden] { display: none !important; }
    h2.titol { font-size: 1.15rem; margin: 16px 0 8px; }

    /* ---------- Inici ---------- */
    .inici { max-width: 860px; margin: 0 auto; }
    .opcions { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .opcions button {
      font: inherit; cursor: pointer; color: var(--text); touch-action: manipulation;
      background: var(--superficie); border: 2px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra);
      min-height: 56px; padding: 8px; font-weight: 700; font-size: 1.05rem;
    }
    .opcions button small { display: block; font-weight: 500; font-size: .82rem; color: var(--text-suau); margin-top: 2px; }
    .opcions button[aria-pressed="true"] { background: var(--c-info); border-color: var(--c-info-vora); }
    .opcions button[aria-pressed="true"] small { color: var(--text); }
    .opcions button:disabled { opacity: .45; cursor: default; }
    @media (hover: hover) { .opcions button:not(:disabled):hover { border-color: var(--c-info-vora); } }
    .comencar { text-align: center; margin: 20px 0 8px; }
    .comencar .btn { font-size: 1.3rem; padding: 14px 40px; }

    /* ---------- Joc ---------- */
    .cap-joc { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
    .dades { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dada { background: var(--superficie); border: 1px solid var(--vora); border-radius: 999px; padding: 4px 12px; font-size: .95rem; }
    .dada b { font-variant-numeric: tabular-nums; }
    .progres { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
    .progres i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--vora); background: var(--superficie); }
    .progres i.be { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .progres i.ajuda { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .progres i.malament { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .progres i.fet { background: var(--vora); }
    .progres i.ara { background: var(--c-info); border-color: var(--c-info-vora); }

    .tauler { background: var(--superficie); border: 2px solid var(--vora); border-radius: var(--radi); padding: 20px 24px;
      display: flex; flex-direction: column; gap: 14px; --pz: clamp(1.1rem, 2.4vw, 1.55rem); }
    .enunciat { text-align: center; font-size: clamp(1.05rem, 2.2vw, 1.3rem); font-weight: 700; margin: 0; }
    .definicio { text-align: center; margin: 0; font-size: clamp(1.05rem, 2.3vw, 1.35rem); font-weight: 600; font-style: italic; }
    .definicio::before { content: '💬 '; font-style: normal; }
    .temps { height: 12px; border-radius: 999px; background: var(--fons); border: 1px solid var(--vora); overflow: hidden; }
    .temps i { display: block; height: 100%; width: 100%; background: color-mix(in srgb, var(--text-suau) 45%, white); border-radius: 999px; transform-origin: left; }
    .temps.poc i { background: var(--c-pista-vora); }

    /* Files de paraules: dos forats que fan una paraula */
    .files { display: flex; flex-direction: column; gap: var(--gap-fila, 12px); align-items: center; }
    .fila { display: flex; align-items: center; gap: 6px; justify-content: center; flex-wrap: nowrap; }
    .fila .mes { font-weight: 900; color: var(--text-suau); font-size: calc(var(--pz) * .9); }
    .fila .igual { font-weight: 900; color: var(--text-suau); font-size: calc(var(--pz) * .9); }
    .fila .resultat { font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 800; font-size: var(--pz); min-width: 4em; }
    .forat { min-width: 6.2em; min-height: 2.2em; font-size: var(--pz); border: 3px dashed var(--c-info-vora); border-radius: 14px;
      background: color-mix(in srgb, var(--c-info) 22%, white); display: grid; place-items: center; padding: 3px; cursor: pointer; position: relative; }
    .forat.sobre { background: var(--c-info); }
    .forat .lletra-pista { color: var(--c-pista-vora); font-weight: 900; font-size: .9em; }
    .unida { font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 800; font-size: var(--pz); letter-spacing: .02em;
      padding: .35em 1em; border-radius: .4em; border: 3px solid var(--c-ok-vora); background: var(--c-ok); white-space: nowrap; }
    .unida.dita { border-color: var(--c-pista-vora); background: var(--c-pista); }
    @keyframes ajunta { 0% { transform: scaleX(1.25); opacity: .4; } 100% { transform: scaleX(1); opacity: 1; } }
    .unida { animation: ajunta .35s ease-out; }
    .fila.be .forat { border-style: solid; border-color: var(--c-ok-vora); background: var(--c-ok); }
    .fila.mal .forat { border-style: solid; border-color: var(--c-esborrar-vora); background: var(--c-esborrar); }
    .fila.dita .forat { border-style: solid; border-color: var(--c-pista-vora); background: var(--c-pista); }

    /* Peces de trencaclosques */
    .safata { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 18px; min-height: 2.6em; font-size: var(--pz); padding: 10px;
      border-radius: 16px; background: var(--fons); border: 2px dashed var(--vora); }
    .peca {
      font: inherit; font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 800; font-size: 1em; letter-spacing: .02em;
      color: var(--text); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
      padding: .3em .85em; border-radius: .35em; background: var(--superficie); border: 3px solid color-mix(in srgb, var(--text-suau) 50%, white);
      box-shadow: 0 4px 0 rgba(59, 51, 85, .12); position: relative;
    }
    /* Pestanya i forat del trencaclosques */
    .peca::after { content: ''; position: absolute; right: -.42em; top: 50%; width: .7em; height: .7em; margin-top: -.35em; border-radius: 50%;
      background: var(--superficie); border: 3px solid color-mix(in srgb, var(--text-suau) 50%, white); border-left-color: transparent; border-bottom-color: transparent; transform: rotate(45deg); }
    .peca::before { content: ''; position: absolute; left: -.2em; top: 50%; width: .55em; height: .55em; margin-top: -.28em; border-radius: 50%;
      background: var(--fons); border: 3px solid color-mix(in srgb, var(--text-suau) 50%, white); border-left-color: transparent; border-bottom-color: transparent; transform: rotate(45deg); }
    .forat .peca::before { background: color-mix(in srgb, var(--c-info) 22%, white); }
    .fila.be .peca, .fila.be .peca::after { background: var(--superficie); }
    .peca.triada { background: var(--c-info); border-color: var(--c-info-vora); }
    .peca.triada::after { background: var(--c-info); border-color: var(--c-info-vora); border-left-color: transparent; border-bottom-color: transparent; }
    .peca.fantasma { position: fixed; z-index: 100; pointer-events: none; opacity: .9; transform: rotate(-3deg); margin: 0; }
    .peca.arrossegant { opacity: .3; }
    .peca:disabled { cursor: default; }
    @media (hover: hover) { .peca:not(:disabled):hover { border-color: var(--c-info-vora); } }

    /* Difícil: escriure la part que falta dins el forat */
    .forat input { font: inherit; font-weight: 800; width: 7em; max-width: 100%; text-align: center; border: 0; background: transparent; outline: none; color: var(--text); }
    .forat.escriu { cursor: text; border-style: solid; background: var(--superficie); }
    .forat.escriu:focus-within { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c-info) 60%, white); }
    .maj input { text-transform: uppercase; }

    /* Visual: dibuix + tres opcions */
    .vis-marc { background: #fff; border: 2px solid var(--vora); border-radius: 14px; padding: 6px; display: flex; justify-content: center; }
    /* Mai més gran que la mida original (no es pixela) */
    .vis-img { display: block; width: auto; height: auto; max-width: 100%; max-height: clamp(64px, 26vh, 240px); }
    .vis-opcions { display: flex; flex-direction: column; gap: 10px; width: min(100%, 460px); margin: 0 auto; }
    .vis-op { font: inherit; font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 800;
      font-size: var(--pz); letter-spacing: .02em; color: var(--text); cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; gap: .6em; text-align: left; padding: .4em .7em;
      background: var(--superficie); border: 3px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra); }
    .vis-op .txt { flex: 1; text-align: center; overflow-wrap: anywhere; }
    .vis-op:disabled { cursor: default; }
    .vis-op.descartada { opacity: .35; text-decoration: line-through; }
    .vis-op.be { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .vis-op.mal { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .vis-op.dita { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .vis-op:focus-visible { outline: 4px solid color-mix(in srgb, var(--c-info) 70%, white); outline-offset: 2px; }
    @media (hover: hover) { .vis-op:not(:disabled):hover { border-color: var(--c-info-vora); background: color-mix(in srgb, var(--c-info) 30%, white); } }

    .peu { display: flex; flex-direction: column; gap: 12px; }
    .missatge { min-height: 3.2rem; padding: 8px 12px; border-radius: var(--radi); text-align: center; background: var(--superficie);
      border: 2px solid var(--vora); font-weight: 700; font-size: 1.1rem; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .missatge small { font-weight: 500; font-size: .95rem; }
    .missatge small:empty { display: none; }
    .missatge.es-pista { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .missatge.es-error { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); }
    .missatge.es-guanyat { background: var(--c-ok); border-color: var(--c-ok-vora); }
    .botons-peu { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn-pista { background: var(--c-pista); border-color: var(--c-pista-vora); }
    .btn-ok { background: var(--c-ok); border-color: var(--c-ok-vora); }
    @keyframes sacseig { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .sacseig { animation: sacseig .25s 2; }

    /* Mòbil apaïsat: el missatge i els botons a la dreta (a sota no hi cabrien) */
    @media (orientation: landscape) and (max-height: 500px) {
      .tauler { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 240px); column-gap: 18px; row-gap: 10px;
        grid-template-areas: "enun peu" "temps peu" "zona peu"; align-items: start; padding: 12px 20px; }
      .tauler .enunciat { grid-area: enun; }
      .tauler .temps { grid-area: temps; }
      .tauler #zona { grid-area: zona; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
      .tauler .peu { grid-area: peu; align-self: center; }
      .tauler .botons-peu { flex-direction: column; align-items: stretch; }
      .cap-joc { margin: 0 0 8px; }
      .cap-joc .btn { padding: 6px 14px; }
      .missatge { min-height: 0; padding: 6px 10px; }
      h2.titol { margin: 8px 0 6px; }
      .opcions button { min-height: 46px; padding: 6px; }
      .comencar { margin: 12px 0 4px; }
    }
    #zona { display: flex; flex-direction: column; gap: 14px; }
    #zona > .contingut { display: flex; flex-direction: column; gap: inherit; }
    @media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 500px) {
      .barra-joc { padding: 6px 0; }
      .barra-joc h1 { font-size: 1.1rem; }
      .cap-joc { margin: 0 0 6px; gap: 6px; flex-wrap: nowrap; }
      .dada { font-size: .8rem; padding: 2px 8px; }
      .progres i { width: 8px; height: 8px; }
      .cap-joc .btn { padding: 5px 10px; font-size: .85rem; white-space: nowrap; }
      .tauler { padding: 10px; gap: 8px; --pz: 1rem; }
      .enunciat { font-size: .95rem; }
      .definicio { font-size: .95rem; }
      .forat { min-width: 5.4em; border-width: 2px; }
      .peca { border-width: 2px; padding: .25em .7em; }
      .safata { gap: 8px 12px; padding: 6px; }
      .missatge { min-height: 0; padding: 5px 8px; font-size: .95rem; }
      .missatge small { font-size: .82rem; }
      .botons-peu .btn { padding: 6px 14px; font-size: .95rem; }
      .fila .resultat { display: none; }
      .fila .igual { display: none; }
    }
    @media (orientation: portrait) and (max-width: 600px) {
      .progres { display: none; }
      main.joc .inici h2.titol { font-size: .92rem; margin: 5px 0 3px; }
      main.joc .inici .grup + .grup { margin-top: 6px; }
      main.joc .inici .opcions { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      main.joc .inici .opcions button { min-height: 38px; padding: 3px; font-size: .88rem; }
      main.joc .inici .opcions button small { display: none; }
      main.joc .inici #op-nivell { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      main.joc .inici #op-nivell button { font-size: .8rem; }
      main.joc .inici .comencar { margin: 8px 0 2px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      main.joc .inici h2.titol { font-size: .88rem; margin: 2px 0 2px; }
      main.joc .inici .grup + .grup { margin-top: 4px; }
      main.joc .inici .opcions button { min-height: 38px; font-size: .92rem; }
      main.joc .inici .opcions button small { display: none; }
      main.joc .inici .comencar { margin: 6px 0 2px; }
      .tauler { padding: 6px 10px; row-gap: 4px; --pz: .92rem; }
      #zona { gap: 6px; }
      .files { --gap-fila: 5px; }
      .safata { gap: 5px 10px; padding: 4px; }
      .forat { min-height: 1.9em; }
      .vis-img { max-height: clamp(52px, 20vh, 120px); }
      .vis-opcions { gap: 5px; }
      .vis-op { padding: .25em .6em; border-width: 2px; }
    }
    /* Tauleta i portàtil (criteri comú «ple», css/styles.css): el joc omple la pantalla i tot creix amb l'espai */
    @media (min-width: 601px) and (min-height: 501px) {
      .tauler { --pz: clamp(1.2rem, min(2.8vw, 4.4vh), 2.3rem); padding: clamp(14px, 2.4vh, 24px) clamp(16px, 2vw, 28px); gap: clamp(10px, 2vh, 20px); }
      .enunciat { font-size: clamp(1.1rem, 2.8vh, 1.6rem); }
      .definicio { font-size: clamp(1.1rem, 3vh, 1.7rem); }
      #zona { flex: 1 1 auto; min-height: 0; justify-content: center; gap: clamp(12px, 3vh, 30px); }
      .files { --gap-fila: clamp(10px, 2.2vh, 22px); }
      .vis-img { max-height: clamp(80px, 34vh, 320px); }
      .vis-opcions { width: min(100%, 680px); gap: clamp(10px, 1.8vh, 18px); }
    }
    /* Portàtil i tauleta en horitzontal: les tres opcions en una fila sota el dibuix */
    @media (orientation: landscape) and (min-width: 601px) and (min-height: 501px) {
      .vis-opcions { flex-direction: row; width: min(100%, 1150px); }
      .vis-op { flex: 1 1 0; justify-content: center; min-height: clamp(56px, 11vh, 110px); }
      /* Mitjà amb 3 o 4 paraules: les files en dues columnes, perquè hi càpiguen sense lliscar */
      .files:has(.fila:nth-child(3)) { display: grid; grid-template-columns: repeat(2, auto); justify-content: center; column-gap: clamp(24px, 4vw, 60px); }
    }
    /* Tauleta en vertical: la lletra i les peces es calculen també per l'alçada (n'hi ha molta) */
    @media (orientation: portrait) and (min-width: 601px) and (min-height: 501px) {
      .tauler { --pz: clamp(1.2rem, min(4.4vw, 3.3vh), 2.3rem); }
    }
    /* Mòbil vertical (criteri «ple»): la zona de joc omple l'alçada i les peces creixen amb la pantalla */
    @media (orientation: portrait) and (max-width: 600px) {
      .tauler { --pz: clamp(.95rem, min(5.2vw, 2.8vh), 1.5rem); }
      #zona { flex: 1 1 auto; min-height: 0; justify-content: center; gap: clamp(10px, 2.6vh, 26px); }
      .vis-img { max-height: clamp(70px, 24vh, 220px); }
      .vis-op { min-height: clamp(44px, 7vh, 70px); }
    }
  </style>
</head>
<body>
  <nav class="barra-joc">
    <a href="../../">← Inici</a>
    <h1>🧩 Paraules compostes</h1>
  </nav>

  <main class="joc ple">
    <!-- ================= INICI ================= -->
    <section class="inici" id="pantalla-inici">
      <div class="grup">
        <h2 class="titol">1. Dificultat</h2>
        <div class="opcions" id="op-nivell">
          <button type="button" data-v="facil" aria-pressed="true">🌱 Fàcil<small>uneix dues peces</small></button>
          <button type="button" data-v="mitja" aria-pressed="false">Mitjà<small>forma diverses paraules</small></button>
          <button type="button" data-v="dificil" aria-pressed="false">Difícil<small>escriu la part que falta</small></button>
          <button type="button" data-v="visual" aria-pressed="false">🖼️ Visual<small>mira el dibuix i tria</small></button>
        </div>
      </div>
      <div class="grup" id="grup-quantes">
        <h2 class="titol">2. Quantes paraules alhora? (Mitjà)</h2>
        <div class="opcions" id="op-quantes">
          <button type="button" data-v="2" aria-pressed="true">2 paraules</button>
          <button type="button" data-v="3" aria-pressed="false">3 paraules</button>
          <button type="button" data-v="4" aria-pressed="false">4 paraules</button>
        </div>
      </div>
      <div class="grup" id="grup-temps">
        <h2 class="titol">3. Temps</h2>
        <div class="opcions" id="op-temps">
          <button type="button" data-v="0" aria-pressed="true">Sense temps</button>
          <button type="button" data-v="1" aria-pressed="false">Normal<small id="temps-normal"></small></button>
          <button type="button" data-v="2" aria-pressed="false">Ràpid<small id="temps-rapid"></small></button>
        </div>
      </div>
      <div class="grup">
        <h2 class="titol">4. Quina lletra?</h2>
        <div class="opcions" id="op-lletra">
          <button type="button" data-v="maj" aria-pressed="true">MAJÚSCULA</button>
          <button type="button" data-v="min" aria-pressed="false">minúscula</button>
        </div>
      </div>
      <div class="comencar"><button class="btn" id="btn-comencar" type="button">Comença! 🧩</button></div>
    </section>

    <!-- ================= JOC ================= -->
    <section id="pantalla-joc" hidden>
      <div class="cap-joc">
        <div class="dades" id="dades"></div>
        <button class="btn" id="btn-nova" type="button">Nova partida</button>
      </div>
      <div class="tauler" id="tauler">
        <p class="enunciat" id="enunciat"></p>
        <div class="temps" id="temps" aria-hidden="true" hidden><i id="temps-barra"></i></div>
        <div id="zona"></div>
        <div class="peu franja">
          <div class="missatge" id="missatge" aria-live="polite"><span id="msg-text"></span><small id="msg-extra"></small></div>
          <div class="botons-peu"><button class="btn btn-pista" id="btn-pista" type="button">💡 <span class="txt-llarg">Vull una pista</span><span class="txt-curt">Pista</span></button></div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/pantalla.js"></script>
  <script src="../../js/preferencies.js"></script>
  <script src="../../js/celebracio.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const config = { nivell: 'facil', quantes: 2, temps: 0, lletra: 'maj' };
    const RONDES = { facil: 10, mitja: 5, dificil: 10, visual: 10 };
    const TEMPS = { facil: [0, 20, 12], mitja: [0, 30, 20], dificil: [0, 30, 20], visual: [0, 15, 8] };   // Mitjà: segons per paraula del tauler
    let DADES = null, VALIDES = new Set(), VISUAL = [];
    let total, idx, resultats, P, errors, ambAjuda, bloquejat, seguentT, animacio, limit, usades;

    const barrejar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const triar = a => a[Math.floor(Math.random() * a.length)];
    const format = t => config.lletra === 'maj' ? t.toLocaleUpperCase('ca') : t;
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    const enganxa = (a, b) => a + b;   // en comprovar es compara amb les parts, no amb la paraula (paraigua perd una a)

    // ---------------- Inici ----------------
    function grupOpcions(id, clau, num) {
      $(id).addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b || b.disabled) return;
        $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
        config[clau] = num ? Number(b.dataset.v) : b.dataset.v;
        if (clau === 'nivell') { textosTemps(); $('op-quantes').querySelectorAll('button').forEach(x => x.disabled = config.nivell !== 'mitja'); }
      });
    }
    grupOpcions('op-nivell', 'nivell'); grupOpcions('op-quantes', 'quantes', true); grupOpcions('op-temps', 'temps', true); grupOpcions('op-lletra', 'lletra');
    $('op-quantes').querySelectorAll('button').forEach(x => x.disabled = true);
    function textosTemps() {
      const t = TEMPS[config.nivell], que = config.nivell === 'mitja' ? 'per paraula' : 'per paraula';
      $('temps-normal').textContent = `${t[1]} s ${que}`; $('temps-rapid').textContent = `${t[2]} s ${que}`;
    }
    textosTemps();
    if (!Preferencies.temps()) { $('grup-temps').hidden = true; config.temps = 0; }

    $('btn-comencar').addEventListener('click', comencar);
    $('btn-nova').addEventListener('click', () => { aturar(); clearTimeout(seguentT); Celebracio.tancar(); $('pantalla-joc').hidden = true; $('pantalla-inici').hidden = false; });
    $('btn-pista').addEventListener('click', () => { if (!bloquejat && P) { ambAjuda = true; P.pista(true); pintarDades(); } });

    async function comencar() {
      try {
        if (!DADES) {
          const r = await fetch('paraules.json'); DADES = await r.json();
          DADES.paraules.forEach(p => VALIDES.add(p.parts.join('|')));
          // Combinacions que també són paraules (no s'han de poder formar sense voler)
          DADES.evitar.forEach(w => VALIDES.add('evitar:' + w));
          // Mode visual: cada dibuix amb les dades de la seva paraula
          VISUAL = (DADES.visual || []).map(v => ({ ...DADES.paraules.find(p => p.paraula === v.paraula), imatge: v.imatge })).filter(v => v.parts);
        }
      } catch { alert("No s'han pogut carregar les paraules. Torna-ho a provar."); return; }
      if (!Preferencies.temps()) config.temps = 0;
      total = RONDES[config.nivell]; idx = -1; resultats = []; usades = new Set();
      $('temps').hidden = !config.temps;
      $('tauler').classList.toggle('maj', config.lletra === 'maj');
      $('pantalla-inici').hidden = true; $('pantalla-joc').hidden = false;
      window.scrollTo({ top: 0 });
      seguent();
    }

    // Una combinació de dues peces és una paraula de veritat? (de la llista o de les que cal evitar)
    const esParaula = (a, b) => VALIDES.has(a + '|' + b) || DADES.evitar.some(w => w.replace(/-/g, '') === a + b);
    // Tria paraules que no comparteixin peces ni formin paraules entre elles sense voler
    function agafar(n, ambTrampa) {
      for (let t = 0; t < 300; t++) {
        let llista = barrejar(DADES.paraules.filter(p => !usades.has(p.paraula)));
        if (llista.length < n + 2) { usades.clear(); llista = barrejar(DADES.paraules); }
        const tria = [];
        for (const p of llista) {
          if (tria.length >= n) break;
          const peces = tria.flatMap(x => x.parts);
          if (p.parts.some(x => peces.includes(x))) continue;
          tria.push(p);
        }
        if (tria.length < n) continue;
        let peces = tria.flatMap(x => x.parts);
        let trampa = null;
        if (ambTrampa) {
          const cand = barrejar(DADES.paraules.filter(p => !tria.includes(p)).flatMap(p => p.parts)).filter(x => !peces.includes(x));
          trampa = cand.find(x => peces.every(y => !esParaula(x, y) && !esParaula(y, x)));
          if (!trampa) continue;
          peces = [...peces, trampa];
        }
        // Cap combinació no buscada pot ser una paraula
        const bones = new Set(tria.map(x => x.parts.join('|')));
        let ok = true;
        for (const a of peces) for (const b of peces) if (a !== b && esParaula(a, b) && !bones.has(a + '|' + b)) ok = false;
        if (!ok) continue;
        tria.forEach(x => usades.add(x.paraula));
        return { tria, peces, trampa };
      }
      return null;
    }

    function seguent() {
      clearTimeout(seguentT);
      idx++;
      if (idx >= total) return final();
      errors = 0; ambAjuda = false; bloquejat = false;
      $('zona').innerHTML = '';
      $('btn-pista').disabled = false;
      P = config.nivell === 'visual' ? visual() : config.nivell === 'dificil' ? escriure() : puzzle(config.nivell === 'facil' ? 1 : config.quantes);
      P.iniciar();
      pintarDades();
      iniciarTemps();
    }

    // ---------------- Fàcil i Mitjà: peces de trencaclosques ----------------
    function puzzle(n) {
      const facil = n === 1 && config.nivell === 'facil';
      const t = agafar(n, facil);
      const paraules = t.tria;
      const files = paraules.map(() => ({ peces: [null, null], estat: '' }));   // les files no tenen paraula fixa
      const resoltes = new Set();
      let triada = null;
      const pr = {
        paraules,
        iniciar() {
          $('enunciat').textContent = facil ? 'Arrossega les dues peces que fan una paraula:' : `Forma les ${n} paraules amb les peces:`;
          // Contenidor propi d'aquest tauler (els detectors de clic no s'acumulen d'un tauler a l'altre)
          const z = el('div', 'contingut'); $('zona').appendChild(z);
          if (facil) z.appendChild(el('p', 'definicio', paraules[0].definicio));
          const fs = el('div', 'files'); fs.id = 'files';
          files.forEach((f, i) => {
            const fila = el('div', 'fila'); fila.dataset.f = i;
            for (let k = 0; k < 2; k++) {
              if (k) fila.appendChild(el('span', 'mes', '+'));
              const fo = el('div', 'forat'); fo.dataset.f = i; fo.dataset.k = k; fo.tabIndex = 0;
              fo.setAttribute('role', 'button'); fo.setAttribute('aria-label', `forat ${k + 1} de la paraula ${i + 1}`);
              fila.appendChild(fo);
            }
            fs.appendChild(fila);
          });
          z.appendChild(fs);
          const s = el('div', 'safata'); s.id = 'safata';
          barrejar(t.peces).forEach(p => s.appendChild(peca(p)));
          z.appendChild(s);
          z.addEventListener('pointerdown', baixa);
          z.addEventListener('click', clic);
          z.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList.contains('forat')) { ev.preventDefault(); clicForat(ev.target); } });
          mostrar(facil ? 'Hi ha una peça que sobra' : 'Totes les peces es fan servir', "Arrossega-les als forats, o fes clic a la peça i després al forat.");
        },
        pista(manual) {
          const pend = paraules.filter(p => !resoltes.has(p.paraula));
          if (!pend.length) return;
          const p = triar(pend);
          if (facil) {
            // Primera lletra de cada peça als forats buits
            const fila = $('files').querySelector('.fila');
            fila.querySelectorAll('.forat').forEach((fo, k) => { if (!fo.querySelector('.peca')) { fo.innerHTML = ''; fo.appendChild(el('span', 'lletra-pista', format(p.parts[k][0]) + '…')); } });
            mostrar(manual ? '💡 Pista' : 'Pista', `Comença per «${format(p.parts[0][0])}» i la segona peça per «${format(p.parts[1][0])}».`, 'pista');
          } else mostrar(manual ? '💡 Pista' : 'Pista', `Una de les paraules: ${p.definicio}`, 'pista');
          if (manual) $('btn-pista').disabled = true;
        },
      };
      function peca(text) { const b = el('button', 'peca', format(text)); b.type = 'button'; b.dataset.t = text; return b; }

      // --- Arrossegar (ratolí o dit) o clic-clic ---
      let ar = null, evitaClic = false;
      function baixa(ev) {
        const pe = ev.target.closest('.peca'); if (!pe || pe.disabled || bloquejat) return;
        ar = { pe, x0: ev.clientX, y0: ev.clientY, mou: false, fantasma: null };
        const mou = e2 => {
          if (!ar) return;
          if (!ar.mou) {
            if (Math.hypot(e2.clientX - ar.x0, e2.clientY - ar.y0) < 8) return;
            ar.mou = true;
            const r = ar.pe.getBoundingClientRect();
            ar.dx = e2.clientX - r.left; ar.dy = e2.clientY - r.top;
            ar.fantasma = ar.pe.cloneNode(true); ar.fantasma.classList.add('fantasma'); ar.fantasma.classList.remove('triada');
            ar.fantasma.style.width = r.width + 'px'; ar.fantasma.style.fontSize = getComputedStyle(ar.pe).fontSize;
            document.body.appendChild(ar.fantasma); ar.pe.classList.add('arrossegant');
          }
          ar.fantasma.style.left = (e2.clientX - ar.dx) + 'px'; ar.fantasma.style.top = (e2.clientY - ar.dy) + 'px';
          document.querySelectorAll('.forat.sobre').forEach(f => f.classList.remove('sobre'));
          const f = foratSota(e2); if (f) f.classList.add('sobre');
        };
        const puja = e2 => {
          removeEventListener('pointermove', mou); removeEventListener('pointerup', puja); removeEventListener('pointercancel', puja);
          const a = ar; ar = null;
          document.querySelectorAll('.forat.sobre').forEach(f => f.classList.remove('sobre'));
          if (!a || !a.mou) return;
          a.fantasma.remove(); a.pe.classList.remove('arrossegant');
          evitaClic = true; setTimeout(() => { evitaClic = false; }, 0);
          const f = foratSota(e2);
          if (f) posar(a.pe, f);
          else if (a.pe.closest('.forat')) tornar(a.pe);   // treta d'un forat i deixada fora: torna a la safata
        };
        addEventListener('pointermove', mou); addEventListener('pointerup', puja); addEventListener('pointercancel', puja);
      }
      function foratSota(e) {
        const x = document.elementFromPoint(e.clientX, e.clientY);
        const f = x && x.closest('.forat');
        return f && !f.closest('.fila.be, .fila.dita') ? f : null;
      }
      function clic(ev) {
        if (evitaClic || bloquejat) return;
        const pe = ev.target.closest('.peca');
        if (pe && !pe.disabled) {
          if (pe.closest('.forat')) { tornar(pe); seleccionar(null); return; }   // clic a una peça posada: torna
          seleccionar(triada === pe ? null : pe); return;
        }
        const f = ev.target.closest('.forat');
        if (f) clicForat(f);
      }
      function clicForat(f) {
        if (bloquejat || f.closest('.fila.be, .fila.dita')) return;
        if (triada) { posar(triada, f); seleccionar(null); }
      }
      function seleccionar(pe) {
        document.querySelectorAll('.peca.triada').forEach(x => x.classList.remove('triada'));
        triada = pe; if (pe) pe.classList.add('triada');
      }
      function tornar(pe) {
        const f = pe.closest('.forat');
        if (f) { files[f.dataset.f].peces[f.dataset.k] = null; }
        pe.classList.remove('triada');
        $('safata').appendChild(pe);
      }
      // Posa una peça en un forat. Si el forat ja en tenia una: s'intercanvien (o la vella torna a la safata)
      function posar(pe, f) {
        const i = Number(f.dataset.f), k = Number(f.dataset.k);
        const vella = f.querySelector('.peca');
        if (vella === pe) return;
        const origen = pe.closest('.forat');
        if (origen) files[origen.dataset.f].peces[origen.dataset.k] = null;
        if (vella) {
          if (origen) { origen.appendChild(vella); files[origen.dataset.f].peces[origen.dataset.k] = vella.dataset.t; }
          else tornar(vella);
        }
        f.querySelectorAll('.lletra-pista').forEach(x => x.remove());
        f.appendChild(pe);
        files[i].peces[k] = pe.dataset.t;
        comprovarFila(i);
        if (origen && vella && origen.dataset.f !== f.dataset.f) comprovarFila(Number(origen.dataset.f));
      }
      function filaEl(i) { return $('files').querySelector(`.fila[data-f="${i}"]`); }
      function comprovarFila(i) {
        const f = files[i];
        if (f.peces.some(x => !x) || f.estat) return;
        const p = paraules.find(x => !resoltes.has(x.paraula) && x.parts[0] === f.peces[0] && x.parts[1] === f.peces[1]);
        const fe = filaEl(i);
        if (p) {
          f.estat = 'be'; resoltes.add(p.paraula);
          fe.classList.add('be'); ajuntar(fe, p.paraula, '');
          if (resoltes.size === paraules.length) {
            bloquejat = true; aturar();
            if (facil) $('safata').querySelectorAll('.peca').forEach(x => x.disabled = true);
            const mostrades = files.some(x => x.estat === 'dita');
            return acabar(mostrades ? 'malament' : errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio(`✓ Molt bé! ${format(p.paraula)}`), p.nota || p.definicio, fe);
          }
          mostrar(`✓ ${format(p.paraula)}`, p.nota || p.definicio, 'guanyat');
          return;
        }
        // Malament: rosa i les peces tornen a la safata
        errors++;
        fe.classList.add('mal'); sacsejar(fe);
        const quina = `${format(f.peces[0])} + ${format(f.peces[1])}`;
        setTimeout(() => { fe.classList.remove('mal'); fe.querySelectorAll('.peca').forEach(x => tornar(x)); }, 800);
        if (config.temps) { mostrar(`${quina} no és una paraula`, 'Torna-ho a provar.', 'error'); return pintarDades(); }
        if (errors === 1) mostrar(`${quina} no és una paraula`, 'Torna-ho a provar.', 'error');
        else if (errors === 2) { ambAjuda = true; setTimeout(() => pr.pista(false), 820); mostrar(`${quina} no és una paraula`, '', 'error'); }
        else setTimeout(mostrarUna, 820);
        pintarDades();
      }
      // Es mostra una paraula que falta (en groc)
      function mostrarUna() {
        const p = paraules.find(x => !resoltes.has(x.paraula)); if (!p) return;
        const i = files.findIndex(x => !x.estat);
        const fe = filaEl(i);
        // treu les peces que hi hagi i posa-hi les bones
        fe.querySelectorAll('.peca').forEach(x => tornar(x));
        p.parts.forEach((part, k) => {
          const pe = [...$('safata').querySelectorAll('.peca')].find(x => x.dataset.t === part);
          const fo = fe.querySelector(`.forat[data-k="${k}"]`); fo.innerHTML = ''; fo.appendChild(pe); pe.disabled = true;
        });
        files[i].peces = p.parts.slice(); files[i].estat = 'dita'; resoltes.add(p.paraula);
        fe.classList.add('dita'); ajuntar(fe, p.paraula, 'dita');
        if (resoltes.size === paraules.length) {
          bloquejat = true; aturar();
          $('safata').querySelectorAll('.peca').forEach(x => x.disabled = true);
          return acabar('malament', `Era ${format(p.paraula)}`, p.nota || p.definicio);
        }
        mostrar(`Mira: ${format(p.parts[0])} + ${format(p.parts[1])} = ${format(p.paraula)}`, 'Continua amb les altres.', 'pista');
      }
      pr.temps0 = () => {
        if (bloquejat) return;
        while (resoltes.size < paraules.length) { const abans = resoltes.size; mostrarUna(); if (resoltes.size === abans) break; }
      };
      return pr;
    }

    // ---------------- Difícil: escriure la part que falta ----------------
    function escriure() {
      const p = agafar(1, false).tria[0];
      const falta = Math.random() < .5 ? 0 : 1;
      let errorsP = 0;
      const net = t => t.trim().toLocaleLowerCase('ca');
      const senseAccents = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '');
      const pr = {
        p, falta,
        iniciar() {
          $('enunciat').textContent = `Escriu la ${falta === 0 ? 'primera' : 'segona'} part de la paraula:`;
          const z = $('zona');
          z.appendChild(el('p', 'definicio', p.definicio));
          const fs = el('div', 'files'); fs.id = 'files';
          const fila = el('div', 'fila'); fila.dataset.f = 0;
          const form = el('form'); form.style.display = 'contents';
          for (let k = 0; k < 2; k++) {
            if (k) fila.appendChild(el('span', 'mes', '+'));
            const fo = el('div', 'forat' + (k === falta ? ' escriu' : ''));
            if (k === falta) {
              const inp = el('input'); inp.type = 'text'; inp.id = 'resposta'; inp.autocomplete = 'off'; inp.setAttribute('autocapitalize', 'off'); inp.spellcheck = false;
              inp.setAttribute('aria-label', 'part que falta'); fo.appendChild(inp);
            } else { const pe = el('span', 'peca', format(p.parts[k])); fo.appendChild(pe); }
            fila.appendChild(fo);
          }
          fs.appendChild(fila);
          const ok = el('button', 'btn btn-ok', 'OK ✓'); ok.type = 'submit';
          const b = el('div', 'botons-peu'); b.appendChild(ok);
          form.append(fs, b);
          form.addEventListener('submit', ev => { ev.preventDefault(); const v = $('resposta').value; if (!bloquejat && v.trim()) respondre(v); });
          z.appendChild(form);
          setTimeout(() => $('resposta').focus({ preventScroll: true }), 50);
          mostrar('Escriu-la i prem OK', 'La definició t\'ajuda a saber quina paraula és.');
        },
        pista(manual) {
          const part = p.parts[falta];
          mostrar(manual ? '💡 Pista' : 'Pista', `Comença per «${format(part.slice(0, 1))}» i té ${part.length} lletres.`, 'pista');
          if (manual) $('btn-pista').disabled = true;
        },
      };
      function respondre(v) {
        const bona = p.parts[falta];
        const fila = $('files').querySelector('.fila');
        if (net(v) === bona) {
          bloquejat = true; aturar();
          $('resposta').disabled = true; fila.classList.add('be'); ajuntar(fila, p.paraula, '');
          return acabar(errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio(`✓ Molt bé! ${format(p.paraula)}`), p.nota || `${format(p.parts[0])} + ${format(p.parts[1])}`, fila);
        }
        errors++; errorsP++;
        sacsejar(fila); $('resposta').select();
        if (config.temps || errorsP >= 3) return mostrarResp();
        const quasi = senseAccents(net(v)) === senseAccents(bona);
        if (errorsP === 1) mostrar(quasi ? 'Gairebé! Revisa l\'accent' : `«${format(net(v))}» no hi va`, 'Torna-ho a provar.', 'error');
        else { ambAjuda = true; const t = `Comença per «${format(bona[0])}» i té ${bona.length} lletres.`; mostrar(quasi ? 'Gairebé! Revisa l\'accent' : `«${format(net(v))}» no hi va`, 'Pista: ' + t, 'pista'); }
        pintarDades();
      }
      function mostrarResp() {
        bloquejat = true; aturar();
        const fila = $('files').querySelector('.fila');
        $('resposta').disabled = true; fila.classList.add('dita'); ajuntar(fila, p.paraula, 'dita');
        acabar('malament', config.temps && !errorsP ? "S'ha acabat el temps ⏱" : `Era «${format(p.parts[falta])}»`, `${format(p.parts[0])} + ${format(p.parts[1])} = ${format(p.paraula)}`);
      }
      pr.temps0 = () => { if (!bloquejat) mostrarResp(); };
      return pr;
    }

    // ---------------- Visual: mira el dibuix i tria la paraula ----------------
    // Dues opcions falses: si pot ser, que comparteixin una part amb la bona (cal mirar els dos dibuixos)
    function falses(p) {
      const pool = DADES.paraules.filter(x => x.paraula !== p.paraula);
      const comparteix = barrejar(pool.filter(x => x.parts.some(y => p.parts.includes(y))));
      const resta = barrejar(pool.filter(x => !comparteix.includes(x)));
      return [...comparteix.slice(0, 2), ...resta].slice(0, 2);
    }
    function visual() {
      let pend = VISUAL.filter(v => !usades.has(v.paraula));
      if (!pend.length) { usades.clear(); pend = VISUAL; }
      const p = triar(pend); usades.add(p.paraula);
      const opcions = barrejar([p, ...falses(p)]);
      // Es pre-carrega un altre dibuix perquè el següent surti de seguida
      const altre = VISUAL.find(v => !usades.has(v.paraula)); if (altre) new Image().src = altre.imatge;
      let errorsP = 0, botons = [];
      const pr = {
        p, opcions,
        iniciar() {
          $('enunciat').textContent = 'Quina paraula diu el dibuix?';
          const z = el('div', 'contingut'); $('zona').appendChild(z);
          const marc = el('div', 'vis-marc'); marc.id = 'vis-marc';
          const img = el('img', 'vis-img'); img.src = p.imatge; img.alt = 'Dibuix: dues coses que s\'ajunten per fer una paraula';
          marc.appendChild(img); z.appendChild(marc);
          const op = el('div', 'vis-opcions');
          botons = opcions.map((o, i) => {
            const b = el('button', 'vis-op opcio-resposta'); b.type = 'button'; b.dataset.i = i;
            b.append(el('span', 'txt', format(o.paraula)));
            b.addEventListener('click', () => triarOp(i));
            op.appendChild(b); return b;
          });
          z.appendChild(op);
          mostrar('Mira els dos dibuixos del principi', 'Fes clic a la paraula bona.');
        },
        pista(manual) {
          // Treu una opció falsa (si en queden dues) i diu quina part cal mirar
          const vives = botons.filter((b, i) => !b.disabled && opcions[i] !== p);
          if (vives.length > 1) { const b = triar(vives); b.disabled = true; b.classList.add('descartada'); }
          mostrar(manual ? '💡 Pista' : 'Pista', textPista(), 'pista');
          if (manual) $('btn-pista').disabled = true;
        },
      };
      // La part de la paraula bona que no tenen les opcions falses que queden
      function textPista() {
        const queden = opcions.filter((o, i) => o !== p && !botons[i].disabled);
        const k = [0, 1].find(k => queden.every(o => o.parts[k] !== p.parts[k]));
        const kk = k === undefined ? 0 : k;
        return `El ${kk === 0 ? 'primer' : 'segon'} dibuix és «${format(p.parts[kk])}».`;
      }
      function triarOp(i) {
        if (bloquejat) return;
        const b = botons[i], o = opcions[i];
        if (b.disabled) return;
        if (o === p) {
          bloquejat = true; aturar();
          b.classList.add('be'); botons.forEach(x => x.disabled = true);
          return acabar(errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio(`✓ Molt bé! ${format(p.paraula)}`),
            `${format(p.parts[0])} + ${format(p.parts[1])}` + (p.nota ? ` · ${p.nota}` : ` · ${p.definicio}`));   // la celebració surt del missatge: el dibuix no s'amplia
        }
        errors++; errorsP++;
        b.classList.add('mal'); b.disabled = true; sacsejar(b);
        const quedenFalses = botons.some((x, j) => !x.disabled && opcions[j] !== p);
        if (config.temps || errorsP >= 2 || !quedenFalses) return mostrarResp();
        ambAjuda = true;
        mostrar(`${format(o.paraula)} no és el dibuix`, 'Pista: ' + textPista(), 'error');
        pintarDades();
      }
      function mostrarResp() {
        bloquejat = true; aturar();
        const i = opcions.indexOf(p);
        botons[i].classList.add('dita'); botons.forEach(x => x.disabled = true);
        acabar('malament', config.temps && !errorsP ? "S'ha acabat el temps ⏱" : `Era ${format(p.paraula)}`, `${format(p.parts[0])} + ${format(p.parts[1])} = ${format(p.paraula)}`);
      }
      pr.temps0 = () => { if (!bloquejat) mostrarResp(); };
      return pr;
    }

    // Quan una paraula està feta, les dues peces s'ajunten en una de sola
    function ajuntar(fila, paraula, cls) {
      fila.innerHTML = '';
      fila.appendChild(el('span', 'unida' + (cls ? ' ' + cls : ''), format(paraula)));
    }

    // ---------------- Acabar ----------------
    function acabar(r, titol, extra, origen) {
      resultats.push(r);
      $('btn-pista').disabled = true;
      mostrar(titol, extra, r === 'malament' ? 'pista' : 'guanyat');
      if (r !== 'malament') Celebracio.petita(origen || $('missatge'));
      pintarDades();
      seguentT = setTimeout(seguent, r === 'malament' ? 2800 : 1800);
    }

    // ---------------- Temps ----------------
    function iniciarTemps() {
      aturar();
      if (!config.temps) return;
      const n = config.nivell === 'mitja' ? config.quantes : 1;
      const totalMs = TEMPS[config.nivell][config.temps] * 1000 * n;
      limit = performance.now() + totalMs;
      const barra = $('temps-barra');
      const pas = () => {
        const queda = limit - performance.now();
        barra.style.transform = `scaleX(${Math.max(0, queda / totalMs)})`;
        $('temps').classList.toggle('poc', queda <= 3000);
        if (queda <= 0) { if (P) P.temps0(); return; }
        animacio = requestAnimationFrame(pas);
      };
      pas();
    }
    function aturar() { cancelAnimationFrame(animacio); animacio = null; }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || $('pantalla-joc').hidden || bloquejat || !config.temps) return;
      iniciarTemps();
    });

    // ---------------- Final ----------------
    function final() {
      aturar();
      const nets = resultats.filter(r => r === 'be').length;
      const mal = resultats.filter(r => r === 'malament').length;
      const comptar = Preferencies.errors();
      const que = config.nivell === 'mitja' ? 'taulers' : 'paraules';
      let titol = nets === total ? 'Tot a la primera!' : 'Partida acabada!';
      let subtitol = `${nets} de ${total} ${que} a la primera`;
      const estrelles = nets === total ? 3 : mal === 0 ? 2 : 1;
      if (comptar) {
        const clau = `appjocs.compostes.record.${config.nivell}.${config.nivell === 'mitja' ? config.quantes : 1}.${config.temps}`;
        let record = null; try { const v = localStorage.getItem(clau); record = v === null ? null : Number(v); } catch {}
        const nou = record === null || nets > record;
        if (nou) { try { localStorage.setItem(clau, String(nets)); } catch {} }
        subtitol += nou ? (record !== null ? ' · 🏅 Nou rècord!' : '') : ` · Rècord: ${record}`;
      } else { titol = 'Partida acabada!'; subtitol = `Has fet ${total} ${que}.`; }
      mostrar('🎉 ' + titol, subtitol, 'guanyat');
      Celebracio.gran({ titol, subtitol, emoji: nets === total ? '🏆' : '🧩', estrelles });
    }

    // ---------------- Dades i missatges ----------------
    function pintarDades() {
      const comptar = Preferencies.errors();
      const punts = Array.from({ length: total }, (_, i) =>
        `<i class="${i < resultats.length ? (comptar ? resultats[i] : 'fet') : i === resultats.length ? 'ara' : ''}"></i>`).join('');
      const nom = config.nivell === 'mitja' ? 'Tauler' : 'Paraula';
      let html = `<span class="dada">${nom} <b>${Math.min(idx + 1, total)}</b>/${total} <span class="progres">${punts}</span></span>`;
      if (comptar) html += `<span class="dada">A la primera: <b>${resultats.filter(r => r === 'be').length}</b></span>`;
      $('dades').innerHTML = html;
    }
    function sacsejar(x) { x.classList.remove('sacseig'); void x.offsetWidth; x.classList.add('sacseig'); }
    function mostrar(t, extra = '', estat = '') {
      const m = $('missatge');
      $('msg-text').textContent = t; $('msg-extra').textContent = extra;
      m.classList.remove('es-pista', 'es-error', 'es-guanyat');
      if (estat) m.classList.add('es-' + estat);
    }

    Pantalla.avisOrientacio('compostes', { dins: document.getElementById('pantalla-inici') });
  </script>
</body>
</html>
