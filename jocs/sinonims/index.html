<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Sinònims i antònims · Juguem?</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <script>try{var t=JSON.parse(localStorage.getItem("appjocs.preferencies")||"{}").aparenca;if(t==="fosc"||t==="clar")document.documentElement.dataset.tema=t}catch(e){}</script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Colors per rol (css/styles.css): verd = encert · rosa = error · groc = pista / temps que s'acaba ·
       blau = triat · préssec = acció. */
    .joc { width: 100%; max-width: 1000px; margin: 0 auto; }
    [hidden] { display: none !important; }
    h2.titol { font-size: 1.15rem; margin: 16px 0 8px; }

    /* ---------- Inici ---------- */
    .inici { max-width: 860px; margin: 0 auto; }
    .opcions { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .opcions button {
      font: inherit; cursor: pointer; color: var(--text); touch-action: manipulation;
      background: var(--superficie); border: 2px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra);
      min-height: 56px; padding: 8px; font-weight: 700; font-size: 1.05rem;
    }
    .opcions button small { display: block; font-weight: 500; font-size: .82rem; color: var(--text-suau); margin-top: 2px; }
    .opcions button[aria-pressed="true"] { background: var(--c-info); border-color: var(--c-info-vora); color: var(--tinta); }
    .opcions button[aria-pressed="true"] small { color: var(--tinta); }
    @media (hover: hover) { .opcions button:hover { border-color: var(--c-info-vora); } }
    .avis-veu { margin: 8px 0 0; padding: 8px 12px; border-radius: 12px; font-size: .92rem; background: var(--c-pista); border: 2px solid var(--c-pista-vora); color: var(--tinta); }
    .comencar { text-align: center; margin: 20px 0 8px; }
    .comencar .btn { font-size: 1.3rem; padding: 14px 40px; }

    /* ---------- Joc ---------- */
    .cap-joc { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
    .dades { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dada { background: var(--superficie); border: 1px solid var(--vora); border-radius: 999px; padding: 4px 12px; font-size: .95rem; }
    .dada b { font-variant-numeric: tabular-nums; }
    .progres { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
    .progres i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--vora); background: var(--superficie); }
    .progres i.be { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .progres i.ajuda { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .progres i.malament { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .progres i.fet { background: var(--vora); }
    .progres i.ara { background: var(--c-info); border-color: var(--c-info-vora); color: var(--tinta); }

    .tauler { background: var(--superficie); border: 2px solid var(--vora); border-radius: var(--radi); padding: 20px 24px;
      display: flex; flex-direction: column; gap: 16px; }
    .enunciat { display: flex; align-items: center; justify-content: center; gap: 12px; text-align: center; }
    .enunciat .text { font-size: clamp(1.1rem, 2.4vw, 1.45rem); font-weight: 700; line-height: 1.4; }
    .retol { display: inline-flex; align-items: center; gap: .35em; padding: .15em .7em; margin-right: .4em; border-radius: 999px;
      border: 3px solid var(--c-info-vora); background: var(--superficie); font-weight: 900; letter-spacing: .04em; white-space: nowrap; }
    .retol b { font-size: 1.35em; line-height: 1; }
    .retol.contrari { border-style: dashed; }
    @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .retol.nou { animation: pop .35s ease-out; }
    .enunciat .clau { display: inline-block; padding: 0 .35em; border-radius: 8px; border: 2px solid var(--vora); background: var(--fons); font-weight: 900; }
    .btn-veu { font: inherit; font-size: 1.3rem; cursor: pointer; flex: none; width: 48px; height: 48px; border-radius: 50%;
      background: var(--c-pista); border: 2px solid var(--c-pista-vora); box-shadow: var(--ombra); touch-action: manipulation; color: var(--tinta); }

    .temps { height: 12px; border-radius: 999px; background: var(--fons); border: 1px solid var(--vora); overflow: hidden; }
    .temps i { display: block; height: 100%; width: 100%; background: color-mix(in srgb, var(--text-suau) 45%, var(--superficie)); border-radius: 999px; transform-origin: left; }
    .temps.poc i { background: var(--c-pista-vora); }

    /* Fàcil: la paraula gran i 4 opcions */
    .paraula-gran { text-align: center; margin: 4px 0 22px; }
    .paraula-gran span { display: inline-block; font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, system-ui, sans-serif;
      font-weight: 800; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1; letter-spacing: .04em; padding: .18em .4em .22em;
      border-radius: .25em; background: var(--superficie); border: 3px solid var(--vora); }
    .opcions-joc { display: grid; gap: clamp(8px, 1.6vw, 14px); grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 820px; width: 100%; margin: 0 auto; }
    .opcio {
      font: inherit; font-weight: 800; font-size: clamp(1.1rem, 2.4vw, 1.5rem); color: var(--text); cursor: pointer; touch-action: manipulation;
      min-height: clamp(56px, 10vh, 80px); padding: 6px 8px; background: var(--fons); border: 3px solid var(--vora); border-radius: 16px; box-shadow: var(--ombra);
      transition: transform .1s, opacity .4s; overflow-wrap: anywhere;
    }
    .opcio:active { transform: scale(.97); }
    @media (hover: hover) { .opcio:not(:disabled):hover { border-color: var(--c-info-vora); } }
    .opcio:disabled { cursor: default; }
    .opcio.errada { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); text-decoration: line-through; opacity: .55; color: var(--tinta); }
    .opcio.treta { opacity: .3; text-decoration: line-through; }
    .opcio.correcta { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .opcio.dita { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }

    /* Mitjà i Difícil: dues columnes i línies (SVG a sobre) */
    .relaciona { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(70px, .8fr) minmax(0, 1fr); align-items: center;
      max-width: 820px; width: 100%; margin: 0 auto; user-select: none; -webkit-user-select: none; touch-action: none; }
    .columna { display: flex; flex-direction: column; gap: var(--sep, 12px); }
    .columna.dreta { grid-column: 3; }
    .columna.esquerra { grid-column: 1; }
    .linies { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .linies line { stroke-width: 5; stroke-linecap: round; }
    .linies .l-nova { stroke: var(--c-info-vora); stroke-dasharray: 8 8; }
    .linies .l-feta { stroke: color-mix(in srgb, var(--text-suau) 70%, white); }
    .linies .l-be { stroke: var(--c-ok-vora); }
    .linies .l-mal { stroke: var(--c-esborrar-vora); transition: opacity .5s; }
    .linies .l-dita { stroke: var(--c-pista-vora); stroke-dasharray: 10 6; }
    .mot {
      font: inherit; font-weight: 800; font-size: var(--lletra, 1.2rem); color: var(--text); cursor: pointer; touch-action: none;
      min-height: var(--alt, 52px); padding: 4px 12px; background: var(--fons); border: 3px solid var(--vora); border-radius: 14px; box-shadow: var(--ombra);
      display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow-wrap: anywhere;
    }
    @media (hover: hover) { .mot:not(:disabled):hover { border-color: var(--c-info-vora); } }
    .mot.triat { background: var(--c-info); border-color: var(--c-info-vora); color: var(--tinta); }
    .mot.unit { border-style: solid; border-color: color-mix(in srgb, var(--text-suau) 60%, white); }
    .mot.be { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .mot.mal { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .mot.pista { outline: 3px dashed var(--c-pista-vora); outline-offset: 2px; }
    .mot.treta { opacity: .35; }
    .mot:disabled { cursor: default; }
    .senyal { flex: none; font-size: .8em; font-weight: 900; padding: 0 .4em; border-radius: 999px; background: var(--superficie); border: 2px solid var(--vora); }
    .ajuda-senyal { margin: -6px 0 0; text-align: center; font-size: .9rem; color: var(--text-suau); }

    .peu { display: flex; flex-direction: column; gap: 12px; }
    .missatge { min-height: 3.2rem; padding: 8px 12px; border-radius: var(--radi); text-align: center; background: var(--superficie);
      border: 2px solid var(--vora); font-weight: 700; font-size: 1.1rem; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .missatge small { font-weight: 500; font-size: .95rem; }
    .missatge small:empty { display: none; }
    .missatge.es-pista { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .missatge.es-error { background: var(--c-esborrar); border-color: var(--c-esborrar-vora); color: var(--tinta); }
    .missatge.es-guanyat { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    .botons-peu { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn-pista { background: var(--c-pista); border-color: var(--c-pista-vora); color: var(--tinta); }
    .btn-ok { background: var(--c-ok); border-color: var(--c-ok-vora); color: var(--tinta); }
    @keyframes sacseig { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .sacseig { animation: sacseig .25s 2; }

    /* Mòbil apaïsat: amb línies, el missatge i els botons van a la dreta del tauler */
    @media (orientation: landscape) and (max-height: 500px) {
      .tauler.amb-linies { display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, 250px); column-gap: 18px;
        grid-template-areas: "enun enun" "temps temps" "zona peu"; align-items: start; }
      .tauler.amb-linies .enunciat { grid-area: enun; }
      .tauler.amb-linies .temps { grid-area: temps; }
      .tauler.amb-linies #zona { grid-area: zona; min-width: 0; }
      .tauler.amb-linies .peu { grid-area: peu; align-self: center; }
      .tauler.amb-linies .botons-peu { flex-direction: column; align-items: stretch; }
    }
    @media (orientation: landscape) and (max-height: 820px) {
      .cap-joc { margin: 0 0 8px; }
      .cap-joc .btn { padding: 6px 14px; }
      .tauler { padding: 12px 20px; gap: 10px; }
      .missatge { min-height: 0; padding: 6px 10px; }
      h2.titol { margin: 8px 0 6px; }
      .opcions button { min-height: 46px; padding: 6px; }
      .comencar { margin: 12px 0 4px; }
    }
    @media (orientation: portrait) and (max-width: 600px), (orientation: landscape) and (max-height: 500px) {
      .barra-joc { padding: 6px 0; }
      .barra-joc h1 { font-size: 1.1rem; }
      .cap-joc { margin: 0 0 6px; gap: 6px; flex-wrap: nowrap; }
      .dada { font-size: .8rem; padding: 2px 8px; }
      .progres i { width: 8px; height: 8px; }
      .cap-joc .btn { padding: 5px 10px; font-size: .85rem; white-space: nowrap; }
      .tauler { padding: 10px; gap: 8px; }
      .enunciat .text { font-size: 1rem; }
      .paraula-gran { margin: 2px 0 10px; }
      .btn-veu { width: 38px; height: 38px; font-size: 1rem; }
      .opcions-joc { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .opcio { min-height: 48px; font-size: 1.05rem; }
      .missatge { min-height: 0; padding: 5px 8px; font-size: .95rem; }
      .missatge small { font-size: .82rem; }
      .botons-peu .btn { padding: 6px 14px; font-size: .95rem; }
      .relaciona { grid-template-columns: minmax(0, 1fr) minmax(36px, .35fr) minmax(0, 1fr); }
      .mot { padding: 0 6px; border-width: 2px; border-radius: 10px; min-height: var(--alt, 22px); }
      .ajuda-senyal { font-size: .78rem; margin: -4px 0 0; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .inici .opcions { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
      .opcions button { min-height: 38px; font-size: .92rem; }
      .opcions button small { display: none; }
      .opcions-joc { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .paraula-gran span { font-size: 2rem; }
      .paraula-gran { margin: 0 0 4px; }
      .tauler { gap: 6px; }
      .tauler.amb-linies { padding: 6px 10px; row-gap: 4px; }
      .tauler.amb-linies .enunciat .text { font-size: .9rem; }
      .mot { min-height: var(--alt, 22px); padding: 0 6px; }
    }
    @media (orientation: portrait) and (max-width: 600px) {
      .progres { display: none; }
      main.joc .inici h2.titol { font-size: .92rem; margin: 5px 0 3px; }
      main.joc .inici .grup + .grup { margin-top: 6px; }
      main.joc .inici .opcions { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      main.joc .inici .opcions button { min-height: 38px; padding: 3px; font-size: .88rem; }
      main.joc .inici .opcions button small { display: none; }
      main.joc .inici .comencar { margin: 8px 0 2px; }
      main.joc .inici .comencar .btn { font-size: 1.1rem; padding: 10px 30px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      main.joc .inici h2.titol { font-size: .88rem; margin: 2px 0 2px; }
      main.joc .inici .grup + .grup { margin-top: 4px; }
      main.joc .inici .comencar { margin: 6px 0 2px; }
      main.joc .inici .comencar .btn { font-size: 1.05rem; padding: 8px 28px; }
    }
    /* Tauleta i portàtil (criteri comú «ple», css/styles.css): el joc omple la pantalla i tot creix amb l'espai */
    @media (min-width: 601px) and (min-height: 501px) {
      .tauler { padding: clamp(14px, 2.4vh, 24px) clamp(16px, 2vw, 28px); gap: clamp(10px, 2vh, 20px); }
      .enunciat .text { font-size: clamp(1.15rem, 2.8vh, 1.6rem); }
      #zona { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
      .paraula-gran { margin: 0 0 clamp(16px, 4vh, 40px); }
      .paraula-gran span { font-size: clamp(2.4rem, min(7vw, 12vh), 6.5rem); }
      .opcions-joc { max-width: 1150px; gap: clamp(10px, 1.6vw, 20px); }
      .opcio { font-size: clamp(1.2rem, min(2.6vw, 4.2vh), 2.2rem); min-height: clamp(64px, 15vh, 140px); }
      .relaciona { max-width: 1150px; }
    }
    /* Tauleta en vertical: la lletra i les peces es calculen també per l'alçada (n'hi ha molta) */
    @media (orientation: portrait) and (min-width: 601px) and (min-height: 501px) {
      .paraula-gran span { font-size: clamp(2.6rem, 10vw, 6rem); }
      .opcio { font-size: clamp(1.3rem, 4.4vw, 2.2rem); min-height: clamp(70px, 11vh, 140px); }
      .opcions-joc { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    /* Mòbil vertical (criteri «ple»): la zona de joc omple l'alçada i les peces creixen amb la pantalla */
    @media (orientation: portrait) and (max-width: 600px) {
      #zona { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
      .paraula-gran { margin: 0 0 clamp(12px, 3vh, 30px); }
      .paraula-gran span { font-size: clamp(2rem, 11vw, 3.4rem); }
      .opcio { font-size: clamp(1.05rem, 5vw, 1.5rem); min-height: clamp(52px, 9vh, 90px); }
    }
  </style>
</head>
<body>
  <nav class="barra-joc">
    <a href="../../">← Inici</a>
    <h1>🔁 Sinònims i antònims</h1>
  </nav>

  <main class="joc ple">
    <!-- ================= INICI ================= -->
    <section class="inici" id="pantalla-inici">
      <div class="grup">
        <h2 class="titol">1. Dificultat</h2>
        <div class="opcions" id="op-nivell">
          <button type="button" data-v="facil" aria-pressed="true">🌱 Fàcil<small>una paraula i 4 opcions</small></button>
          <button type="button" data-v="mitja" aria-pressed="false">Mitjà<small>uneix 2 parelles</small></button>
          <button type="button" data-v="dificil" aria-pressed="false">Difícil<small>uneix 6 parelles i comprova</small></button>
        </div>
      </div>
      <div class="grup">
        <h2 class="titol">2. Què busquem?</h2>
        <div class="opcions" id="op-mode">
          <button type="button" data-v="sin" aria-pressed="true">＝ Sinònims<small>vol dir el mateix</small></button>
          <button type="button" data-v="ant" aria-pressed="false">≠ Antònims<small>vol dir el contrari</small></button>
          <button type="button" data-v="barr" aria-pressed="false">🔀 Barrejat<small>de tots dos</small></button>
        </div>
      </div>
      <div class="grup">
        <h2 class="titol">3. Més d'una parella?</h2>
        <div class="opcions" id="op-mes">
          <button type="button" data-v="no" aria-pressed="true">No<small>sempre una de bona</small></button>
          <button type="button" data-v="si" aria-pressed="false">Sí<small>de vegades n'hi ha dues</small></button>
        </div>
      </div>
      <div class="grup" id="grup-temps">
        <h2 class="titol">4. Temps</h2>
        <div class="opcions" id="op-temps">
          <button type="button" data-v="0" aria-pressed="true">Sense temps</button>
          <button type="button" data-v="1" aria-pressed="false">Normal<small id="temps-normal">15 s per paraula</small></button>
          <button type="button" data-v="2" aria-pressed="false">Ràpid<small id="temps-rapid">10 s per paraula</small></button>
        </div>
      </div>
      <div class="grup">
        <h2 class="titol">5. Quina lletra?</h2>
        <div class="opcions" id="op-lletra">
          <button type="button" data-v="maj" aria-pressed="true">MAJÚSCULA</button>
          <button type="button" data-v="min" aria-pressed="false">minúscula</button>
        </div>
      </div>
      <div class="grup">
        <h2 class="titol">6. Lectura en veu alta</h2>
        <div class="opcions" id="op-veu">
          <button type="button" data-v="no" aria-pressed="true">🔇 Sense veu</button>
          <button type="button" data-v="si" aria-pressed="false">🔊 Amb veu</button>
        </div>
        <p class="avis-veu" id="avis-veu" hidden>Aquest dispositiu no té veu en català. Es pot afegir a Configuració → Accessibilitat → Contingut llegit → Veus → Català.</p>
      </div>
      <div class="comencar"><button class="btn" id="btn-comencar" type="button">Comença! 🔁</button></div>
    </section>

    <!-- ================= JOC ================= -->
    <section id="pantalla-joc" hidden>
      <div class="cap-joc">
        <div class="dades" id="dades"></div>
        <button class="btn" id="btn-nova" type="button">↺ Nova partida</button>
      </div>
      <div class="tauler" id="tauler">
        <div class="enunciat"><div class="text" id="enunciat"></div><button type="button" class="btn-veu" id="btn-veu" aria-label="Escolta" hidden>🔊</button></div>
        <div class="temps" id="temps" aria-hidden="true" hidden><i id="temps-barra"></i></div>
        <div id="zona"></div>
        <div class="peu franja">
          <div class="missatge" id="missatge" aria-live="polite"><span id="msg-text"></span><small id="msg-extra"></small></div>
          <div class="botons-peu">
            <button class="btn btn-pista" id="btn-pista" type="button">💡 <span class="txt-llarg">Vull una pista</span><span class="txt-curt">Pista</span></button>
            <button class="btn btn-ok" id="btn-comprova" type="button" hidden>Comprova ✓</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/pantalla.js"></script>
  <script src="../../js/preferencies.js"></script>
  <script src="../../js/celebracio.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const config = { nivell: 'facil', mode: 'sin', mes: 'no', temps: 0, lletra: 'maj', veu: 'no' };
    const RONDES = { facil: 10, mitja: 5, dificil: 3 };
    const PARELLES = { mitja: 2, dificil: 6 };
    const TEMPS = { facil: [0, 15, 10], mitja: [0, 30, 20], dificil: [0, 90, 60] };   // segons per paraula o tauler
    let G = null, PER_ID = {}, COMP = {};
    let total, idx, resultats, P, errors, ambAjuda, bloquejat, seguentT, animacio, limit;

    const aleatori = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const barrejar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const triar = a => a[Math.floor(Math.random() * a.length)];
    const format = t => config.lletra === 'maj' ? t.toLocaleUpperCase('ca') : t;
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

    // ---------------- Inici ----------------
    function grupOpcions(id, clau, num) {
      $(id).addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
        config[clau] = num ? Number(b.dataset.v) : b.dataset.v;
        if (clau === 'nivell') textosTemps();
      });
    }
    grupOpcions('op-nivell', 'nivell'); grupOpcions('op-mode', 'mode'); grupOpcions('op-mes', 'mes');
    grupOpcions('op-temps', 'temps', true); grupOpcions('op-lletra', 'lletra'); grupOpcions('op-veu', 'veu');
    $('op-veu').addEventListener('click', () => { $('avis-veu').hidden = !(config.veu === 'si' && !veuCa); });
    function textosTemps() {
      const t = TEMPS[config.nivell], que = config.nivell === 'facil' ? 'per paraula' : 'per tauler';
      $('temps-normal').textContent = `${t[1]} s ${que}`; $('temps-rapid').textContent = `${t[2]} s ${que}`;
    }
    textosTemps();
    if (!Preferencies.temps()) { $('grup-temps').hidden = true; config.temps = 0; }

    $('btn-comencar').addEventListener('click', comencar);
    $('btn-nova').addEventListener('click', () => { aturar(); clearTimeout(seguentT); aturarVeu(); Celebracio.tancar(); $('pantalla-joc').hidden = true; $('pantalla-inici').hidden = false; });
    $('btn-pista').addEventListener('click', () => { if (!bloquejat && P) { ambAjuda = true; P.pista(true); pintarDades(); } });
    $('btn-comprova').addEventListener('click', () => { if (!bloquejat && P && P.comprovar) P.comprovar(); });

    async function carregar() {
      if (G) return;
      const r = await fetch('paraules.json');
      G = (await r.json()).grups;
      G.forEach(g => PER_ID[g.id] = g);
      // Famílies: grups units per relacions de contrari (perquè en un tauler no n'hi hagi dues de relacionades)
      let n = 0;
      G.forEach(g => {
        if (COMP[g.id] !== undefined) return;
        const pila = [g.id]; COMP[g.id] = n;
        while (pila.length) { const x = pila.pop(); PER_ID[x].contraris.forEach(c => { if (COMP[c] === undefined) { COMP[c] = n; pila.push(c); } }); }
        n++;
      });
    }

    async function comencar() {
      try { await carregar(); } catch { alert("No s'han pogut carregar les paraules. Torna-ho a provar."); return; }
      if (!Preferencies.temps()) config.temps = 0;
      total = RONDES[config.nivell]; idx = -1; resultats = [];
      iniciBarr = Math.random() < .5 ? 0 : 1; ultimaRel = null;
      $('temps').hidden = !config.temps;
      $('pantalla-inici').hidden = true; $('pantalla-joc').hidden = false;
      window.scrollTo({ top: 0 });
      seguent();
    }

    function seguent() {
      clearTimeout(seguentT); aturarVeu();
      idx++;
      if (idx >= total) return final();
      errors = 0; ambAjuda = false; bloquejat = false;
      $('zona').innerHTML = '';
      $('btn-pista').hidden = false; $('btn-pista').disabled = false;
      $('btn-comprova').hidden = true;
      $('tauler').classList.toggle('amb-linies', config.nivell !== 'facil');
      P = config.nivell === 'facil' ? preguntaFacil() : tauler(PARELLES[config.nivell]);
      P.iniciar();
      pintarDades();
      $('btn-veu').hidden = !veuDisponible();
      iniciarTemps();
    }

    // Rètol gran: «＝ EL MATEIX» o «≠ EL CONTRARI». Fa «pop» quan canvia respecte a l'anterior
    let ultimaRel = null;
    function retol(rel) {
      const r = el('span', 'retol' + (rel === 'ant' ? ' contrari' : '') + (ultimaRel && ultimaRel !== rel ? ' nou' : ''));
      r.appendChild(el('b', '', rel === 'sin' ? '＝' : '≠'));
      r.appendChild(document.createTextNode(rel === 'sin' ? 'EL MATEIX' : 'EL CONTRARI'));
      ultimaRel = rel;
      return r;
    }
    let iniciBarr = 0;   // Barrejat: amb quin tipus comencen els taulers
    // Relació d'aquesta pregunta o línia: 'sin' o 'ant'
    const relacio = () => config.mode === 'barr' ? triar(['sin', 'ant']) : config.mode;
    // Paraules bones per a la paraula w del grup g
    function bones(g, w, rel) {
      if (rel === 'sin') return g.paraules.filter(x => x !== w);
      return g.contraris.flatMap(c => PER_ID[c].paraules);
    }
    // Grups on es pot fer aquesta relació (amb prou paraules si en volem dues)
    function grupsPossibles(rel, dues) {
      return G.filter(g => rel === 'sin' ? g.paraules.length >= (dues ? 3 : 2)
        : g.contraris.length && g.contraris.flatMap(c => PER_ID[c].paraules).length >= (dues ? 2 : 1));
    }

    // ---------------- Fàcil: una paraula i 4 opcions ----------------
    function preguntaFacil() {
      let rel = relacio();
      const volDues = config.mes === 'si' && Math.random() < .5;
      let cand = grupsPossibles(rel, volDues);
      if (!cand.length) { rel = rel === 'sin' ? 'ant' : 'sin'; cand = grupsPossibles(rel, volDues); }
      const g = triar(cand);
      const w = triar(g.paraules.filter(x => bones(g, x, rel).length >= (volDues ? 2 : 1)));
      const totesBones = bones(g, w, rel);
      const correctes = barrejar(totesBones).slice(0, volDues ? 2 : 1);
      // Opcions falses: d'altres famílies
      const falses = barrejar(G.filter(x => COMP[x.id] !== COMP[g.id])).slice(0, 4 - correctes.length).map(x => triar(x.paraules));
      const opcions = barrejar([...correctes, ...falses]);
      let trobades = 0, errorsMot = 0;
      const nom = rel === 'sin' ? 'vol dir el mateix que' : 'vol dir el contrari de';
      const pr = {
        correctes,
        textVeu: () => `Quina paraula ${nom} ${w}?`,
        iniciar() {
          const e = $('enunciat'); e.innerHTML = '';
          e.append(retol(rel), `${correctes.length > 1 ? 'Quines paraules volen' : 'Quina paraula vol'} dir ${rel === 'sin' ? 'el mateix que' : 'el contrari de'}:`);
          const z = $('zona');
          const pg = el('p', 'paraula-gran'); pg.appendChild(el('span', '', format(w))); z.appendChild(pg);
          const g2 = el('div', 'opcions-joc');
          opcions.forEach(o => { const b = el('button', 'opcio opcio-resposta', format(o)); b.type = 'button'; b.dataset.v = o; g2.appendChild(b); });
          g2.addEventListener('click', ev => { const b = ev.target.closest('.opcio'); if (b && !b.disabled && !bloquejat) tria(b); });
          z.appendChild(g2);
          mostrar(correctes.length > 1 ? 'N\'hi ha dues de bones: troba-les totes dues' : 'Fes clic a la bona', rel === 'sin' ? 'Busca la que vol dir el mateix.' : 'Busca la que vol dir el contrari.');
        },
        pista(manual) {
          // Treu una opció falsa i explica què busquem
          const restants = [...$('zona').querySelectorAll('.opcio:not(:disabled)')].filter(b => !correctes.includes(b.dataset.v));
          if (restants.length > 1) { const t = triar(restants); t.classList.add('treta'); t.disabled = true; }
          const txt = rel === 'sin' ? `Prova de dir una frase amb «${format(w)}» i canvia-la per cada opció: quina vol dir el mateix?`
            : `Pensa el contrari de «${format(w)}»: si una cosa no és ${format(w)}, què és?`;
          mostrar(manual ? '💡 Pista' : `No és aquesta`, txt + (restants.length > 1 ? ' He tret una opció que no hi té res a veure.' : ''), manual ? 'pista' : 'pista');
          $('btn-pista').disabled = true;
        },
      };
      function tria(b) {
        const v = b.dataset.v;
        if (correctes.includes(v)) {
          b.classList.add('correcta'); b.disabled = true; trobades++;
          if (trobades < correctes.length) { mostrar('✓ Molt bé!', 'Encara n\'hi ha una altra de bona.', 'guanyat'); return; }
          bloquejat = true; aturar();
          $('zona').querySelectorAll('.opcio').forEach(x => x.disabled = true);
          acabar(errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio('✓ Molt bé!'),
            `${format(w)} ${rel === 'sin' ? '＝' : '≠'} ${correctes.map(format).join(' i ')}`, b);
          return;
        }
        errors++; errorsMot++;
        b.classList.add('errada'); b.disabled = true; sacsejar(b);
        if (config.temps || errorsMot >= 3) return mostrarFacil();
        if (errorsMot === 1) mostrar(`«${format(v)}» no ${rel === 'sin' ? 'vol dir el mateix' : 'és el contrari'}`, 'Torna-ho a provar.', 'error');
        else pr.pista(false);
        pintarDades();
      }
      function mostrarFacil() {
        bloquejat = true; aturar();
        $('zona').querySelectorAll('.opcio').forEach(x => { x.disabled = true; if (correctes.includes(x.dataset.v) && !x.classList.contains('correcta')) x.classList.add(config.temps ? 'correcta' : 'dita'); });
        acabar('malament', config.temps && errors === 0 ? "S'ha acabat el temps ⏱" : 'Era aquesta',
          `${format(w)} ${rel === 'sin' ? '＝' : '≠'} ${correctes.map(format).join(' i ')}`);
      }
      pr.temps0 = mostrarFacil;
      return pr;
    }

    // ---------------- Mitjà i Difícil: unir amb línies ----------------
    function tauler(n) {
      const finalCheck = config.nivell === 'dificil';
      // n paraules a l'esquerra, cadascuna d'una família diferent
      const usades = new Set(), items = [];
      const relT = config.mode === 'barr' ? ((idx + iniciBarr) % 2 ? 'ant' : 'sin') : config.mode;   // tot el tauler del mateix tipus
      for (let t = 0; t < 400 && items.length < n; t++) {
        let rel = relT;
        const volDues = config.mes === 'si' && Math.random() < .4 && items.filter(x => x.parelles.length > 1).length < (n > 2 ? 2 : 1);
        let cand = grupsPossibles(rel, volDues).filter(g => !usades.has(COMP[g.id]));
        if (!cand.length) cand = grupsPossibles(rel, false).filter(g => !usades.has(COMP[g.id]));
        if (!cand.length) break;
        const g = triar(cand);
        const ws = g.paraules.filter(x => bones(g, x, rel).length >= (volDues ? 2 : 1));
        if (!ws.length) continue;
        const w = triar(ws);
        const parelles = barrejar(bones(g, w, rel)).slice(0, volDues ? 2 : 1);
        usades.add(COMP[g.id]);
        items.push({ w, rel, parelles, errors: 0 });
      }
      const dretes = barrejar(items.flatMap((it, i) => it.parelles.map(p => ({ w: p, de: i }))));
      const unions = [];   // {e: índex esquerra, d: índex dreta, estat: 'feta'|'be'|'mal'|'dita'}
      let triat = null, arrossega = null;
      const barr = false;   // ja no hi ha senyals per paraula: tot el tauler és d'un tipus
      const pr = {
        items, dretes,
        textVeu: () => `${items.map(it => it.w).join(', ')}. I a l'altra banda: ${dretes.map(d => d.w).join(', ')}.`,
        iniciar() {
          const e = $('enunciat'); e.innerHTML = '';
          e.append(retol(relT), `Uneix cada paraula amb la que vol dir ${relT === 'sin' ? 'el mateix' : 'el contrari'}:`);
          const z = $('zona');
          if (barr) z.appendChild(el('p', 'ajuda-senyal', '＝ vol dir el mateix · ≠ vol dir el contrari'));
          const r = el('div', 'relaciona'); r.id = 'relaciona';
          const ce = el('div', 'columna esquerra'), cd = el('div', 'columna dreta');
          items.forEach((it, i) => {
            const b = el('button', 'mot'); b.type = 'button'; b.dataset.c = 'e'; b.dataset.i = i;
            b.appendChild(el('span', '', format(it.w)));
            if (barr) b.appendChild(el('span', 'senyal', it.rel === 'sin' ? '＝' : '≠'));
            b.setAttribute('aria-label', `${it.w}, ${it.rel === 'sin' ? 'vol dir el mateix' : 'vol dir el contrari'}`);
            ce.appendChild(b);
          });
          dretes.forEach((d, j) => { const b = el('button', 'mot', format(d.w)); b.type = 'button'; b.dataset.c = 'd'; b.dataset.i = j; cd.appendChild(b); });
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.classList.add('linies'); svg.id = 'linies';
          r.append(ce, cd, svg);
          z.appendChild(r);
          ajustarMides();
          r.addEventListener('pointerdown', baixa);
          r.addEventListener('click', clic);
          if (finalCheck) $('btn-comprova').hidden = false;
          const mes = dretes.length > items.length ? ' Alguna paraula en té dues.' : '';
          mostrar(finalCheck ? 'Fes les línies i prem «Comprova» quan vulguis' : 'Uneix les parelles',
            `Arrossega d'una paraula a l'altra, o fes clic a les dues.${mes}`);
          dibuixar();
        },
        pista(manual) {
          // Marca en groc una paraula de l'esquerra que encara no està bé i treu una dreta que no li toca
          const pendents = items.map((it, i) => i).filter(i => !acabada(i));
          if (!pendents.length) return;
          const i = triar(pendents), it = items[i];
          const mots = $('relaciona').querySelectorAll('.mot');
          mots.forEach(m => m.classList.remove('pista'));
          const esq = $('relaciona').querySelector(`.mot[data-c="e"][data-i="${i}"]`); esq.classList.add('pista');
          mostrar(manual ? '💡 Pista' : 'Pista', `«${format(it.w)}»: busca la que vol dir ${it.rel === 'sin' ? 'el mateix' : 'el contrari'}. Llegeix-les una per una amb aquesta paraula.`, 'pista');
          if (manual) $('btn-pista').disabled = true;
        },
        comprovar,
      };

      function acabada(i) { return items[i].parelles.every(p => unions.some(u => u.e === i && dretes[u.d].w === p && dretes[u.d].de === i && u.estat === 'be')); }
      const motDe = (c, i) => $('relaciona').querySelector(`.mot[data-c="${c}"][data-i="${i}"]`);

      // --- Ratolí / dit: arrossegar una línia, o clic-clic ---
      function baixa(ev) {
        const m = ev.target.closest('.mot'); if (!m || m.disabled || bloquejat) return;
        arrossega = { m, x0: ev.clientX, y0: ev.clientY, mou: false };
        const mou = e2 => {
          if (!arrossega) return;
          if (!arrossega.mou && Math.hypot(e2.clientX - arrossega.x0, e2.clientY - arrossega.y0) < 8) return;
          arrossega.mou = true;
          dibuixar({ m: arrossega.m, x: e2.clientX, y: e2.clientY });
        };
        const puja = e2 => {
          removeEventListener('pointermove', mou); removeEventListener('pointerup', puja); removeEventListener('pointercancel', puja);
          const a = arrossega; arrossega = null;
          if (!a || !a.mou) return;          // era un clic: ho fa clic()
          evitaClic = true; setTimeout(() => { evitaClic = false; }, 0);   // el clic que el navegador envia just després d'arrossegar
          const sota = document.elementFromPoint(e2.clientX, e2.clientY);
          const m2 = sota && sota.closest('.mot');
          if (m2 && !m2.disabled && m2.dataset.c !== a.m.dataset.c) unir(a.m, m2);
          dibuixar();
        };
        addEventListener('pointermove', mou); addEventListener('pointerup', puja); addEventListener('pointercancel', puja);
      }
      let evitaClic = false;
      function clic(ev) {
        const m = ev.target.closest('.mot'); if (!m || m.disabled || bloquejat) return;
        if (evitaClic) return;
        if (!triat) { seleccionar(m); return; }
        if (triat === m) { seleccionar(null); return; }
        if (triat.dataset.c === m.dataset.c) { seleccionar(m); return; }
        unir(triat, m); seleccionar(null);
      }
      function seleccionar(m) {
        $('relaciona').querySelectorAll('.mot.triat').forEach(x => x.classList.remove('triat'));
        triat = m; if (m) m.classList.add('triat');
        dibuixar();
      }

      function unir(a, b) {
        const esq = a.dataset.c === 'e' ? a : b, dre = a.dataset.c === 'e' ? b : a;
        const i = Number(esq.dataset.i), j = Number(dre.dataset.i);
        const d = dretes[j];
        if (unions.some(u => u.d === j && u.estat === 'be')) return;       // ja està bé: no es toca
        // Una paraula de la dreta només pot tenir una línia: si en tenia, la treu
        for (let k = unions.length - 1; k >= 0; k--) if (unions[k].d === j) unions.splice(k, 1);
        const bona = d.de === i;
        if (finalCheck) {
          // Difícil: una paraula de l'esquerra no pot tenir més línies que parelles; si en té massa, treu la més vella
          const seves = unions.filter(u => u.e === i && u.estat !== 'be');
          const lliures = items[i].parelles.length - unions.filter(u => u.e === i && u.estat === 'be').length;
          if (seves.length && seves.length >= lliures) unions.splice(unions.indexOf(seves[0]), 1);
          unions.push({ e: i, d: j, estat: 'feta' });
          esq.classList.add('unit'); dre.classList.add('unit');
          marcarUnits(); dibuixar();
          const fetes = unions.length, cal = dretes.length;
          mostrar(fetes < cal ? `Portes ${fetes} de ${cal} línies` : 'Ja les tens totes', fetes < cal ? 'Pots prémer «Comprova» quan vulguis per veure si van bé.' : 'Prem «Comprova».');
          return;
        }
        // Mitjà: es comprova cada línia
        if (bona) {
          unions.push({ e: i, d: j, estat: 'be' });
          dre.classList.add('be'); dre.disabled = true;
          if (acabada(i)) { esq.classList.add('be'); esq.disabled = true; esq.classList.remove('pista'); }
          dibuixar();
          if (items.every((_, k) => acabada(k))) {
            bloquejat = true; aturar();
            return acabar(errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio('✓ Molt bé!'), 'Totes les parelles estan bé.', esq);
          }
          mostrar('✓ Molt bé!', items[i].parelles.length > 1 && !acabada(i) ? `«${format(items[i].w)}» encara en té una altra.` : 'Continua.', 'guanyat');
        } else {
          errors++; items[i].errors++;
          const u = { e: i, d: j, estat: 'mal' }; unions.push(u); dibuixar();
          sacsejar(dre);
          setTimeout(() => { const k = unions.indexOf(u); if (k >= 0) { unions.splice(k, 1); dibuixar(); } }, 800);
          if (config.temps) { mostrar('No van juntes', 'Torna-ho a provar.', 'error'); pintarDades(); return; }
          if (items[i].errors >= 3) return mostrarTauler();
          if (items[i].errors === 1) mostrar(`«${format(items[i].w)}» i «${format(d.w)}» no van juntes`, 'Torna-ho a provar.', 'error');
          else { ambAjuda = true; pistaDe(i); }
          pintarDades();
        }
      }
      function pistaDe(i) {
        const it = items[i];
        $('relaciona').querySelectorAll('.mot').forEach(m => m.classList.remove('pista'));
        motDe('e', i).classList.add('pista');
        mostrar(`«${format(it.w)}» no va amb aquesta`, `Pista: busca la que vol dir ${it.rel === 'sin' ? 'el mateix' : 'el contrari'} que «${format(it.w)}».`, 'pista');
      }
      function marcarUnits() {
        $('relaciona').querySelectorAll('.mot').forEach(m => {
          if (m.disabled) return;
          const c = m.dataset.c, i = Number(m.dataset.i);
          m.classList.toggle('unit', unions.some(u => (c === 'e' ? u.e : u.d) === i));
        });
      }
      // Difícil: comprovar totes les línies alhora
      let comprovacions = 0;
      // Es poden comprovar les línies que portes, encara que no les hagis fet totes
      function comprovar() {
        const pendents = unions.filter(u => u.estat === 'feta');
        const cal = dretes.length;
        if (!pendents.length) { mostrar('Encara no hi ha cap línia nova per comprovar', 'Uneix alguna parella i torna a prémer «Comprova».', 'pista'); return; }
        let mal = 0;
        pendents.forEach(u => {
          if (dretes[u.d].de === u.e) { u.estat = 'be'; const d = motDe('d', u.d); d.classList.remove('unit'); d.classList.add('be'); d.disabled = true; }
          else { u.estat = 'mal'; mal++; }
        });
        items.forEach((_, i) => { if (acabada(i)) { const m = motDe('e', i); m.classList.remove('unit', 'pista'); m.classList.add('be'); m.disabled = true; } });
        dibuixar();
        const fetes = unions.filter(u => u.estat === 'be').length;
        if (fetes === cal) { bloquejat = true; aturar(); return acabar(errors === 0 && !ambAjuda ? 'be' : 'ajuda', Preferencies.felicitacio('✓ Totes bé!'), errors ? 'Les has corregit totes.' : 'A la primera!', $('relaciona')); }
        if (!mal) { mostrar(`✓ ${pendents.length === 1 ? 'La línia que has fet està bé' : `Les ${pendents.length} línies que has fet estan bé`}`, `Te'n ${cal - fetes === 1 ? 'falta 1' : `falten ${cal - fetes}`}.`, 'guanyat'); return; }
        comprovacions++;   // només compten les comprovacions amb errors
        errors += mal;
        if (config.temps || comprovacions >= 3) return mostrarTauler();
        const bonesAra = pendents.length - mal;
        mostrar(`${mal} ${mal === 1 ? 'línia no està bé' : 'línies no estan bé'}${bonesAra ? ` i ${bonesAra} sí` : ''}`, comprovacions === 1 ? 'Les roses no van juntes: torna-les a fer.' : 'Pista: llegeix cada parella en veu baixa. Vol dir el mateix? I el contrari?', comprovacions === 1 ? 'error' : 'pista');
        if (comprovacions >= 2) ambAjuda = true;
        $('btn-comprova').disabled = true;
        setTimeout(() => {
          for (let k = unions.length - 1; k >= 0; k--) if (unions[k].estat === 'mal') unions.splice(k, 1);
          marcarUnits(); dibuixar(); $('btn-comprova').disabled = false;
        }, 1300);
        pintarDades();
      }
      function mostrarTauler() {
        bloquejat = true; aturar();
        for (let k = unions.length - 1; k >= 0; k--) if (unions[k].estat !== 'be') unions.splice(k, 1);
        dretes.forEach((d, j) => { if (!unions.some(u => u.d === j)) unions.push({ e: d.de, d: j, estat: 'dita' }); });
        $('relaciona').querySelectorAll('.mot').forEach(m => { m.disabled = true; m.classList.remove('unit', 'triat', 'pista'); });
        dibuixar();
        $('btn-comprova').hidden = true;
        acabar('malament', config.temps && !errors ? "S'ha acabat el temps ⏱" : 'Mira com anaven', 'Les línies grogues són les que faltaven.');
      }
      pr.temps0 = mostrarTauler;

      // --- Dibuix de les línies ---
      function centre(m, costat) {
        const r = $('relaciona').getBoundingClientRect(), b = m.getBoundingClientRect();
        return { x: (costat === 'e' ? b.right : b.left) - r.left, y: b.top + b.height / 2 - r.top };
      }
      function dibuixar(temp) {
        const svg = $('linies'); if (!svg) return;
        svg.innerHTML = '';
        const linia = (a, b, cls) => {
          const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
          l.setAttribute('class', cls); svg.appendChild(l);
        };
        unions.forEach(u => linia(centre(motDe('e', u.e), 'e'), centre(motDe('d', u.d), 'd'),
          { feta: 'l-feta', be: 'l-be', mal: 'l-mal', dita: 'l-dita' }[u.estat]));
        if (temp) {
          const r = $('relaciona').getBoundingClientRect();
          linia(centre(temp.m, temp.m.dataset.c), { x: temp.x - r.left, y: temp.y - r.top }, 'l-nova');
        }
        if (finalCheck) unions.filter(u => u.estat === 'mal').forEach(u => { motDe('d', u.d).classList.add('mal'); setTimeout(() => motDe('d', u.d) && motDe('d', u.d).classList.remove('mal'), 1300); });
      }
      pr.redibuixar = () => { ajustarMides(); dibuixar(); };
      return pr;
    }

    // Mida de les paraules segons quantes files hi ha i l'alçada de la pantalla
    function ajustarMides() {
      const r = $('relaciona'); if (!r) return;
      const files = Math.max(r.querySelector('.esquerra').children.length, r.querySelector('.dreta').children.length);
      const alCostat = getComputedStyle($('tauler')).display === 'grid';   // missatge a la dreta
      const peu = $('tauler').querySelector('.peu');
      const reserva = alCostat ? (innerHeight < 520 ? 22 : 34) : peu.offsetHeight + 34;
      const lliure = Math.max(120, innerHeight - (r.getBoundingClientRect().top + window.scrollY) - reserva);
      const baix = innerHeight < 520 || innerWidth < 600;   // mòbil: paraules més baixes
      const sep = Math.max(baix ? 3 : 4, Math.min(14, lliure * .03));
      const gran = matchMedia('(min-width: 601px) and (min-height: 501px)').matches;   // criteri «ple»: paraules més grans
      const alt = Math.max(baix ? 20 : 26, Math.min(gran ? 92 : 60, (lliure - sep * (files - 1)) / files));
      r.style.setProperty('--alt', alt + 'px');
      r.style.setProperty('--sep', sep + 'px');
      r.style.setProperty('--lletra', Math.max(baix ? .72 : .78, Math.min(gran ? 1.75 : 1.3, alt / 42)) + 'rem');
    }
    addEventListener('resize', () => { if (P && P.redibuixar && !$('pantalla-joc').hidden) P.redibuixar(); });

    // ---------------- Acabar una paraula o tauler ----------------
    function acabar(r, titol, extra, origen) {
      resultats.push(r);
      $('btn-pista').disabled = true; $('btn-comprova').hidden = true;
      mostrar(titol, extra, r === 'malament' ? 'pista' : 'guanyat');
      if (r !== 'malament') Celebracio.petita(origen || $('missatge'));
      pintarDades();
      seguentT = Pantalla.despres(seguent, r === 'malament' ? 3000 : config.nivell === 'facil' ? 1500 : 1800, r === 'malament');
    }

    // ---------------- Temps ----------------
    function iniciarTemps() {
      aturar();
      if (!config.temps) return;
      const totalMs = TEMPS[config.nivell][config.temps] * 1000;
      limit = performance.now() + totalMs;
      const barra = $('temps-barra');
      const pas = () => {
        const queda = limit - performance.now();
        barra.style.transform = `scaleX(${Math.max(0, queda / totalMs)})`;
        $('temps').classList.toggle('poc', queda <= 3000);
        if (queda <= 0) { if (!bloquejat && P) P.temps0(); return; }
        animacio = requestAnimationFrame(pas);
      };
      pas();
    }
    function aturar() { cancelAnimationFrame(animacio); animacio = null; }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || $('pantalla-joc').hidden || bloquejat || !config.temps) return;
      iniciarTemps();
    });

    // ---------------- Final ----------------
    function final() {
      aturar();
      const nets = resultats.filter(r => r === 'be').length;
      const mal = resultats.filter(r => r === 'malament').length;
      const comptar = Preferencies.errors();
      const que = config.nivell === 'facil' ? 'paraules' : 'taulers';
      let titol = nets === total ? 'Tot a la primera!' : 'Partida acabada!';
      let subtitol = `${nets} de ${total} ${que} a la primera`;
      const estrelles = nets === total ? 3 : mal === 0 ? 2 : 1;
      if (comptar) {
        const clau = `appjocs.sinonims.record.${config.nivell}.${config.mode}.${config.mes}.${config.temps}`;
        let record = null; try { const v = localStorage.getItem(clau); record = v === null ? null : Number(v); } catch {}
        const nou = record === null || nets > record;
        if (nou) { try { localStorage.setItem(clau, String(nets)); } catch {} }
        subtitol += nou ? (record !== null ? ' · 🏅 Nou rècord!' : '') : ` · Rècord: ${record}`;
      } else { titol = 'Partida acabada!'; subtitol = `Has fet ${total} ${que}.`; }
      mostrar('🎉 ' + titol, subtitol, 'guanyat');
      Celebracio.gran({ titol, subtitol, emoji: nets === total ? '🏆' : '🔁', estrelles });
    }

    // ---------------- Dades i missatges ----------------
    function pintarDades() {
      const comptar = Preferencies.errors();
      const punts = Array.from({ length: total }, (_, i) =>
        `<i class="${i < resultats.length ? (comptar ? resultats[i] : 'fet') : i === resultats.length ? 'ara' : ''}"></i>`).join('');
      const nom = config.nivell === 'facil' ? 'Paraula' : 'Tauler';
      let html = `<span class="dada">${nom} <b>${Math.min(idx + 1, total)}</b>/${total} <span class="progres">${punts}</span></span>`;
      if (comptar) html += `<span class="dada">A la primera: <b>${resultats.filter(r => r === 'be').length}</b></span>`;
      $('dades').innerHTML = html;
    }
    function sacsejar(x) { x.classList.remove('sacseig'); void x.offsetWidth; x.classList.add('sacseig'); }
    function mostrar(t, extra = '', estat = '') {
      const m = $('missatge');
      $('msg-text').textContent = t; $('msg-extra').textContent = extra;
      m.classList.remove('es-pista', 'es-error', 'es-guanyat');
      if (estat) m.classList.add('es-' + estat);
    }

    // ---------------- Veu ----------------
    let veuCa = null;
    function buscarVeu() {
      if (!('speechSynthesis' in window)) return;
      veuCa = speechSynthesis.getVoices().find(v => /^ca(-|_|$)/i.test(v.lang)) || null;
      $('btn-veu').hidden = !veuDisponible() || $('pantalla-joc').hidden;
      $('avis-veu').hidden = !(config.veu === 'si' && !veuCa);
    }
    const veuDisponible = () => config.veu === 'si' && !!veuCa;
    if ('speechSynthesis' in window) { buscarVeu(); speechSynthesis.addEventListener?.('voiceschanged', buscarVeu); }
    function aturarVeu() { try { speechSynthesis.cancel(); } catch {} }
    $('btn-veu').addEventListener('click', () => {
      if (!veuDisponible() || !P) return;
      aturarVeu();
      const u = new SpeechSynthesisUtterance(P.textVeu().toLocaleLowerCase('ca'));
      u.voice = veuCa; u.lang = veuCa.lang; u.rate = .85;
      speechSynthesis.speak(u);
    });

    Pantalla.avisOrientacio('sinonims', { dins: document.getElementById('pantalla-inici') });
  </script>
</body>
